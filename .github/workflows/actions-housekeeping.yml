name: Actions housekeeping

on:
  schedule:
    - cron: '41 3 * * 0'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/actions-housekeeping.yml']

permissions:
  contents: read
  actions: write

concurrency:
  group: actions-housekeeping
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete expired Actions records
        uses: actions/github-script@v7
        with:
          script: |
            const scope = { owner: context.repo.owner, repo: context.repo.repo };
            const cutoff = Date.now() - 7 * 24 * 60 * 60 * 1000;
            const limit = 100;
            const currentRun = String(context.runId);
            // Collect before deleting so pagination does not skip shifted records.
            const runs = [];
            for await (const { data } of github.paginate.iterator(
              github.rest.actions.listWorkflowRunsForRepo,
              { ...scope, per_page: 100 }
            )) {
              for (const run of data) {
                if (String(run.id) !== currentRun && run.status === 'completed' &&
                    Date.parse(run.updated_at) < cutoff) runs.push(run.id);
                if (runs.length >= limit) break;
              }
              if (runs.length >= limit) break;
            }
            const artifacts = [];
            for await (const { data } of github.paginate.iterator(
              github.rest.actions.listArtifactsForRepo,
              { ...scope, per_page: 100 }
            )) {
              for (const artifact of data) {
                if (Date.parse(artifact.created_at) < cutoff) artifacts.push(artifact.id);
                if (artifacts.length >= limit) break;
              }
              if (artifacts.length >= limit) break;
            }
            let removedArtifacts = 0, removedRuns = 0, failed = 0;
            async function remove(operation, params) {
              try {
                await operation({ ...scope, ...params });
                return true;
              } catch (error) {
                if (error.status === 404) return false;
                failed++;
                core.warning(`Cleanup failed (${error.status ?? 'unknown'}): ${JSON.stringify(params)}`);
                return false;
              }
            }
            for (const id of artifacts) {
              if (await remove(github.rest.actions.deleteArtifact, { artifact_id: id })) removedArtifacts++;
            }
            for (const id of runs) {
              if (await remove(github.rest.actions.deleteWorkflowRun, { run_id: id })) removedRuns++;
            }
            await core.summary.addHeading('Actions housekeeping').addTable([
              [{ data: 'Item', header: true }, { data: 'Count', header: true }],
              ['Deleted artifacts', String(removedArtifacts)],
              ['Deleted completed runs', String(removedRuns)],
              ['Errors', String(failed)],
              ['Maximum per kind', String(limit)]
            ]).write();
            if (failed) core.setFailed('Some Actions records could not be deleted; inspect warnings.');
