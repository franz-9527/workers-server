name: Admin operations isolated smoke
on:
  push:
    paths:
      - 'audit-stage/admin-ops/**'
      - '.github/workflows/audit-admin-ops-once.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: PHP syntax
        run: |
          php -l audit-stage/admin-ops/server/app/Application/Admin/AdminWorkbenchOperations.php
          php -l audit-stage/admin-ops/server/app/Domain/Admin/WorkbenchTaskProjection.php
          php -l audit-stage/admin-ops/server/app/Infrastructure/Persistence/AdminFollowupWorkbenchTaskSource.php
          php -l audit-stage/admin-ops/server/app/Infrastructure/Persistence/AdminWorkbenchCapabilityReader.php
          php -l audit-stage/admin-ops/server/app/Infrastructure/Persistence/DatabaseAdminWorkbenchOperationsRepository.php
          php -l audit-stage/admin-ops/server/app/Infrastructure/Scheduling/PlatformOrderAutoPublishTask.php
          php -l audit-stage/admin-ops/server/tests/smoke.php
      - name: PHP boundary smoke
        run: php audit-stage/admin-ops/server/tests/smoke.php
      - name: Mini program syntax and behavior
        run: |
          node --check audit-stage/admin-ops/miniprogram/pages/adminWorkbench/detail.js
          node --check audit-stage/admin-ops/tools/test_admin_workbench_operations_ui.js
          node audit-stage/admin-ops/tools/test_admin_workbench_operations_ui.js
