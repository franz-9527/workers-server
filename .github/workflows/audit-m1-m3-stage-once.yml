name: Staged v2.5.0 M1 M3 smoke
on:
  push:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check staged sources
        run: |
          php -l audit-stage/server/app/Application/Order/OrderCenterQuery.php
          php -l audit-stage/server/tests/v250_order_center_keyword_regression.php
          node --check audit-stage/miniprogram/pages/orderCenter/index.js
          node --check audit-stage/miniprogram/subpackages/orderTools/productTemplates/index.js
          node --check audit-stage/miniprogram/pages/orderSubmit/index.js
          node --check audit-stage/tools/test_v250_order_center_search_ui.js
          node --check audit-stage/tools/test_v250_product_template_quick_apply.js
      - name: Run M3 owner-scoped search regression
        run: php audit-stage/server/tests/v250_order_center_keyword_regression.php
      - name: Run M3 search UI regression
        run: node audit-stage/tools/test_v250_order_center_search_ui.js
      - name: Run M1 recent product regression
        run: node audit-stage/tools/test_v250_product_template_quick_apply.js