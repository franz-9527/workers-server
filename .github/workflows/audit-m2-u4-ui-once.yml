name: Staged M2 U4 UI smoke
on:
  push:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check staged UI
        run: |
          node --check audit-stage/m2-u4/order-center-close.js
          node --check audit-stage/m2-u4/smoke.js
          php -l audit-stage/m2-u4/order-detail-view-fragment.php
      - name: Run M2 U4 UI smoke
        run: node audit-stage/m2-u4/smoke.js