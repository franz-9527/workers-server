name: Staged next audit batch smoke
on:
  push:
    paths:
      - 'audit-stage/next-batch/**'
      - '.github/workflows/audit-next-batch-once.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: PHP syntax and admin finance boundary
        run: php audit-stage/next-batch/smoke.php
      - name: JavaScript syntax
        run: |
          node --check audit-stage/next-batch/order-negotiation-panel.js
          node --check audit-stage/next-batch/platformIncome.js
          node --check audit-stage/next-batch/smoke.js
      - name: UI behavior smoke
        run: node audit-stage/next-batch/smoke.js
