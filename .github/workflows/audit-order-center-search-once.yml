name: Staged order center search smoke
on:
  push:
    paths:
      - 'audit-stage/order-center/**'
      - '.github/workflows/audit-order-center-search-once.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: PHP syntax check
        run: |
          php -l audit-stage/order-center/OrderCenterRepository.php
          php -l audit-stage/order-center/PrivateValueCipher.php
          php -l audit-stage/order-center/OrderMediaUrlSigner.php
          php -l audit-stage/order-center/OrderOperationException.php
          php -l audit-stage/order-center/OrderCenterQuery.php
          php -l audit-stage/order-center/smoke.php
      - name: Run PHP smoke
        run: php audit-stage/order-center/smoke.php
      - name: Run UI smoke
        run: node audit-stage/order-center/ui-smoke.js
