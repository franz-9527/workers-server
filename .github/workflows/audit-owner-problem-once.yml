name: Staged audit UX smoke
on:
  push:
    paths:
      - 'audit-stage/owner-problem-entry.js'
      - 'audit-stage/owner-problem-smoke.js'
      - 'audit-stage/worker-ui-markup.txt'
      - 'audit-stage/worker-ui-markup-smoke.js'
      - '.github/workflows/audit-owner-problem-once.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check
        run: |
          node --check audit-stage/owner-problem-entry.js
          node --check audit-stage/owner-problem-smoke.js
          node --check audit-stage/worker-ui-markup-smoke.js
      - name: Run owner problem smoke
        run: node audit-stage/owner-problem-smoke.js
      - name: Run worker UI markup smoke
        run: node audit-stage/worker-ui-markup-smoke.js
