name: Staged product template reuse smoke
on:
  push:
    paths:
      - 'audit-stage/product-template-reuse-smoke.js'
      - '.github/workflows/audit-product-template-reuse-once.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check
        run: node --check audit-stage/product-template-reuse-smoke.js
      - name: Run smoke
        run: node audit-stage/product-template-reuse-smoke.js
