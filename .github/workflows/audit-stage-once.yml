name: Staged role audit smoke
on:
  push:
    branches: [main]
    paths:
      - 'audit-stage/**'
      - '.github/workflows/audit-stage-once.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: find audit-stage -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Behavior
        run: php audit-stage/smoke.php
