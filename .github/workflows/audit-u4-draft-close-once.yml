name: Staged U4 draft close smoke
on:
  push:
    paths:
      - 'audit-stage/u4/**'
      - '.github/workflows/audit-u4-draft-close-once.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: PHP syntax check
        run: |
          php -l audit-stage/u4/server/app/Contracts/OrderDraftClosureRepository.php
          php -l audit-stage/u4/server/app/Domain/Order/OrderOperationException.php
          php -l audit-stage/u4/server/app/Application/Order/OrderDraftClosure.php
          php -l audit-stage/u4/server/app/Infrastructure/Persistence/DatabaseOrderDraftClosureRepository.php
          php -l audit-stage/u4/server/app/Http/Api/Modules/OrderDraftClosureApiModule.php
          php -l audit-stage/u4/smoke.php
      - name: Run PHP smoke
        run: php audit-stage/u4/smoke.php
      - name: JavaScript syntax check
        run: |
          node --check audit-stage/u4/miniprogram/pages/orderCenter/index.js
          node --check audit-stage/u4/tools/test_v250_order_draft_close_ui.js
      - name: Run UI smoke
        run: node audit-stage/u4/tools/test_v250_order_draft_close_ui.js
