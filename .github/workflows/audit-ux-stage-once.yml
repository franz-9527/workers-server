name: Staged v2.5.0 UX smoke
on:
  push:
    branches: [main]
    paths:
      - 'audit-stage/**'
      - '.github/workflows/audit-ux-stage-once.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check staged sources
        run: |
          node --check audit-stage/worker-completion.js
          node --check audit-stage/measurement-detail.js
          node --check audit-stage/owner-primary-action.js
          node --check audit-stage/v250-ux-smoke.js
      - name: Run staged UX smoke
        run: node audit-stage/v250-ux-smoke.js