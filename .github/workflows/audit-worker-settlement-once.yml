name: Staged worker settlement continuation smoke
on:
  push:
    paths:
      - 'audit-stage/worker-completion-submit.js'
      - 'audit-stage/OrderApi.js'
      - 'audit-stage/SubscribeMessageUtils.js'
      - 'audit-stage/worker-settlement-continuation-smoke.js'
      - '.github/workflows/audit-worker-settlement-once.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check
        run: |
          node --check audit-stage/worker-completion-submit.js
          node --check audit-stage/worker-settlement-continuation-smoke.js
      - name: Run smoke
        run: node audit-stage/worker-settlement-continuation-smoke.js
