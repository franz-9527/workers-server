name: BaoTa main and chat deployment regression
on:
  push:
    paths: ['.bt-audit/**', '.github/workflows/bt-branch-audit.yml']
permissions:
  contents: read
concurrency:
  group: bt-branch-audit
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        branch: [chat, main]
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.36'
          coverage: none
      - name: Exact runtime and script checks
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = go1.27.3
          php -r 'if(PHP_VERSION!=="8.3.36")exit(1);'
          bash -n .bt-audit/src/chat/deploy/bt-deploy.sh .bt-audit/src/chat/deploy/bt-run.sh
          # PHP snippets must stay single-quoted; the existing user guard requires both checks.
          shellcheck -e SC1091,SC2015,SC2016 .bt-audit/src/chat/deploy/bt-deploy.sh .bt-audit/src/chat/deploy/bt-run.sh
      - name: Real build and full paired process lifecycle
        run: python3 .bt-audit/src/chat/deploy/test-bt-deploy.py .bt-audit/src ${{ matrix.branch }}
