name: BaoTa full Git chat build and lifecycle
on:
  push:
    branches: [main]
    paths: ['.auto/**', '.github/workflows/chat-bt.yml']
permissions:
  contents: read
concurrency:
  group: chat-bt-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .auto/src/chat/go.mod
          cache: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.36'
          coverage: none
      - name: Exact source inputs and shell checks
        run: |
          python3 - <<'PY'
          import pathlib,json,hashlib
          root=pathlib.Path('.auto/src')
          m=json.loads(pathlib.Path('.auto/manifest.json').read_text())
          for p,sha in m.items():
              b=(root/p).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==sha,p
          print('SOURCE_INPUTS_VERIFIED',len(m))
          PY
          bash -n .auto/src/chat/deploy/bt-deploy.sh
          bash -n .auto/src/chat/deploy/bt-run.sh
          shellcheck --severity=warning .auto/src/chat/deploy/bt-deploy.sh .auto/src/chat/deploy/bt-run.sh
      - name: Real Linux Go build, Git sync, rollback and process lifecycle
        run: python3 .auto/src/chat/deploy/test-bt-deploy.py .auto/src
      - name: Tested blob proof
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib,hashlib
          root=pathlib.Path('.auto/src')
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  b=p.read_bytes();print('TESTED_BLOB',p.relative_to(root),hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest())
          PY
      - name: Clean reusable test repository proof
        if: always()
        run: |
          git rm -r --cached .auto .github/workflows/chat-bt.yml >/dev/null
          python3 tools/check-clean-state.py
          git diff --cached --check
