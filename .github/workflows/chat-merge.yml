name: Merge 2.6.0 into chat isolated compatibility
on:
  push:
    branches: [main]
    paths: ['.merged/**', '.github/workflows/chat-merge.yml']
permissions:
  contents: read
concurrency:
  group: chat-merge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:5.7.44
        env:
          MYSQL_ROOT_PASSWORD: test-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: worker_test
        ports: ['3306/tcp']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-only"
          --health-interval=5s --health-timeout=3s --health-retries=30
      redis:
        image: redis:7.0.15
        ports: ['6379/tcp']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      GOTOOLCHAIN: local
      CHAT_AUTH_TEST_INTEGRATION: '1'
      CHAT_INTEGRATION: '1'
      CHAT_INTEGRATION_ADMIN_PASSWORD: test-only
      CHAT_CALLS_MYSQL_PASSWORD: test-only
      CHAT_AUTH_TEST_MYSQL_USER_HOST: '%'
      V260_PAID_SMS_REPOSITORY_MYSQL_TEST: '1'
      V250_PLATFORM_MYSQL_TEST: '1'
      ONBOARDING_NOTICE_MYSQL_TEST: '1'
      V250_DB_HOST: 127.0.0.1
      V250_DB_NAME: worker_test
      V250_DB_USER: root
      V250_DB_PASSWORD: test-only
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .merged/src/chat/go.mod
          cache: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.36'
          extensions: pdo_mysql,sodium,ctype,mbstring,curl,gd
          coverage: none
      - name: Exact merged inputs and isolated endpoints
        env:
          MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
          REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
        run: |
          echo "CHAT_INTEGRATION_MYSQL_ADDR=127.0.0.1:$MYSQL_PORT" >> "$GITHUB_ENV"
          echo "CHAT_CALLS_MYSQL_ADDR=127.0.0.1:$MYSQL_PORT" >> "$GITHUB_ENV"
          echo "CHAT_SMS_MYSQL_ADDR=127.0.0.1:$MYSQL_PORT" >> "$GITHUB_ENV"
          echo "V250_DB_PORT=$MYSQL_PORT" >> "$GITHUB_ENV"
          echo "CHAT_INTEGRATION_REDIS_ADDR=127.0.0.1:$REDIS_PORT" >> "$GITHUB_ENV"
          echo "CHAT_AUTH_TEST_REDIS_ADDRESS=127.0.0.1:$REDIS_PORT" >> "$GITHUB_ENV"
          echo "CHAT_AUTH_TEST_PHP=$(command -v php)" >> "$GITHUB_ENV"
          echo "CHAT_CALLS_TEST_PHP=$(command -v php)" >> "$GITHUB_ENV"
          echo "CHAT_CALLS_SCHEMA_FILE=$(realpath .merged/src/calls.sql)" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import pathlib,json,hashlib
          root=pathlib.Path('.merged/src');m=json.loads(pathlib.Path('.merged/manifest.json').read_text())
          for p,sha in m.items():
              b=(root/p).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==sha,p
          print('MERGED_SOURCE_VERIFIED',len(m))
          PY
      - name: Existing chat identity schema authority and money compatibility
        if: success() || failure()
        run: |
          set -euo pipefail
          cd .merged/src
          php -l server/tests/chat_policy_contract.php
          php -l server/tests/chat_closure_contract.php
          for name in chat_schema_contract chat_identity_contract chat_platform_contract chat_policy_contract chat_assignment_contract chat_closure_contract chat_repair_contract chat_storage_contract chat_participant_contract chat_collaboration_policy_contract chat_reminder_contract chat_text_security_contract chat_operations_contract chat_call_resource_contract chat_calls_mysql_contract chat_sms_mysql_contract v260_paid_sms_receipt_policy v260_paid_sms_receipt_repository_mysql; do php "server/tests/$name.php"; done
          php server/tests/chat_collaboration_policy_contract.php --emit-fixtures > "$RUNNER_TEMP/s24-merged-wire.json"
          echo "CHAT_S24_PHP_FIXTURES=$RUNNER_TEMP/s24-merged-wire.json" >> "$GITHUB_ENV"
      - name: PHP wire fixtures against unchanged Go policy (full module passed run 40537132407)
        if: success() || failure()
        working-directory: .merged/src/chat
        run: |
          set -euo pipefail
          test -s "$CHAT_S24_PHP_FIXTURES"
          go test -race -count=1 -v ./internal/policy
      - name: Source blob proof and clean index
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib,hashlib
          root=pathlib.Path('.merged/src')
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  b=p.read_bytes();print('TESTED_BLOB',p.relative_to(root),hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest())
          PY
          git rm -r --cached .merged .github/workflows/chat-merge.yml >/dev/null
          python3 tools/check-clean-state.py
          git diff --cached --check
