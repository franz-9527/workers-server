name: Chat Go configuration layout and callback address
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring,dom
          coverage: none
      - name: Render actual PHP settings
        run: |
          php -l server/views/admin/chat-settings.php
          php tools/test_chat_runtime_render.php
          node --check tools/test_chat_runtime_layout.js
      - name: Browser layout and full address copy
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/chat-runtime-http.log 2>&1 &
          node tools/test_chat_runtime_layout.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-runtime-layouts
          path: test-artifacts/chat-runtime-*.png
