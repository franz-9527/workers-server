name: Test chat public media and restricted diagnostics
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:5.7.44
        env:
          MYSQL_ROOT_PASSWORD: fixture-only
          MYSQL_ROOT_HOST: '%'
        ports: ['3306/tcp']
        options: --health-cmd="mysqladmin ping -pfixture-only" --health-interval=5s --health-timeout=3s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql,mbstring,sodium,dom,curl,gd
          coverage: none
      - uses: actions/setup-go@v5
        with:
          go-version-file: chat/go.mod
          cache-dependency-path: chat/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline media dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -r chat/helpers/images/requirements.lock
      - name: Syntax
        run: |
          find server/app server/bin server/views/admin -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php -l server/tests/chat_runtime_config_mysql.php
          php -l server/chat-calls.php
          php -l server/chat-call-bridge.php
          bash -n chat/deploy/bt-run.sh chat/deploy/bt-deploy.sh
          python -m py_compile chat/deploy/test-runtime-integration.py
      - name: Format and record exact Go sources used by acceptance
        run: |
          gofmt -w chat/internal/imagepipeline/qiniu.go chat/internal/imagepipeline/qiniu_av.go chat/internal/message/media.go chat/internal/message/av_upload.go chat/internal/message/av_worker.go chat/internal/imagepipeline/gateway.go chat/internal/imagepipeline/config.go chat/internal/avpipeline/config.go chat/internal/dependencies/runtime.go chat/internal/dependencies/messaging.go chat/internal/bootstrap/server.go chat/internal/bootstrap/config.go chat/internal/dependencies/calls.go chat/internal/imagepipeline/gateway_test.go chat/internal/message/media_namespace_test.go
          python - <<'PY'
          import json, pathlib
          for name in ["chat/internal/imagepipeline/qiniu.go","chat/internal/imagepipeline/qiniu_av.go","chat/internal/message/media.go","chat/internal/message/av_upload.go","chat/internal/message/av_worker.go","chat/internal/imagepipeline/gateway.go","chat/internal/imagepipeline/config.go","chat/internal/avpipeline/config.go","chat/internal/dependencies/runtime.go","chat/internal/dependencies/messaging.go","chat/internal/bootstrap/server.go","chat/internal/bootstrap/config.go","chat/internal/dependencies/calls.go","chat/internal/imagepipeline/gateway_test.go","chat/internal/message/media_namespace_test.go"]:
              print("FORMATTED_GO_SOURCE " + json.dumps({"path": name, "content": pathlib.Path(name).read_text()}))
          PY
      - name: Go build and real offline media regressions
        env:
          CHAT_IMAGE_HELPER_TEST: '1'
          CHAT_AV_HELPER_TEST: '1'
        working-directory: chat
        run: |
          go build -o /tmp/chatd ./cmd/chatd
          go test ./...
      - name: Real MySQL and Go public media configuration matrix
        if: always()
        env:
          CHAT_RUNTIME_TEST: '1'
          CHATD_TEST_BINARY: /tmp/chatd
          MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
        run: |
          export CHAT_TEST_PYTHON="$(command -v python)"
          php server/tests/chat_runtime_config_mysql.php
      - name: Real open_basedir web request and launcher reload
        if: always()
        env:
          CHAT_RUNTIME_TEST: '1'
          CHATD_TEST_BINARY: /tmp/chatd
        run: python chat/deploy/test-runtime-integration.py
