name: Chat release and test center acceptance
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:5.7.44
        env:
          MYSQL_ROOT_PASSWORD: fixture-only
          MYSQL_ROOT_HOST: '%'
        ports: ['3306/tcp']
        options: --health-cmd="mysqladmin ping -pfixture-only" --health-interval=5s --health-timeout=3s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql,mbstring,sodium,dom
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: chat/go.mod
      - name: PHP and JavaScript syntax
        run: |
          find server tools -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find miniprogram tools -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Isolated real MySQL simulation and release tests
        env:
          CHAT_RELEASE_TEST: '1'
          MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
        run: php tools/test_chat_release_simulation.php
      - name: Native frontend integration and existing chat manager regressions
        run: |
          node tools/test_chat_release_frontend.js
          node --test tools/test_chat_s11.js
      - name: PHP credential and Go authority integration
        if: always()
        env:
          CHAT_AUTH_TEST_INTEGRATION: '1'
          CHAT_INTEGRATION_MYSQL_ADDR: 127.0.0.1:${{ job.services.mysql.ports['3306'] }}
          CHAT_INTEGRATION_ADMIN_PASSWORD: fixture-only
          CHAT_AUTH_TEST_MYSQL_USER_HOST: '%'
          CHAT_AUTH_TEST_PHP: /usr/bin/php
        run: |
          php server/tests/chat_identity_contract.php
          cd chat && go test -count=1 ./internal/auth ./internal/dependencies
      - name: Compile WXML
        if: always()
        run: |
          npm install --no-save --ignore-scripts miniprogram-compiler@0.2.3 playwright@1.56.1
          node tools/check-wxml.js miniprogram --compile
      - name: Actual test center templates
        if: always()
        env:
          CHAT_RELEASE_TEST: '1'
        run: php tools/test_center_render.php
      - name: Desktop and mobile browser layout
        if: always()
        timeout-minutes: 5
        run: |
          npx playwright install --with-deps chromium
          php -S 127.0.0.1:8765 -t . >/tmp/test-center-http.log 2>&1 &
          node tools/test_center_browser.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-release-test-center
          path: |
            test-artifacts/*.png
            test-artifacts/render/*.html
