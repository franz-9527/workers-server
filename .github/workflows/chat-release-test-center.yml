name: Subscription compact top hint
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and subscription authorization regressions
        run: |
          find miniprogram tools -name '*.js' -print0 | xargs -0 -n1 node --check
          node --test tools/test_subscription_top_hint.js tools/test_unified_notices.js tools/test_chat_notice_recovery.js tools/test_identity_navigation.js tools/test_chat_s11.js
      - name: Compile actual WXML and capture layouts
        run: |
          npm install --no-save --ignore-scripts miniprogram-compiler@0.2.3 playwright@1.56.1
          node tools/check-wxml.js miniprogram --compile
          npx playwright install --with-deps chromium
          node tools/test_unified_notice_layout.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: subscription-top-hint-layouts
          path: test-artifacts/
