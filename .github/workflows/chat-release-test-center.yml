name: Independent store map latency and stability regression
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WXML compiler
        run: npm install --no-save miniprogram-compiler
      - name: Syntax and actual WXML compilation
        run: |
          node --check miniprogram/subpackages/store/index/index.js
          node --check miniprogram/subpackages/store/utils/StoreMap.js
          node --check cloudfunctions/worker/index.js
          node --check cloudfunctions/store/index.js
          node tools/check-wxml.js miniprogram --compile
      - name: Reproduce original failures and verify corrected real page and cloud handlers
        env:
          STORE_ORDER_TEST: '1'
        run: |
          node --test tools/test_store_map_phone.js tools/test_store_map_performance.js
          node tools/test_store_order_prompts.js
          node tools/test_store_cloud_contract.js
          node --test tools/test_worker_profile_dates.js tools/test_worker_detail_identity.js
