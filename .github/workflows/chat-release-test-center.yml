name: Worker profile dates and administrator phone access
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          find cloudfunctions miniprogram tools -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Cloud handlers and front-end profile date regressions
        run: node --test tools/test_worker_profile_dates.js
