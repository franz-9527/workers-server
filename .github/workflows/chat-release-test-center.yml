name: Independent chat sandbox migration and cleanup
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: fixture-only
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pfixture-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring,dom,pdo_mysql
          coverage: none
      - name: PHP and JavaScript syntax
        run: |
          php -l server/app/Application/Chat/ChatSandbox.php
          php -l server/app/Application/Chat/ChatSimulation.php
          php -l server/app/Http/Admin/Modules/ChatTestingAdminModule.php
          php -l server/app/Http/Admin/Modules/TestCenterAdminModule.php
          php -l server/views/admin/chat-testing.php
          php -l server/views/admin/test-center-detail-v260.php
          php -l server/views/layouts/admin.php
          node --check server/assets/chat-testing.js
          node --check miniprogram/utils/ChatIdentity.js
          node --check miniprogram/utils/ChatInboxModel.js
      - name: Real MySQL isolation, transport and cleanup
        env:
          CHAT_SANDBOX_TEST: '1'
          CHAT_RELEASE_TEST: '1'
          MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
        run: |
          php tools/test_chat_sandbox.php
          php tools/test_chat_release_simulation.php
          php tools/test_chat_sandbox_manifest.php
      - name: Browser layouts and mini view models
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/sandbox-http.log 2>&1 &
          node tools/test_chat_sandbox.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-sandbox-layouts
          path: test-artifacts/sandbox-*.png
