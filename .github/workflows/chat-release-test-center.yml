name: Messaging requests receipts and site isolation
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      mysql:
        image: mysql:5.7.44
        env:
          MYSQL_ROOT_PASSWORD: fixture-only
          MYSQL_ROOT_HOST: '%'
        ports: ['3306/tcp']
        options: --health-cmd="mysqladmin ping -pfixture-only" --health-interval=5s --health-timeout=3s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql,mbstring,sodium,dom,curl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          find server tools -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find miniprogram cloudfunctions tools -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Official WeCom standard payload and provider errors
        if: always()
        run: php tools/test_wecom_standard.php
      - name: Render real settings templates
        if: always()
        run: php tools/test_message_settings_render.php
      - name: Real MySQL delivery records pagination and review status
        if: always()
        env:
          MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
        run: php tools/test_message_records_mysql.php
      - name: Announcement environment and review UI behavior
        if: always()
        run: node --test tools/test_announcement_review.js
      - name: Existing worker dates and administrator field visibility
        if: always()
        run: |
          node --test tools/test_worker_profile_dates.js
          node --test tools/test_worker_detail_identity.js
      - name: Real WXML compile
        if: always()
        run: |
          npm install --no-save --ignore-scripts miniprogram-compiler@0.2.3 playwright@1.56.1
          node tools/check-wxml.js miniprogram --compile
      - name: Real browser requests and layout
        if: always()
        run: |
          npx playwright install --with-deps chromium
          php -S 127.0.0.1:8765 -t . >/tmp/message-http.log 2>&1 &
          node tools/test_subscription_small_post.js
          node tools/test_message_all_posts.js
          node tools/test_message_record_layout.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: messaging-request-receipt-isolation
          path: test-artifacts/
