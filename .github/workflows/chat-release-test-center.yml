name: Chat settings plaintext credential display
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: fixture-only
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pfixture-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring,dom,sodium,pdo_mysql
          coverage: none
      - name: Validate real services, permission boundaries and forms
        env:
          CHAT_SECRET_TEST: '1'
          MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
        run: |
          php -l server/views/admin/chat-settings.php
          php -l server/views/admin/chat-calls.php
          php -l server/app/Http/Admin/Modules/ChatSettingsAdminModule.php
          php -l server/app/Http/Admin/Modules/ChatCallsAdminModule.php
          php tools/test_chat_secret_values.php
          php tools/test_chat_runtime_render.php
      - name: Verify compact light and dark layout
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/chat-runtime-http.log 2>&1 &
          node tools/test_chat_runtime_layout.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-runtime-layouts
          path: test-artifacts/chat-runtime-*.png
