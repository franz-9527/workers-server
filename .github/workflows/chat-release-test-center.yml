name: Subscription test request isolation
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      mysql:
        image: mysql:5.7.44
        env:
          MYSQL_ROOT_PASSWORD: fixture-only
          MYSQL_ROOT_HOST: '%'
        ports: ['3306/tcp']
        options: --health-cmd="mysqladmin ping -pfixture-only" --health-interval=5s --health-timeout=3s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql,mbstring,sodium,dom
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          find server tools -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find miniprogram tools -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Role templates and real MySQL quota
        env:
          MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
        run: php tools/test_subscription_roles_mysql.php
      - name: Foreground queue and authorization isolation
        if: always()
        run: node --test tools/test_unified_notices.js
      - name: Existing notification and chat regressions
        if: always()
        run: |
          node tools/test_notification_inbox_ui.js
          node --test tools/test_chat_s11.js
      - name: Compile actual WXML
        if: always()
        run: |
          npm install --no-save --ignore-scripts miniprogram-compiler@0.2.3 playwright@1.56.1
          node tools/check-wxml.js miniprogram --compile
      - name: Render actual admin templates
        if: always()
        run: php tools/test_message_settings_render.php
      - name: Actual small test requests
        if: always()
        run: |
          npx playwright install --with-deps chromium
          php -S 127.0.0.1:8765 -t . >/tmp/subscription-http.log 2>&1 &
          node tools/test_subscription_small_post.js
      - name: Mobile desktop light dark layout
        if: always()
        run: |
          npx playwright install --with-deps chromium
          node tools/test_unified_notice_layout.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: role-subscriptions-notices
          path: test-artifacts/
