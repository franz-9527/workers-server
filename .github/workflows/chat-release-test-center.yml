name: Full mini-program chat audit and real sandbox regression
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:5.7.44
        env:
          MYSQL_ROOT_PASSWORD: fixture-only
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -pfixture-only"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: chat/go.mod
          cache-dependency-path: chat/go.sum
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, sodium, gd
      - name: Install independent build and browser tools
        run: |
          npm install --no-save esbuild@0.25.10 spark-md5@3.0.2 miniprogram-compiler playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build shared mini-program state machines for the browser
        run: |
          npx esbuild server/assets/chat-testing-client.js --bundle --platform=browser --target=es2020 --format=iife --outfile=server/assets/chat-testing-runtime.js
          find server/app server/views -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.txt
          node --check server/assets/chat-testing-runtime.js
          node tools/check-wxml.js miniprogram --compile
      - name: Go formatting, compilation and unit regressions
        run: |
          gofmt -w chat/internal/calls/worker.go chat/internal/calls/sandbox_routing_test.go chat/internal/message/media_source.go chat/internal/message/av_worker.go chat/internal/message/media_worker.go chat/internal/calls/service.go chat/internal/ports/sandbox.go chat/internal/ports/contracts.go chat/internal/auth/sandbox.go chat/internal/auth/mysql.go chat/internal/policy/sandbox.go chat/internal/policy/projection.go chat/internal/policy/guard.go chat/internal/policy/recipient.go chat/internal/conversation/sandbox.go chat/internal/conversation/store.go chat/internal/moderation/service.go chat/internal/message/reminders.go chat/internal/message/sandbox_cleanup.go chat/internal/dependencies/mysql.go chat/internal/dependencies/messaging.go chat/internal/calls/lifecycle.go chat/internal/dependencies/dependencies_test.go chat/internal/message/history.go
          cd chat
          go test ./...
      - name: Real MySQL sandbox scope and media integration
        env:
          CHAT_AUTH_TEST_INTEGRATION: '1'
          CHAT_INTEGRATION_MYSQL_ADDR: 127.0.0.1:${{ job.services.mysql.ports[3306] }}
          CHAT_INTEGRATION_ADMIN_PASSWORD: fixture-only
          CHAT_AUTH_TEST_MYSQL_USER_HOST: '%'
          CHAT_AUTH_TEST_PHP: /usr/bin/php
        run: |
          cd chat
          go test ./internal/message -run 'TestMySQLSandbox' -count=1 -v
      - name: Real PHP delegation and administrative view regressions
        if: always()
        env:
          CHAT_SANDBOX_TEST: '1'
          MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
        run: |
          php tools/render_chat_live.php
          php tools/test_chat_sandbox_view.php
          php tools/test_chat_sandbox.php
      - name: Browser shared-client media calls and original card layouts
        if: always()
        env:
          STORE_ORDER_TEST: '1'
        run: |
          node tools/test_store_order_prompts.js
          node tools/test_store_order_layout.js
          node tools/test_chat_live_browser.js
          node tools/test_chat_mini_experience.js
          node tools/test_chat_mini_layout.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-chat-test-build
          path: |
            test-artifacts/*.png
            chat/internal/message/collaboration.go
            miniprogram/utils/ChatIdentity.js
            test-artifacts/*.html
            server/assets/chat-testing-runtime.js
            chat/internal/ports/sandbox.go
            chat/internal/ports/contracts.go
            chat/internal/auth/sandbox.go
            chat/internal/auth/mysql.go
            chat/internal/policy/sandbox.go
            chat/internal/policy/projection.go
            chat/internal/policy/guard.go
            chat/internal/policy/recipient.go
            chat/internal/conversation/sandbox.go
            chat/internal/conversation/store.go
            chat/internal/moderation/service.go
            chat/internal/message/reminders.go
            chat/internal/message/sandbox_cleanup.go
            chat/internal/dependencies/mysql.go
            chat/internal/dependencies/messaging.go
            chat/internal/calls/sandbox_routing_test.go
            chat/internal/calls/worker.go
            chat/internal/calls/service.go
            chat/internal/calls/lifecycle.go
            chat/internal/dependencies/dependencies_test.go
            chat/internal/message/history.go
            chat/internal/message/media_source.go
            chat/internal/message/av_worker.go
            chat/internal/message/media_worker.go
