name: Resubmission dates and manual worker identity display
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          find cloudfunctions miniprogram tools -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Cloud handlers and front-end profile date regressions
        run: |
          node --test tools/test_worker_profile_dates.js
          node --test tools/test_worker_detail_identity.js
      - name: Compile actual WXML
        run: |
          npm install --no-save --ignore-scripts miniprogram-compiler@0.2.3
          node tools/check-wxml.js miniprogram --compile
