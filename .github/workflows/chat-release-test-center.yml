name: Independent store assets and order prompts
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install independent verification tools
        run: |
          npm install --no-save playwright@1.56.1 miniprogram-compiler
          npx playwright install --with-deps chromium
      - name: JavaScript syntax and actual WXML compilation
        run: |
          node --check miniprogram/subpackages/store/index/index.js
          node --check miniprogram/subpackages/store/utils/Storefront.js
          node --check miniprogram/pages/userOrder/detail.js
          node --check miniprogram/pages/workerOrder/detail.js
          node --check miniprogram/components/order-support-cards/index.js
          node --check miniprogram/components/subscription-health-banner/index.js
          node --check miniprogram/utils/OrderSupportPresentation.js
          node tools/check-wxml.js miniprogram --compile
      - name: Store compatibility, payment display and actual page/component events
        env:
          STORE_ORDER_TEST: '1'
        run: node tools/test_store_order_prompts.js
      - name: Responsive templates, dark mode and real image decoding
        env:
          STORE_ORDER_TEST: '1'
        run: node tools/test_store_order_layout.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-order-prompts-layouts
          path: test-artifacts/r35-*.png
          if-no-files-found: warn
