name: Chat deployment upgrade gate
on: [push, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: runtime-upgrade-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Syntax and real CLI shell lifecycle checks
        env:
          CHAT_UPGRADE_GATE_TEST: '1'
        run: |
          bash -n chat/deploy/bt-deploy.sh chat/deploy/bt-run.sh
          php -l server/bin/chat-runtime-config.php
          php -l server/app/Application/Chat/ChatGoRuntimeStatus.php
          python3 tools/test_runtime_upgrade_gate.py
