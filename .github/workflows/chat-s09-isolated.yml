name: Temporary S09 Isolated Verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/chat-s09-isolated.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s09-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:5.7.44
        env:
          MYSQL_ROOT_PASSWORD: chat-ci-fixture-only
          MYSQL_ROOT_HOST: '%'
        ports: ['3306/tcp']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pchat-ci-fixture-only"
          --health-interval=5s --health-timeout=3s --health-retries=30
      redis:
        image: redis:7.0.15
        ports: ['6379/tcp']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      GOTOOLCHAIN: local
      CHAT_AUTH_TEST_INTEGRATION: '1'
      CHAT_INTEGRATION_ADMIN_PASSWORD: chat-ci-fixture-only
      CHAT_AUTH_TEST_MYSQL_USER_HOST: '%'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: franz-9527/workers
          ref: chat
          path: source
      - name: Print exact source commit
        run: git -C source rev-parse HEAD
      - uses: actions/setup-go@v5
        with:
          go-version-file: source/chat/go.mod
          cache-dependency-path: source/chat/go.sum
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.36'
          extensions: pdo_mysql, sodium, ctype, mbstring
          coverage: none
      - name: Verify PHP and service endpoints
        env:
          CHAT_TEST_MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
          CHAT_TEST_REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
        run: |
          set -euo pipefail
          php -r 'if (PHP_VERSION !== "8.3.36") exit(1); echo PHP_VERSION," verified\n";'
          echo "CHAT_INTEGRATION_MYSQL_ADDR=127.0.0.1:$CHAT_TEST_MYSQL_PORT" >> "$GITHUB_ENV"
          echo "CHAT_INTEGRATION_REDIS_ADDR=127.0.0.1:$CHAT_TEST_REDIS_PORT" >> "$GITHUB_ENV"
          echo "CHAT_AUTH_TEST_REDIS_ADDRESS=127.0.0.1:$CHAT_TEST_REDIS_PORT" >> "$GITHUB_ENV"
          echo "CHAT_AUTH_TEST_PHP=$(command -v php)" >> "$GITHUB_ENV"
      - name: PHP and migration contracts
        working-directory: source
        run: |
          set -euo pipefail
          php server/tests/chat_schema_contract.php
          php server/tests/chat_identity_contract.php
          php server/tests/chat_policy_contract.php
          php server/tests/chat_text_security_contract.php
      - name: Go build, vet, race and integration
        working-directory: source/chat
        run: |
          set -euo pipefail
          go mod verify
          go vet ./...
          sh build.sh
          go test -race -count=1 ./...
