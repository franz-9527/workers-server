name: Paid chat SMS balance and unread regression
on:
  push:
    branches: [main]
    paths: ['.audit/**', '.github/workflows/chat-sms.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chat-sms-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sms:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:5.7.44
        env:
          MYSQL_ROOT_PASSWORD: sms-fixture-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: worker_test
        ports: ['3306/tcp']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psms-fixture-only"
          --health-interval=5s --health-timeout=3s --health-retries=30
      redis:
        image: redis:7.0.15
        ports: ['6379/tcp']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      GOTOOLCHAIN: local
      CHAT_AUTH_TEST_INTEGRATION: '1'
      CHAT_INTEGRATION: '1'
      CHAT_INTEGRATION_ADMIN_PASSWORD: sms-fixture-only
      CHAT_CALLS_MYSQL_PASSWORD: sms-fixture-only
      CHAT_AUTH_TEST_MYSQL_USER_HOST: '%'
      V260_PAID_SMS_REPOSITORY_MYSQL_TEST: '1'
      V250_DB_HOST: 127.0.0.1
      V250_DB_NAME: worker_test
      V250_DB_USER: root
      V250_DB_PASSWORD: sms-fixture-only
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .audit/src/chat/go.mod
          cache: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.36'
          extensions: pdo_mysql,sodium,ctype,mbstring,curl
          coverage: none
      - name: Isolated endpoints and exact inputs
        env:
          MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
          REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
        run: |
          echo "CHAT_INTEGRATION_MYSQL_ADDR=127.0.0.1:$MYSQL_PORT" >> "$GITHUB_ENV"
          echo "CHAT_CALLS_MYSQL_ADDR=127.0.0.1:$MYSQL_PORT" >> "$GITHUB_ENV"
          echo "CHAT_SMS_MYSQL_ADDR=127.0.0.1:$MYSQL_PORT" >> "$GITHUB_ENV"
          echo "V250_DB_PORT=$MYSQL_PORT" >> "$GITHUB_ENV"
          echo "CHAT_INTEGRATION_REDIS_ADDR=127.0.0.1:$REDIS_PORT" >> "$GITHUB_ENV"
          echo "CHAT_AUTH_TEST_REDIS_ADDRESS=127.0.0.1:$REDIS_PORT" >> "$GITHUB_ENV"
          echo "CHAT_AUTH_TEST_PHP=$(command -v php)" >> "$GITHUB_ENV"
          echo "CHAT_CALLS_TEST_PHP=$(command -v php)" >> "$GITHUB_ENV"
          echo "CHAT_CALLS_SCHEMA_FILE=$(realpath .audit/src/calls.sql)" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import pathlib,json,hashlib
          root=pathlib.Path('.audit/src');m=json.loads(pathlib.Path('.audit/manifest.json').read_text())
          for p,sha in m['files'].items():
              d=(root/p).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(d)).encode()+b'\0'+d).hexdigest()==sha,p
          print('Verified source inputs',len(m['files']))
          p=root/'server/database/upgrades/manifest.json';manifest=json.loads(p.read_text())
          manifest['install_checksum']=hashlib.sha256((root/'server/database/database.sql').read_bytes()).hexdigest()
          for entry in manifest['upgrades']:
              if entry['version']=='2.7.0':entry['checksum']=hashlib.sha256((root/'server/database/upgrades/2.7.0.sql').read_bytes()).hexdigest()
          p.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: PHP syntax and financial/schema contracts
        if: success() || failure()
        run: |
          set -euo pipefail
          find .audit/src/server -name '*.php' -print0 | xargs -0 -n1 php -l
          php .audit/src/server/tests/chat_schema_contract.php
          php .audit/src/server/tests/chat_sms_mysql_contract.php
          php .audit/src/server/tests/v260_paid_sms_receipt_policy.php
          php .audit/src/server/tests/v260_paid_sms_receipt_repository_mysql.php
          for name in chat_identity_contract chat_policy_contract chat_storage_contract chat_participant_contract chat_collaboration_policy_contract chat_call_resource_contract chat_reminder_contract chat_calls_mysql_contract; do php ".audit/src/server/tests/$name.php"; done
          php .audit/src/server/tests/chat_collaboration_policy_contract.php --emit-fixtures > "$RUNNER_TEMP/s24-php-wire.json"
          echo "CHAT_S24_PHP_FIXTURES=$RUNNER_TEMP/s24-php-wire.json" >> "$GITHUB_ENV"
      - name: Complete Go build vet and race with real authority stores
        if: success() || failure()
        working-directory: .audit/src/chat
        run: |
          set -euo pipefail
          gofmt -w internal/message/paid_sms.go internal/dependencies/runtime.go internal/dependencies/messaging.go internal/bootstrap/server.go internal/bootstrap/config.go internal/message/paid_sms_integration_test.go
          go mod verify
          go build ./...
          sh build.sh
          go vet ./...
          go test -race -count=1 -v ./...
      - name: SMS consent, account and existing chat frontend regression
        if: success() || failure()
        run: |
          set -euo pipefail
          find .audit/src/miniprogram -name '*.js' -print0 | xargs -0 -n1 node --check
          node --test .audit/src/tools/test_chat_sms.js .audit/src/tools/test_chat_s11.js .audit/src/tools/test_chat_calls.js .audit/src/tools/test_chat_av.js .audit/src/tools/test_chat_s18_s20.js .audit/src/tools/test_chat_s24.js
          node .audit/src/tools/test_chat_s12_business_entry.js
          python3 .audit/src/tools/test_chat_calls_release.py
      - name: Browser layout environment
        timeout-minutes: 2
        if: success() || failure()
        run: |
          set -euo pipefail
          npm install --prefix .audit --ignore-scripts --no-audit --no-fund playwright-core@1.56.1 htmlparser2@9.1.0
          echo "CHROME_BIN=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
          curl --fail --location --max-time 60 'https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf' -o "$RUNNER_TEMP/chat-sms-noto.otf"
          python3 - <<'PY'
          import pathlib,hashlib,os
          d=pathlib.Path(os.environ['RUNNER_TEMP'],'chat-sms-noto.otf').read_bytes()
          assert hashlib.sha1(b'blob '+str(len(d)).encode()+b'\0'+d).hexdigest()=='dc15562470b4f842321894787a0d066879ccff8b'
          PY
          install -D -m 644 "$RUNNER_TEMP/chat-sms-noto.otf" "$HOME/.local/share/fonts/chat-sms/NotoSansCJKsc-Regular.otf"
          fc-cache -f "$HOME/.local/share/fonts/chat-sms"
      - name: Popup, balance zero, pending, dark and large-text layouts
        timeout-minutes: 3
        if: success() || failure()
        run: node .audit/render-ui.js
      - name: Exact tested source proof
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib,json,base64,hashlib
          root=pathlib.Path('.audit/src')
          files={p:(root/p).read_text() for p in ["chat/internal/message/paid_sms.go","chat/internal/dependencies/runtime.go","chat/internal/dependencies/messaging.go","chat/internal/bootstrap/server.go","chat/internal/bootstrap/config.go","chat/internal/message/paid_sms_integration_test.go","server/database/upgrades/manifest.json"]}
          data=base64.b64encode(json.dumps(files,separators=(',',':')).encode()).decode()
          chunks=[data[i:i+5000] for i in range(0,len(data),5000)]
          for i,c in enumerate(chunks):print('FORMATTED_B64',i,len(chunks),c)
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  d=p.read_bytes();print('TESTED_BLOB',p.relative_to(root),hashlib.sha1(b'blob '+str(len(d)).encode()+b'\0'+d).hexdigest())
          PY
      - name: Clean four-file index proof
        if: success() || failure()
        run: |
          git rm -r --cached .audit .github/workflows/chat-sms.yml >/dev/null
          python3 tools/check-clean-state.py
          git diff --cached --check
