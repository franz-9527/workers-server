name: Formal Workers Closeout Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/formal-closeout-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  formal-closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: worker_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout isolated test harness
        uses: actions/checkout@v4
      - name: Checkout exact formal workers source
        uses: actions/checkout@v4
        with:
          repository: franz-9527/workers
          ref: 4abdb13eb7fd64504b9bd75e4736afef2e620747
          path: source
          fetch-depth: 1
      - name: Verify exact source SHA
        working-directory: source
        run: test "$(git rev-parse HEAD)" = "4abdb13eb7fd64504b9bd75e4736afef2e620747"
      - name: PHP syntax lint
        working-directory: source
        run: find server/app server/views/admin server/tests tools -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Modular architecture gate
        working-directory: source
        run: php tools/check-modular-architecture.php
      - name: Closeout source invariants
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          grep -F "o.order_source_type='platform' AND o.payment_status IN ('not_required','paid')" server/app/Infrastructure/Persistence/DatabaseOrderDiscoveryRepository.php
          grep -F "if (\$currentStatus === 'refunded') return" server/app/Infrastructure/Persistence/DatabasePaidPaymentSettlement.php
          grep -F "AND status<>'refunded'" server/app/Infrastructure/Persistence/DatabasePaidPaymentSettlement.php
          grep -F "if ((string)\$refund['status'] === 'succeeded') return" server/app/Infrastructure/Persistence/DatabaseRefundResultSettlement.php
          grep -F "WHERE id=:id AND status<>'succeeded'" server/app/Infrastructure/Persistence/DatabaseRefundResultSettlement.php
          grep -F "lockPayment" server/app/Application/Money/WebAdminFinance.php
          grep -F "lockWalletRecharge" server/app/Application/Money/WebAdminFinance.php
          grep -F "cursorUpdatedAt" server/app/Infrastructure/Scheduling/PlatformOrderAutoPublishTask.php
          grep -F "NOT EXISTS(SELECT 1 FROM disputes" server/app/Infrastructure/Scheduling/MeasurementFrozenBalanceReleaseTask.php
          grep -F "lockInitialVersion" server/app/Application/Agreements/PlatformAgreements.php
          grep -F "agreements.lock-initial" server/app/Http/Admin/Modules/AgreementAdminModule.php
          grep -F "DynamicFormAnswerValidator" server/app/Infrastructure/Persistence/OrderSubmissionFormSupport.php
          grep -F "DynamicFormAnswerValidator" server/app/Infrastructure/Persistence/PlatformOrderCommonFactsWriter.php
          grep -F "assertActiveOptions" server/app/Infrastructure/Persistence/DynamicFormAnswerValidator.php
          test "$(wc -c < server/app/Controllers/HelpCenterAdminController.php)" -le 28141
      - name: Existing platform and payment regressions
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          php server/tests/v250_proxy_platform_entry_regression.php
          php server/tests/v250_platform_booking_fee_isolated.php
          php server/tests/v250_platform_booking_verifier_isolated.php
          php server/tests/v250_wecom_admin_entry_regression.php
          php server/tests/v250_review_hall_demo_regression.php
          php server/tests/v250_scheduler_catalog_contract.php
          php server/tests/v250_platform_settlement_regression.php
          php server/tests/v250_failed_refund_recovery_regression.php
          php server/tests/v250_dispute_negotiation_regression.php
      - name: Platform managed auto publish MySQL regression
        working-directory: source
        env:
          V250_PLATFORM_MYSQL_TEST: '1'
          V250_DB_NAME: worker_test
          V250_DB_HOST: 127.0.0.1
          V250_DB_PORT: '3306'
          V250_DB_USER: root
          V250_DB_PASSWORD: root
        run: php server/tests/v250_platform_auto_publish_mysql.php
      - name: MySQL 5.7 merged migration and idempotency
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          MYSQL=(mysql --protocol=tcp -h127.0.0.1 -P3306 -uroot -proot --default-character-set=utf8mb4 worker_test)
          VERSION="$(${MYSQL[@]} -Nse 'SELECT VERSION()')"
          [[ "$VERSION" == 5.7.* ]]
          "${MYSQL[@]}" < server/tests/fixtures/v241-release-minimal.sql
          "${MYSQL[@]}" < server/database/upgrades/2.5.0.sql
          "${MYSQL[@]}" < server/database/upgrades/2.5.0.sql
          echo "MySQL $VERSION merged 2.5.0 migration passed twice"
