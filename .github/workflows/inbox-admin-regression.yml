name: Inbox and admin regression
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7.44
        env:
          MYSQL_ROOT_PASSWORD: fixture-only
          MYSQL_ROOT_HOST: '%'
        ports: ['3306/tcp']
        options: --health-cmd="mysqladmin ping -pfixture-only" --health-interval=5s --health-timeout=3s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql,mbstring
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: find server tools -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Frontend regression
        run: |
          find miniprogram tools -name '*.js' -print0 | xargs -0 -n1 node --check
          node tools/test_notification_inbox_ui.js
      - name: WXML compiler
        run: |
          npm install --no-save --ignore-scripts miniprogram-compiler@0.2.3
          node tools/check-wxml.js miniprogram --compile
      - name: Admin and template regression
        env:
          MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
        run: php -d error_reporting=E_ALL tools/test_notification_admin_regression.php
      - name: Run inbox probe
        env:
          MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
        run: php tools/inbox-probe.php

# Validate fallback preservation and strict template rendering.
