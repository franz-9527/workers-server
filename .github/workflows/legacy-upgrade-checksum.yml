# source_candidate: 092210743a842924aa4c2d1967e389c6bafa3d7f
name: Legacy Upgrade Checksum Compatibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/legacy-upgrade-checksum.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mbstring, json
          coverage: none

      - name: Materialize candidate
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            target="${file#.upgrade-legacy-checksum-snapshot/}"
            mkdir -p "$(dirname "$target")"
            cp "$file" "$target"
          done < <(find .upgrade-legacy-checksum-snapshot -type f -print0)

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l server/app/Services/UpgradeService.php
          php -l server/tests/upgrade_historical_checksum_alias_contract.php

      - name: Canonical 2.5.0 checksum
        shell: bash
        run: |
          set -euo pipefail
          echo "a8fb5669fafcfbf5ea24afd338c534229b9921e10b5310af611ead60cb871bb3  server/database/upgrades/2.5.0.sql" | sha256sum -c -

      - name: Historical checksum compatibility contract
        shell: bash
        run: php server/tests/upgrade_historical_checksum_alias_contract.php
