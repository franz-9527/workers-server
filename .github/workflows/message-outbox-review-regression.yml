name: Temporary message outbox and review regression

on:
  push:
    branches: [main]
    paths:
      - '.validation/**'
      - '.github/workflows/message-outbox-review-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:5.7.44
        env:
          MYSQL_ROOT_PASSWORD: test-only
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP 8.3.36
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.36'
          extensions: mbstring, pdo_mysql
          coverage: none
      - name: Runtime versions
        run: |
          php --version
          node --version
          mysql --version || true
      - name: PHP syntax checks
        working-directory: .validation/source
        run: |
          set -euo pipefail
          for file in \
            server/app/Infrastructure/Messaging/OrderNotificationProjector.php \
            server/app/Services/OrderNotificationService.php \
            server/app/Contracts/MessageDeliveryReceiptQueue.php \
            server/app/Infrastructure/Messaging/SubscriptionQuotaStore.php \
            server/app/Infrastructure/Messaging/SubscriptionCatalog.php \
            server/app/Infrastructure/Messaging/OrderSubscriptionDefinitionOperations.php \
            server/app/Infrastructure/Persistence/DatabaseMiniAdminWorkerStoreRepository.php \
            server/app/Infrastructure/Messaging/DatabaseMessageDeliveryQueue.php \
            server/app/Infrastructure/Messaging/OrderSubscriptionQueue.php \
            server/app/Application/Messaging/MessageOutboxConsole.php \
            server/app/Application/Messaging/MessageOutboxDispatch.php \
            server/app/Domain/Messaging/MessageDeliveryFailurePolicy.php \
            server/app/Domain/Messaging/WechatTemplateValue.php \
            server/tests/support/message_delivery_fakes.php \
            server/tests/v260_message_delivery_failure_policy.php \
            server/tests/v260_message_outbox_dispatch_policy.php \
            server/tests/v260_onboarding_notice_mysql.php \
            tools/test-mini-admin-worker-store-migration.php \
            server/views/admin/message-outbox.php; do
            php -l "$file"
          done
      - name: Mini program syntax
        working-directory: .validation/source
        run: |
          node --check miniprogram/subpackages/account/review/index.js
          node --check tools/test_review_notice_reconciliation.js
      - name: Mini admin static regression
        working-directory: .validation/source
        run: php tools/test-mini-admin-worker-store-migration.php
      - name: Review notice reconciliation regression
        working-directory: .validation/source
        run: node tools/test_review_notice_reconciliation.js
      - name: Shared delivery failure policy regression
        working-directory: .validation/source
        run: php server/tests/v260_message_delivery_failure_policy.php
      - name: Outbox dispatch policy regression
        working-directory: .validation/source
        run: php server/tests/v260_message_outbox_dispatch_policy.php
      - name: MySQL 5.7.44 outbox integration regression
        working-directory: .validation/source
        env:
          ONBOARDING_NOTICE_MYSQL_TEST: '1'
          V250_DB_PORT: '3306'
        run: php server/tests/v260_onboarding_notice_mysql.php
      - name: Set up PHP 7.4.34 production compatibility runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4.34'
          extensions: mbstring, pdo_mysql
          coverage: none
      - name: PHP 7.4.34 production syntax checks
        working-directory: .validation/source
        run: |
          set -euo pipefail
          for file in \
            server/app/Infrastructure/Messaging/OrderNotificationProjector.php \
            server/app/Services/OrderNotificationService.php \
            server/app/Contracts/MessageDeliveryReceiptQueue.php \
            server/app/Infrastructure/Messaging/SubscriptionQuotaStore.php \
            server/app/Infrastructure/Messaging/SubscriptionCatalog.php \
            server/app/Infrastructure/Messaging/OrderSubscriptionDefinitionOperations.php \
            server/app/Infrastructure/Persistence/DatabaseMiniAdminWorkerStoreRepository.php \
            server/app/Infrastructure/Messaging/DatabaseMessageDeliveryQueue.php \
            server/app/Infrastructure/Messaging/OrderSubscriptionQueue.php \
            server/app/Application/Messaging/MessageOutboxConsole.php \
            server/app/Application/Messaging/MessageOutboxDispatch.php \
            server/app/Domain/Messaging/MessageDeliveryFailurePolicy.php \
            server/app/Domain/Messaging/WechatTemplateValue.php \
            server/tests/support/message_delivery_fakes.php \
            server/tests/v260_message_delivery_failure_policy.php \
            server/tests/v260_message_outbox_dispatch_policy.php \
            server/tests/v260_onboarding_notice_mysql.php \
            tools/test-mini-admin-worker-store-migration.php \
            server/views/admin/message-outbox.php; do
            php -l "$file"
          done