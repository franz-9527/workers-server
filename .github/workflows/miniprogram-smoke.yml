name: Isolated Mini Program Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/miniprogram-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  miniprogram-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout workers candidate
        uses: actions/checkout@v4
        with:
          repository: franz-9527/workers
          ref: dev/2.5.0
          path: workers
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cancellation risk and navigation regression
        run: node workers/tools/test_v250_cancellation_risk_ui.js
