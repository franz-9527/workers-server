name: Order dialog theme and layout
on:
  push:
    branches: [main]
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated compiler and browser
        run: |
          npm install --no-save miniprogram-compiler@0.2.3 playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Compile production WXML
        run: node tools/check-wxml.js miniprogram --compile
      - name: Exercise page flows and browser layout
        run: |
          node tools/test_order_presentation.js --visual
          node tools/test_order_modal_layout.js --visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: order-dialog-screenshots
          path: artifacts/
          if-no-files-found: ignore
