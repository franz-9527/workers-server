name: Ordinary order creation and product reuse isolated
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ordinary-order:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mbstring,pdo_mysql,json
          coverage: none
      - name: PHP syntax and real MySQL regression
        env:
          ORDINARY_CREATE_MYSQL_TEST: '1'
          V250_DB_USER: root
          V250_DB_PASSWORD: root
        run: |
          php -v
          find server/app -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php server/tests/v250_ordinary_order_creation_mysql.php
