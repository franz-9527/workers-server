name: Compare published and patched worker review on PHP 8.3
on:
  push:
    paths: ['.github/workflows/php83-review.yml', 'tests/php83-review/**']
permissions:
  contents: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        revision: [published, fixed]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      mysql:
        image: mysql:5.7.44
        env:
          MYSQL_ROOT_PASSWORD: fixture-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: worker_review_fixture
        ports: [3306/tcp]
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, curl
      - name: Send review through the actual dispatcher with a simulated WeChat API
        env:
          FIXTURE_REVISION: ${{ matrix.revision }}
          TEST_MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
        run: |
          if [ "$FIXTURE_REVISION" = "published" ]; then
            cp -R tests/php83-review/published/. server/
          fi
          php -l server/app/Infrastructure/External/WeChatAccessTokenProvider.php
          php tests/php83-review/compare.php
