name: Python 3.13 chat helpers
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Media tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install verified Python 3.13 wheels
        run: python -m pip install --only-binary=:all: --require-hashes -r chat/helpers/images/requirements-py313.lock
      - name: Real offline media helpers
        run: python tests/python313_media.py
