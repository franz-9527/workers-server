name: Isolated production chat deployment
on:
  push:
    paths: ['qa-chat-production/**', '.github/workflows/qa-chat-production.yml']
permissions:
  contents: read
concurrency:
  group: qa-chat-production-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - id: source
        shell: bash
        run: |
          sha=$(tr -d '\r\n' < qa-chat-production/SOURCE_SHA)
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version-file: qa-chat-production/chat/go.mod
          cache-dependency-path: qa-chat-production/chat/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.36'
          extensions: pdo_mysql,sodium,mbstring,curl,gd
          coverage: none
      - run: python3 -m pip install --disable-pip-version-check Pillow==13.0.0 zxing-cpp==3.1.1
      - run: bash qa-chat-production/verify.sh
      - uses: actions/upload-artifact@v4
        with:
          name: chat-non-av-automation-${{ steps.source.outputs.sha }}
          path: |
            l1-automation-evidence.json
            non-av-automation-evidence.json
          if-no-files-found: error
          retention-days: 30
