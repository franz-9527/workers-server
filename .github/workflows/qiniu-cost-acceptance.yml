name: Temporary Qiniu cost acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/qiniu-cost-acceptance.yml']
permissions:
  contents: read
jobs:
  local-budget-and-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl
          coverage: none
      - name: Frozen source verification
        run: |
          set -euo pipefail
          echo 'workers source 715a3550f13b47483deda74cd62a75adc72a1c97'
          test "$(git hash-object 'tmp-qiniu/QiniuBudget.php')" = '1533c201d46cda4b34615443ae2eb58e4925b7ad'
          test "$(git hash-object 'tmp-qiniu/QiniuMediaReader.php')" = '653ab84fff2bf99717dfb8d626de8908b5628034'
          test "$(git hash-object 'tmp-qiniu/QiniuBillingUsage.php')" = '1b0304b411b6c140dca9654212dfc364fbdfd2c8'
          test "$(git hash-object 'tmp-qiniu/budget_linux.go')" = 'b8ba28a95d1e86601be29c1545ffd5495224078c'
          php -v
          go version
      - name: PHP lint and local-only billing parser
        working-directory: tmp-qiniu
        run: |
          for f in *.php; do php -l "$f" || exit 1; done
          FIXTURE_ROOT="$(mktemp -d)" php fixture.php billing
      - name: PHP Go shared real flock ledger
        working-directory: tmp-qiniu
        run: |
          GO111MODULE=off go test -race -v .
      - name: PHP cache using loopback only
        if: ${{ !cancelled() }}
        working-directory: tmp-qiniu
        run: |
          python3 fixture_server.py &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          sleep 1
          FIXTURE_ROOT="$(mktemp -d)" php fixture.php cache
