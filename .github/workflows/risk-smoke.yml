name: Isolated 2.5.0 Smoke
on:
  push:
    branches: [main]
    paths:
      - 'server/app/**'
      - 'server/views/admin/**'
      - 'server/database/**'
      - 'server/tests/**'
      - 'tests/risk-smoke.php'
      - '.github/workflows/risk-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: worker_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax lint
        run: |
          find server/app server/views/admin server/tests tools -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Risk policy and static integration smoke
        run: php tests/risk-smoke.php
      - name: Platform external booking fee regression
        run: php server/tests/v250_platform_booking_fee_isolated.php
      - name: Platform external booking verifier regression
        run: php server/tests/v250_platform_booking_verifier_isolated.php
      - name: WeCom admin mini-program entry regression
        run: php server/tests/v250_wecom_admin_entry_regression.php
      - name: Audit hall merged migration regression
        run: php server/tests/v250_review_hall_demo_regression.php
      - name: MySQL 5.7 merged migration and idempotency
        shell: bash
        run: |
          set -euo pipefail
          MYSQL=(mysql --protocol=tcp -h127.0.0.1 -P3306 -uroot -proot --default-character-set=utf8mb4 worker_test)
          VERSION="$(${MYSQL[@]} -Nse 'SELECT VERSION()')"
          [[ "$VERSION" == 5.7.* ]] || { echo "expected MySQL 5.7, got $VERSION" >&2; exit 1; }

          "${MYSQL[@]}" < server/tests/fixtures/v241-release-minimal.sql
          "${MYSQL[@]}" < server/database/upgrades/2.5.0.sql
          "${MYSQL[@]}" < server/database/upgrades/2.5.0.sql

          [[ "$(${MYSQL[@]} -Nse "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema=DATABASE() AND table_name='reviews' AND column_name IN ('attitude_rating','craft_rating')")" == "2" ]]
          [[ "$(${MYSQL[@]} -Nse "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema=DATABASE() AND table_name='reviews' AND column_name='rating'")" == "0" ]]
          [[ "$(${MYSQL[@]} -Nse "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name LIKE 'order_cancellation_risk_%'")" == "4" ]]
          [[ "$(${MYSQL[@]} -Nse "SELECT COUNT(*) FROM orders WHERE is_demo=1 AND BINARY public_no LIKE BINARY 'BXDEMOHALL%'")" == "6" ]]
          [[ "$(${MYSQL[@]} -Nse "SELECT COUNT(DISTINCT public_no) FROM orders WHERE is_demo=1 AND BINARY public_no LIKE BINARY 'BXDEMOHALL%'")" == "6" ]]
          [[ "$(${MYSQL[@]} -Nse "SELECT COUNT(*) FROM order_platform_terms opt JOIN orders o ON o.id=opt.order_id WHERE o.public_no IN ('BXDEMOHALL05','BXDEMOHALL06')")" == "2" ]]
          [[ "$(${MYSQL[@]} -Nse "SELECT COUNT(*) FROM order_measurement_states oms JOIN orders o ON o.id=oms.order_id WHERE o.public_no IN ('BXDEMOHALL03','BXDEMOHALL06')")" == "2" ]]
          [[ "$(${MYSQL[@]} -Nse "SELECT COUNT(*) FROM orders WHERE BINARY public_no LIKE BINARY 'BXDEMOHALL%' AND (audit_status<>'approved' OR publish_status<>'published' OR payment_status<>'paid' OR quote_status<>'waiting' OR assignment_status<>'unassigned' OR fulfillment_status<>'not_started' OR lifecycle_status<>'active' OR is_demo<>1)")" == "0" ]]
          [[ "$(${MYSQL[@]} -Nse "SELECT COUNT(*) FROM orders WHERE public_no='BXDEMOHALL02' AND dispatch_mode='single_grab'")" == "1" ]]
          [[ "$(${MYSQL[@]} -Nse "SELECT COUNT(*) FROM orders WHERE public_no='BXDEMOHALL06' AND workflow_profile='measurement' AND order_source_type='platform'")" == "1" ]]

          echo "merged migration sha256=$(sha256sum server/database/upgrades/2.5.0.sql | awk '{print $1}')"
          echo "MySQL $VERSION merged 2.5.0 migration passed twice with 6 hall samples"
