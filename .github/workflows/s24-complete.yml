        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,pathlib
          for name in ["snapshot/chat/internal/policy/collaboration.go","snapshot/chat/internal/ports/contracts.go","snapshot/chat/internal/policy/projection.go","snapshot/chat/internal/conversation/store.go","snapshot/chat/internal/conversation/consumer.go","snapshot/chat/internal/conversation/realtime.go","snapshot/chat/internal/message/collaboration.go","snapshot/chat/internal/message/service.go","snapshot/chat/internal/message/media_worker.go","snapshot/chat/internal/message/av_publish.go","snapshot/chat/internal/message/history.go","snapshot/chat/internal/message/audit_history.go","snapshot/chat/internal/message/unread.go","snapshot/chat/internal/message/s09_http.go","snapshot/chat/internal/message/history_http.go","snapshot/chat/internal/bootstrap/server.go","snapshot/chat/internal/policy/collaboration_test.go","snapshot/chat/internal/message/collaboration_integration_test.go","snapshot/chat/internal/message/collaboration_realtime_integration_test.go"]:
              p=pathlib.Path(name)
