name: S24 collaboration contract
on:
  push:
    branches: [main]
    paths: ['snapshot/**', '.github/workflows/s24-contract.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s24-contract
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact source blobs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib
          expected = {"chat/go.mod":"9e5d6b33a9a9fd732dcd518a1e8a8a3c7af2deba","chat/go.sum":"fb24675236722882b2484e1d8be224fa18a08a0e","chat/internal/ports/contracts.go":"137d343e8b302117a4c4848e03f638c0ed14e9d4","chat/internal/ports/contracts_test.go":"98abbe87b7b3258d9ec03ce56ef43b18274a652e","chat/internal/policy/guard.go":"1d12bacfc4d79a83b1ea06ee6aa10559e89d7f12","chat/internal/policy/projection.go":"2b508cb04a4cfb54f173c76c93acd08e57523e93","chat/internal/policy/recipient.go":"32b62df34254552f9cef940f5f9bb431086bbd0d","chat/internal/policy/guard_test.go":"173bd70b0519a783fe08fea30b39fba8f39f8729","chat/internal/policy/collaboration.go":"ccadd1f0b351cd775b875fe3d745dae618837109","chat/internal/policy/collaboration_test.go":"96dcd9c16815722f41967b5d55031dfc81493e76","server/app/Domain/Chat/OrderConversationPolicy.php":"be808179be02bd24ff7914d89d3fa0dbefc70087","server/app/Domain/Chat/CollaborationConversationPolicy.php":"c8cca6869e38779cb615d2d4318646a5a7ebb069","server/tests/chat_collaboration_policy_contract.php":"12e3fe6b14d2f92376ba3c530f7db3d415840e66"}
          root = pathlib.Path("snapshot")
          actual = sorted(str(p.relative_to(root)) for p in root.rglob("*") if p.is_file())
          if actual != sorted(expected):
              raise SystemExit("Unexpected snapshot paths")
          for name, sha in expected.items():
              body = (root / name).read_bytes()
              digest = hashlib.sha1(b"blob " + str(len(body)).encode() + b"\0" + body).hexdigest()
              if digest != sha:
                  raise SystemExit("Source mismatch: " + name)
              print("TESTED_BLOB " + sha + " " + name)
          PY
      - uses: actions/setup-go@v5
        with:
          go-version-file: snapshot/chat/go.mod
          cache: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.36'
          coverage: none
      - name: PHP producer and cross-language fixture
        shell: bash
        run: |
          set -euo pipefail
          php -r 'if (PHP_VERSION !== "8.3.36") { exit(1); } echo "PHP ".PHP_VERSION." verified\n";'
          find snapshot/server -name '*.php' -print0 | xargs -0 -n1 php -l
          php snapshot/server/tests/chat_collaboration_policy_contract.php
          php snapshot/server/tests/chat_collaboration_policy_contract.php --emit-fixtures > "$RUNNER_TEMP/s24-php-fixtures.json"
          echo "CHAT_S24_PHP_FIXTURES=$RUNNER_TEMP/s24-php-fixtures.json" >> "$GITHUB_ENV"
      - name: Go formatting, build, vet and all included race tests
        working-directory: snapshot/chat
        shell: bash
        run: |
          set -euo pipefail
          go version
          test -z "$(gofmt -l internal/policy/collaboration.go internal/policy/collaboration_test.go)" || gofmt -w internal/policy/collaboration.go internal/policy/collaboration_test.go
          go vet ./...
          go build ./...
          go test -race -count=1 -v ./...
      - name: Bounded strict-decoder fuzz
        working-directory: snapshot/chat
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/policy -run '^$' -fuzz '^FuzzCollaborationSnapshot$' -fuzztime=15s -parallel=2
      - name: Record formatted candidate sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, pathlib
          for name in ["chat/internal/policy/collaboration.go","chat/internal/policy/collaboration_test.go"]:
              body = (pathlib.Path("snapshot") / name).read_bytes()
              sha = hashlib.sha1(b"blob " + str(len(body)).encode() + b"\0" + body).hexdigest()
              print("FORMATTED_BLOB " + sha + " " + name)
              print("FORMATTED_SOURCE " + name + " " + base64.b64encode(body).decode())
          PY
