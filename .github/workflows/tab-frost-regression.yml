name: Preserve tab shape with a frosted background
on:
  push:
    paths: ['.github/workflows/tab-frost-regression.yml', 'tests/tab-hall/**']
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/tab-hall/visual.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: tab-frost-preview
          path: layout-artifacts
          retention-days: 7
