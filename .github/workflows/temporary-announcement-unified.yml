name: Temporary unified announcement validation

on:
  push:
    branches: [main]
    paths:
      - '.validation/announcement-unified/**'
      - '.github/workflows/temporary-announcement-unified.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-announcement-unified-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.36'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify runtime and source blobs
        run: |
          php -r 'echo PHP_VERSION, PHP_EOL; if (PHP_VERSION !== "8.3.36") { fwrite(STDERR, "Expected PHP 8.3.36\n"); exit(1); }'
          cd .validation/announcement-unified
          tail -n +2 SOURCE_MANIFEST | while read expected path; do
            actual=$(git hash-object "$path")
            test "$actual" = "$expected" || { echo "blob mismatch $path $actual != $expected"; exit 1; }
          done
      - name: PHP syntax
        run: |
          cd .validation/announcement-unified
          for file in             source/server/app/Application/Messaging/AnnouncementQuery.php             source/server/app/Domain/Messaging/SettingsValuePolicy.php             source/server/app/Infrastructure/Settings/DatabaseAdminConfigurationRepository.php             source/server/app/Http/Api/Modules/MessagingApiModule.php             source/server/app/Application/Messaging/SettingsRead.php             source/server/views/admin/settings.php             test.php; do php -l "$file"; done
      - name: PHP behavior contract
        run: php .validation/announcement-unified/test.php
      - name: JavaScript syntax and behavior
        run: |
          node --check .validation/announcement-unified/source/miniprogram/utils/AnnouncementLoader.js
          node --check .validation/announcement-unified/source/miniprogram/components/order-announcement/index.js
          node --check .validation/announcement-unified/test.js
          node .validation/announcement-unified/test.js
      - name: Static integration contract
        run: python3 .validation/announcement-unified/check.py
