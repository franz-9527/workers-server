name: Temporary ASR admin diagnostic
on:
  push:
    branches: [main]
    paths:
      - 'server/views/admin/chat-settings.php'
      - 'server/app/Application/Chat/ChatAsrSelfDiagnostic.php'
      - 'server/app/Application/Chat/ChatGoRuntimeConfig.php'
      - 'tests/chat_asr_admin_diagnostic.php'
      - '.github/workflows/temporary-asr-admin-diagnostic.yml'
permissions:
  contents: read
concurrency:
  group: temporary-asr-admin-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l server/views/admin/chat-settings.php
          php -l server/app/Application/Chat/ChatAsrSelfDiagnostic.php
          php -l server/app/Application/Chat/ChatGoRuntimeConfig.php
          php -l tests/chat_asr_admin_diagnostic.php
          php -l tools/test-chat-tencent-asr.php
      - name: ASR admin diagnostic contract
        run: php tests/chat_asr_admin_diagnostic.php
