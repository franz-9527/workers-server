name: Temporary ASR auto fallback live verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-asr-auto-fallback-live.yml'
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for test-site chatd deployment
        env:
          TARGET_SHA: 0d51f10a401a7219b4af2d632c1a41a6005db06d
        run: |
          set -euo pipefail
          URL='https://test.20m.cc/api/?route=health'
          for i in $(seq 1 96); do
            if BODY=$(curl --silent --show-error --fail --max-time 10 "$URL"); then
              if echo "$BODY" | jq -e . >/dev/null 2>&1; then
                echo "$BODY" | jq -c '{version,chat_go}'
                RUNNING=$(echo "$BODY" | jq -r '.chat_go.running_sha // ""')
                DEPLOYED=$(echo "$BODY" | jq -r '.chat_go.deployed_sha // ""')
                if [[ "$RUNNING" == "$TARGET_SHA" && "$DEPLOYED" == "$TARGET_SHA" ]]; then
                  echo "ASR_AUTO_FALLBACK_DEPLOY_OK"
                  exit 0
                fi
              fi
            fi
            sleep 5
          done
          echo 'ASR_AUTO_FALLBACK_DEPLOY_NOT_READY'
          exit 1
