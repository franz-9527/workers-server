name: Temporary ASR auto fallback validation
on:
  push:
    branches: [main]
    paths:
      - '.validation/asr-auto-fallback/**'
      - '.github/workflows/temporary-asr-auto-fallback.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Validate fallback policy
        run: |
          set -euo pipefail
          cd .validation/asr-auto-fallback
          gofmt -w ./avfallback
          test -z "$(gofmt -l ./avfallback)"
          go test -race -count=1 ./avfallback
          go vet ./avfallback
          gofmt -w candidate/policy.go candidate/av_inspection.go candidate/av_worker.go
          python3 state_contract.py
      - name: Validation complete
        run: echo ASR_AUTO_FALLBACK_VALIDATION_PASS
