name: Temporary always-visible ASR diagnostic card
on:
  push:
    branches: [main]
    paths:
      - '.validation/asr-card/**'
      - '.github/workflows/temporary-asr-card.yml'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l .validation/asr-card/server/app/Application/Chat/ChatGoRuntimeConfig.php
          php -l .validation/asr-card/server/views/admin/chat-settings.php
      - name: Diagnostic visibility contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          cfg=Path('.validation/asr-card/server/app/Application/Chat/ChatGoRuntimeConfig.php').read_text()
          view=Path('.validation/asr-card/server/views/admin/chat-settings.php').read_text()
          assert "SELECT intent_id,ordinal,state,metadata_json,created_at FROM chat_av_asr_requests ORDER BY created_at DESC LIMIT 1" in cfg
          assert "return['status'=>'empty']" in cfg
          assert "'status'=>'request_seen'" in cfg
          assert "'status']='diagnostic_ready'" in cfg
          assert 'ASR 调用诊断' in view
          assert '本卡会一直保留' in view
          assert 'Go current' in view and 'deployed' in view and 'running' in view
          assert "$asrDiagnosticReady=$asrDiagnosticStatus==='diagnostic_ready';" in view
          assert "if($canManage)" in view
          assert "if(!empty($asrDiagnostic))" not in view
          print('ASR diagnostic card is always visible for super-admin and exposes runtime SHAs')
          PY
