name: Temporary SentenceASR compatibility probe
on:
  push:
    branches: [main]
    paths:
      - '.validation/asr-compat/**'
      - '.github/workflows/temporary-asr-compat.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, curl
      - name: Go SentenceASR compatibility envelope
        run: |
          cd .validation/asr-compat
          gofmt -w ./asrcontract
          test -z "$(gofmt -l ./asrcontract)"
          go test -race -count=1 ./asrcontract
          go vet ./asrcontract
      - name: PHP real-probe contract
        run: |
          php -l .validation/asr-compat/ChatAsrOpenApiProbe.php
          php -l .validation/asr-compat/probe_contract.php
          php -l .validation/asr-compat/chat-asr-diagnostic.php
          php .validation/asr-compat/probe_contract.php
          grep -F "compat_data_object" .validation/asr-compat/ChatAsrOpenApiProbe.php
          grep -F "CHAT_ASR_OPENAPI_PROBE_CACHED" .validation/asr-compat/chat-asr-diagnostic.php
      - name: Validate exact integration candidate snapshots
        run: |
          php -l .validation/asr-compat/candidate/server__app__Application__Chat__ChatGoRuntimeConfig.php
          php -l .validation/asr-compat/candidate/server__views__admin__chat-settings.php
          php -l .validation/asr-compat/candidate/server__api__index.php
          php -l .validation/asr-compat/candidate/server__bin__chat-asr-diagnostic.php
          bash -n .validation/asr-compat/candidate/chat__deploy__bt-deploy.sh
          node --check .validation/asr-compat/candidate/miniprogram__subpackages__chat__conversation__av.js
          grep -F "chat-asr-diagnostic.php" .validation/asr-compat/candidate/chat__deploy__bt-deploy.sh
          grep -F "asr_probe" .validation/asr-compat/candidate/server__api__index.php
          grep -F "chat_go" .validation/asr-compat/candidate/server__api__index.php
          grep -F "CHAT_ASR_PROBE_SEGMENT_KEY_UNSUPPORTED" .validation/asr-compat/candidate/server__bin__chat-asr-diagnostic.php
          grep -F "CHAT_ASR_PROBE_SEGMENT_OBJECT_UNBOUND" .validation/asr-compat/candidate/server__bin__chat-asr-diagnostic.php
          php -r '$p="#^(?:chatav|(?:[A-Za-z0-9_-]{1,40}/){1,4}av)/test/[1-9][0-9]{0,19}/[0-9a-f]{64}/[0-9a-f]{64}/(?:main|check-[01])\\.mp3$#D";$base="test/chat/av/test/30/".str_repeat("a",64)."/".str_repeat("b",64)."/";exit(preg_match($p,$base."main.mp3")===1&&preg_match($p,$base."check-0.mp3")===1&&preg_match($p,$base."poster.jpg")===0?0:1);'
          grep -F "openapi_probe" .validation/asr-compat/candidate/server__app__Application__Chat__ChatGoRuntimeConfig.php
