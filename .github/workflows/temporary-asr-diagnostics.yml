name: Temporary ASR failure diagnostics
on:
  push:
    branches: [main]
    paths:
      - '.validation/asr-diagnostics/**'
      - '.github/workflows/temporary-asr-diagnostics.yml'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          gofmt -d .validation/asr-diagnostics/chat/internal/ports/contracts.go | tee /tmp/1
          gofmt -d .validation/asr-diagnostics/chat/internal/message/av_inspection.go | tee /tmp/2
          gofmt -d .validation/asr-diagnostics/chat/internal/moderation/av.go | tee /tmp/3
          test ! -s /tmp/1 && test ! -s /tmp/2 && test ! -s /tmp/3
          node --check .validation/asr-diagnostics/miniprogram/subpackages/chat/conversation/av.js
          php -l .validation/asr-diagnostics/server/app/Application/Chat/ChatGoRuntimeConfig.php
          php -l .validation/asr-diagnostics/server/views/admin/chat-settings.php
      - name: Diagnostic persistence contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          ports=Path('.validation/asr-diagnostics/chat/internal/ports/contracts.go').read_text()
          msg=Path('.validation/asr-diagnostics/chat/internal/message/av_inspection.go').read_text()
          mod=Path('.validation/asr-diagnostics/chat/internal/moderation/av.go').read_text()
          php=Path('.validation/asr-diagnostics/server/app/Application/Chat/ChatGoRuntimeConfig.php').read_text()
          view=Path('.validation/asr-diagnostics/server/views/admin/chat-settings.php').read_text()
          js=Path('.validation/asr-diagnostics/miniprogram/subpackages/chat/conversation/av.js').read_text()
          assert 'ProviderCode, ProviderMessage, ProviderInnerCode' in ports
          assert "SET state='failed',metadata_json=?" in msg
          assert '"provider_message": result.ProviderMessage' in msg
          assert 'Message string' in mod and 'json:"errmsg"' in mod
          assert 'safeASRDiagnosticText' in mod and 'providerErrorFromData' in mod
          assert 'parsedURL.Hostname()' in mod
          assert 'recentAsrDiagnostic()' in php
          assert "WHERE state='failed' AND metadata_json IS NOT NULL" in php
          assert '最近一次 ASR 失败诊断' in view
          assert '完整音频 URL' in view
          assert '9301002' in js and '最近一次 ASR 失败诊断' in js
          print('safe ASR diagnostic persistence and admin display contract passed')
          PY
      - name: Secret redaction contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          mod=Path('.validation/asr-diagnostics/chat/internal/moderation/av.go').read_text()
          assert '[url]' in mod
          assert '[redacted]' in mod
          assert 'out.InputHost = parsedURL.Hostname()' in mod
          print('diagnostic stores host and lengths, not full URL/token')
          PY
