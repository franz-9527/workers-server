name: Temporary direct-data ASR regression
on:
  push:
    branches: [main]
    paths:
      - '.validation/asr-direct-data/**'
      - '.github/workflows/temporary-asr-direct-data.yml'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          gofmt -d .validation/asr-direct-data/chat/internal/ports/contracts.go | tee /tmp/1
          gofmt -d .validation/asr-direct-data/chat/internal/message/av_inspection.go | tee /tmp/2
          gofmt -d .validation/asr-direct-data/chat/internal/moderation/av.go | tee /tmp/3
          gofmt -d .validation/asr-direct-data/chat/internal/moderation/media_callback_test.go | tee /tmp/4
          test ! -s /tmp/1 && test ! -s /tmp/2 && test ! -s /tmp/3 && test ! -s /tmp/4
          php -l .validation/asr-direct-data/server/views/admin/chat-settings.php
      - name: Direct-data request contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          msg=Path('.validation/asr-direct-data/chat/internal/message/av_inspection.go').read_text()
          mod=Path('.validation/asr-direct-data/chat/internal/moderation/av.go').read_text()
          ports=Path('.validation/asr-direct-data/chat/internal/ports/contracts.go').read_text()
          assert 'Data           []byte' in ports
          assert 'a.storage.Read(ctx, segment.Key, MaxVoiceBytes)' in msg
          assert 'mediaHash(audio) != segment.Hash' in msg
          assert 'Data: audio' in msg and 'URL: url' not in msg.split('result, e := a.inspector.Recognize',1)[1].split('\n',1)[0]
          assert '"SourceType": 1' in mod
          assert '"Data": base64.StdEncoding.EncodeToString(q.Data)' in mod
          assert '"DataLen": len(q.Data)' in mod
          asr=mod.split('data := any(map[string]any',1)[1].split('})',1)[0]
          assert '"Url"' not in asr
          assert 'validAudioInspectionURL(q.URL)' in mod
          print('ASR direct-data mode bypasses provider URL fetch; media safety keeps URL validation')
          PY
      - name: Payload size sanity
        run: |
          python3 - <<'PY'
          import base64
          raw=b'x'*(1<<20)
          encoded=base64.b64encode(raw)
          assert len(encoded)==1398104
          assert len(encoded)<3*1024*1024
          print('1 MiB audio ->',len(encoded),'base64 bytes')
          PY
