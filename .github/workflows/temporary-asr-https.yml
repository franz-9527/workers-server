name: Temporary SentenceASR HTTPS contract regression
on:
  push:
    branches: [main]
    paths:
      - '.validation/asr-https/**'
      - '.github/workflows/temporary-asr-https.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: '.validation/asr-https/chat/go.mod'
          cache: false
      - name: Go contract
        run: |
          cd .validation/asr-https/chat
          gofmt -w internal/ports/contracts.go internal/moderation/av.go internal/message/av_inspection.go internal/moderation/media_callback_test.go
          grep -F 'dataEncoding = "json_string"' internal/moderation/av.go
          grep -F 'data_encoding' internal/message/av_inspection.go
          go mod verify
          go test ./internal/moderation
      - name: PHP contract
        run: |
          php -l .validation/asr-https/server/app/Application/Chat/ChatGoRuntimeConfig.php
          php -l .validation/asr-https/server/views/admin/chat-settings.php
          grep -F "sentence_asr')\$encoding='json_string'" .validation/asr-https/server/app/Application/Chat/ChatGoRuntimeConfig.php
          grep -F 'local_datetime' .validation/asr-https/server/views/admin/chat-settings.php
          grep -F 'data_encoding' .validation/asr-https/server/views/admin/chat-settings.php
