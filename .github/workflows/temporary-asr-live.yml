name: Temporary test-site ASR live diagnostic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-asr-live.yml'
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for reviewed WechatSI fallback deployment
        env:
          TARGET_SHA: d2d9fb7c0f235c25f4816dec745b30a4c043c411
        run: |
          set -euo pipefail
          URL='https://test.20m.cc/api/?route=health'
          for i in $(seq 1 72); do
            if BODY=$(curl --silent --show-error --fail --max-time 10 "$URL"); then
              if printf '%s' "$BODY" | jq -e . >/dev/null 2>&1; then
                printf '%s\n' "$BODY" | jq -c '{version,chat_go,asr_probe_revision,asr_probe,wechat_si_plugin}'
                RUNNING=$(printf '%s' "$BODY" | jq -r '.chat_go.running_sha // ""')
                PLUGIN_STATUS=$(printf '%s' "$BODY" | jq -r '.wechat_si_plugin.status // ""')
                if [[ "$RUNNING" == "$TARGET_SHA" && ( "$PLUGIN_STATUS" == "completed" || "$PLUGIN_STATUS" == "failed" ) ]]; then
                  exit 0
                fi
              fi
            fi
            sleep 5
          done
          echo 'TEST_SITE_REVIEWED_WECHATSI_FALLBACK_NOT_READY'
          exit 1
