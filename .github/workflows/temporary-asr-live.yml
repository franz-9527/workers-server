name: Temporary test-site ASR live diagnostic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-asr-live.yml'
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for reconciled BaoTa deployment and ASR probe
        run: |
          set -euo pipefail
          URL='https://test.20m.cc/api/?route=health'
          for i in $(seq 1 60); do
            if BODY=$(curl --silent --show-error --fail --max-time 10 "$URL"); then
              if printf '%s' "$BODY" | jq -e . >/dev/null 2>&1; then
                printf '%s\n' "$BODY" | jq -c '{version,build_sha,asr_probe_revision,asr_probe}'
                REV=$(printf '%s' "$BODY" | jq -r '.asr_probe_revision // ""')
                STATUS=$(printf '%s' "$BODY" | jq -r '.asr_probe.status // ""')
                if [[ "$REV" == "sentence-asr-compat-v2" && ( "$STATUS" == "completed" || "$STATUS" == "failed" ) ]]; then
                  exit 0
                fi
              fi
            fi
            sleep 5
          done
          echo 'TEST_SITE_ASR_PROBE_NOT_READY'
          exit 1
