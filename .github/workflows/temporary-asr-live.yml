name: Temporary test-site ASR live diagnostic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-asr-live.yml'
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Snapshot test-site ASR probe execution state
        run: |
          set -euo pipefail
          BODY=$(curl --silent --show-error --fail --max-time 10 'https://test.20m.cc/api/?route=health')
          printf '%s' "$BODY" | jq -e . >/dev/null
          printf '%s\n' "$BODY" | jq -c '{version,build_sha,asr_probe_revision,chat_go,asr_probe}'
