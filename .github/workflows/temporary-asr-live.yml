name: Temporary test-site ASR live diagnostic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-asr-live.yml'
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for ASR probe v4 and print sanitized live result
        env:
          TARGET_SHA: 8fb7c3c2cae7c8b15df2dd84dc8045fa1960fb02
        run: |
          set -euo pipefail
          URL='https://test.20m.cc/api/?route=health'
          for i in $(seq 1 72); do
            if BODY=$(curl --silent --show-error --fail --max-time 10 "$URL"); then
              if printf '%s' "$BODY" | jq -e . >/dev/null 2>&1; then
                printf '%s\n' "$BODY" | jq -c '{version,build_sha,asr_probe_revision,chat_go,asr_probe}'
                RUNNING=$(printf '%s' "$BODY" | jq -r '.chat_go.running_sha // ""')
                REV=$(printf '%s' "$BODY" | jq -r '.asr_probe.revision // ""')
                STATUS=$(printf '%s' "$BODY" | jq -r '.asr_probe.status // ""')
                if [[ "$RUNNING" == "$TARGET_SHA" && "$REV" == "sentence-asr-compat-v4" && ( "$STATUS" == "completed" || "$STATUS" == "failed" || "$STATUS" == "skipped" ) ]]; then
                  exit 0
                fi
              fi
            fi
            sleep 5
          done
          echo 'TEST_SITE_ASR_PROBE_V4_NOT_READY'
          exit 1
