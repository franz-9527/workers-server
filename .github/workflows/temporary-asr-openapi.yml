name: Temporary ASR OpenAPI contract
on:
  push:
    branches: [main]
    paths:
      - '.validation/asr-openapi/**'
      - '.github/workflows/temporary-asr-openapi.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Validate SentenceASR Open API envelope
        run: |
          cd .validation/asr-openapi
          test -z "$(gofmt -l ./asrcontract)"
          go test -race -count=1 ./asrcontract
          go vet ./asrcontract
      - name: Validate intended source snapshots
        run: |
          gofmt -w .validation/asr-openapi/snapshots/av.go
          test -z "$(gofmt -l .validation/asr-openapi/snapshots/av.go)"
          php -l .validation/asr-openapi/snapshots/ChatGoRuntimeConfig.php
          php -l .validation/asr-openapi/snapshots/chat-settings.php
          python3 .validation/asr-openapi/check_snapshots.py
