name: Temporary ASR provider fallback live verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-asr-provider-fallback-live.yml'
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for test-site deployment and v7 probe
        env:
          TARGET_SHA: 4235a6445cd7bd1616065ac8c6e899b748c3ea39
        run: |
          set -euo pipefail
          URL='https://test.20m.cc/api/?route=health'
          for i in $(seq 1 96); do
            if BODY=$(curl --silent --show-error --fail --max-time 10 "$URL"); then
              if echo "$BODY" | jq -e . >/dev/null 2>&1; then
                echo "$BODY" | jq -c '{version,chat_go,asr_probe_revision,asr_probe,wechat_si_plugin}'
                RUNNING=$(echo "$BODY" | jq -r '.chat_go.running_sha // ""')
                REV=$(echo "$BODY" | jq -r '.asr_probe_revision // ""')
                STATUS=$(echo "$BODY" | jq -r '.asr_probe.status // ""')
                NAME=$(echo "$BODY" | jq -r '.asr_probe.variants[0].name // ""')
                ENCODING=$(echo "$BODY" | jq -r '.asr_probe.variants[0].request_data_encoding // ""')
                MODE=$(echo "$BODY" | jq -r '.asr_probe.variants[0].input_mode // ""')
                KEYLEN=$(echo "$BODY" | jq -r '.asr_probe.variants[0].request_key_length // 0')
                if [[ "$RUNNING" == "$TARGET_SHA" && "$REV" == "sentence-asr-data-shape-v7" && "$STATUS" == "completed" && "$NAME" == "sentence_asr_json_string_url_encoded" && "$ENCODING" == "json_string" && "$MODE" == "url_encoded" && "$KEYLEN" == "32" ]]; then
                  echo "$BODY" | jq -c '.asr_probe.variants[0]'
                  exit 0
                fi
              fi
            fi
            sleep 5
          done
          echo 'TEST_SITE_ASR_PROVIDER_FALLBACK_V7_NOT_READY'
          exit 1
