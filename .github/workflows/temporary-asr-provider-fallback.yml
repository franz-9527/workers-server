name: Temporary ASR provider fallback validation
on:
  push:
    branches: [main]
    paths:
      - '.validation/asr-provider-fallback/**'
      - '.github/workflows/temporary-asr-provider-fallback.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, curl
      - name: Provider fallback policy
        run: |
          set -euo pipefail
          cd .validation/asr-provider-fallback
          test -z "$(gofmt -l ./avfallback)"
          go test -race -count=1 ./avfallback
          go vet ./avfallback
      - name: SentenceASR data-shape probe contract
        run: |
          set -euo pipefail
          php -l .validation/asr-provider-fallback/ChatAsrOpenApiProbe.php
          php -l .validation/asr-provider-fallback/probe_contract.php
          php .validation/asr-provider-fallback/probe_contract.php
      - name: Integration candidate invariants
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .validation/asr-provider-fallback/candidate/*.go)"
          python3 - <<'PY'
          from pathlib import Path
          root=Path('.validation/asr-provider-fallback/candidate')
          policy=(root/'policy.go').read_text()
          inspection=(root/'av_inspection.go').read_text()
          review=(root/'av_review.go').read_text()
          publish=(root/'av_publish.go').read_text()
          checks=[
              ('CHAT_AV_ASR_PROVIDER_FALLBACK_REVIEW',policy),
              ('kind != "audio" || !ValidOptionalTranscript',policy),
              ('errorCode == ReviewCode && sourceProof == "" && rawDecision == ""',policy),
              ('func PublishCandidate(kind, transcript, sourceProof, textProof string)',policy),
              ('providerFallbackReview(ctx, v, string(meta))',inspection),
              ("transcript=NULLIF(?,''),phase='review_pending'",inspection),
              ('if v.Proof == ""',inspection),
              ('ReviewTransition(request.MessageType',review),
              ('PublishCandidate(q.MessageType, v.Transcript',publish),
          ]
          for needle,body in checks:
              if needle not in body:
                  raise SystemExit('missing invariant: '+needle)
          if 'if transcript == ""' in inspection:
              raise SystemExit('empty transcript still blocks provider fallback')
          PY
