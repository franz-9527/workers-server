name: Temporary ASR self-diagnostic deploy verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-asr-self-diagnostic-live.yml'
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for test site deployment
        env:
          TARGET_SHA: a673b5b9a082eaa3be5fb3f6af1a05aa879648da
        run: |
          set -euo pipefail
          URL='https://test.20m.cc/api/?route=health'
          for i in $(seq 1 120); do
            BODY="$(curl --silent --show-error --fail --max-time 10 "$URL" || true)"
            if echo "$BODY" | jq -e . >/dev/null 2>&1; then
              echo "$BODY" | jq -c '{version,build_sha,chat_go,asr_probe}'
              RUNNING="$(echo "$BODY" | jq -r '.chat_go.running_sha // ""')"
              DEPLOYED="$(echo "$BODY" | jq -r '.chat_go.deployed_sha // ""')"
              if [[ "$RUNNING" == "$TARGET_SHA" && "$DEPLOYED" == "$TARGET_SHA" ]]; then
                echo 'ASR_SELF_DIAGNOSTIC_DEPLOY_OK'
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'ASR_SELF_DIAGNOSTIC_DEPLOY_NOT_READY'
          exit 1
