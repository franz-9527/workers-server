name: Temporary ASR site-source live verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-asr-site-source-live.yml'
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for deployed chatd and v8 site-source probe
        env:
          TARGET_SHA: de7e5aec8f286bfe3b3e414ecb7ddb885e798041
          TARGET_REVISION: sentence-asr-site-https-object-v8
        run: |
          set -euo pipefail
          URL='https://test.20m.cc/api/?route=health'
          for i in $(seq 1 120); do
            BODY="$(curl --silent --show-error --fail --max-time 10 "$URL" || true)"
            if echo "$BODY" | jq -e . >/dev/null 2>&1; then
              echo "$BODY" | jq -c '{version,chat_go,asr_probe}'
              RUNNING="$(echo "$BODY" | jq -r '.chat_go.running_sha // ""')"
              DEPLOYED="$(echo "$BODY" | jq -r '.chat_go.deployed_sha // ""')"
              REVISION="$(echo "$BODY" | jq -r '.asr_probe.revision // ""')"
              if [[ "$RUNNING" == "$TARGET_SHA" && "$DEPLOYED" == "$TARGET_SHA" && "$REVISION" == "$TARGET_REVISION" ]]; then
                echo "$BODY" | jq -c '.asr_probe'
                echo 'ASR_SITE_SOURCE_DEPLOY_OK'
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'ASR_SITE_SOURCE_DEPLOY_NOT_READY'
          exit 1
