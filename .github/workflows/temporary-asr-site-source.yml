name: Temporary ASR website-source validation
on:
  push:
    branches: [main]
    paths:
      - '.validation/asr-site-source/**'
      - '.github/workflows/temporary-asr-site-source.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: testrepo
      - name: Syntax and contract
        run: |
          set -euo pipefail
          test -z "$(gofmt -l testrepo/.validation/asr-site-source/candidate/chat/internal/avpipeline/config.go testrepo/.validation/asr-site-source/candidate/chat/internal/imagepipeline/local_asr_mirror.go testrepo/.validation/asr-site-source/candidate/chat/internal/message/av_cleanup.go)"
          php -l testrepo/.validation/asr-site-source/candidate/server/app/Application/Chat/ChatGoRuntimeConfig.php
          php -l testrepo/.validation/asr-site-source/candidate/server/app/Application/Chat/ChatAsrOpenApiProbe.php
          php -l testrepo/.validation/asr-site-source/candidate/server/bin/chat-asr-diagnostic.php
          php -l testrepo/.validation/asr-site-source/candidate/server/api/index.php
          python3 testrepo/.validation/asr-site-source/contract.py
          php testrepo/.validation/asr-site-source/probe_test.php
      - name: Exact mirror implementation test
        run: |
          set -euo pipefail
          ROOT="$PWD/testrepo/.validation/asr-site-source/mirror-module"
          mkdir -p "$ROOT/internal/imagepipeline" "$ROOT/internal/message" "$ROOT/internal/sourceprobe"
          cp testrepo/.validation/asr-site-source/candidate/chat/internal/imagepipeline/local_asr_mirror.go "$ROOT/internal/imagepipeline/local_asr_mirror.go"
          cp testrepo/.validation/asr-site-source/stub_message.go "$ROOT/internal/message/stub.go"
          cp testrepo/.validation/asr-site-source/stub_probe.go "$ROOT/internal/sourceprobe/probe.go"
          cp testrepo/.validation/asr-site-source/stub_qiniu.go "$ROOT/internal/imagepipeline/qiniu_stub.go"
          cp testrepo/.validation/asr-site-source/mirror_test.go "$ROOT/internal/imagepipeline/local_asr_mirror_test.go"
          printf 'module github.com/franz-9527/workers/chat\n\ngo 1.23\n' > "$ROOT/go.mod"
          cd "$ROOT"
          go test ./internal/imagepipeline -run ASRMirror -count=1
