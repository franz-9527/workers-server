name: Temporary ASR source URL preflight
on:
  push:
    branches: [main]
    paths:
      - '.validation/asr-source/**'
      - '.github/workflows/temporary-asr-source.yml'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: '.validation/asr-source/chat/go.mod'
          cache: false
      - name: Validate Go source and test bounded external URL fetch
        run: |
          cd .validation/asr-source/chat
          gofmt -w internal/sourceprobe/probe.go internal/sourceprobe/probe_test.go internal/imagepipeline/qiniu_av.go
          test -z "$(gofmt -l internal/sourceprobe/probe.go internal/sourceprobe/probe_test.go internal/imagepipeline/qiniu_av.go)"
          go test -race -count=1 ./internal/sourceprobe ./internal/imagepipeline
          go vet ./internal/sourceprobe ./internal/imagepipeline
          grep -F 'sourceprobe.VerifyMP3(ctx, q.client, providerURL)' internal/imagepipeline/qiniu_av.go
      - name: Validate mini-program and backend
        run: |
          node --check .validation/asr-source/miniprogram/subpackages/chat/conversation/av.js
          php -l .validation/asr-source/server/views/admin/chat-settings.php
          grep -F CHAT_AV_ASR_SOURCE_UNREACHABLE .validation/asr-source/server/views/admin/chat-settings.php
          grep -F CHAT_AV_ASR_SOURCE_INVALID_MP3 .validation/asr-source/miniprogram/subpackages/chat/conversation/av.js
