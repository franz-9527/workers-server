name: Temporary AV source syntax regression
on:
  push:
    branches: [main]
    paths:
      - '.validation/av-syntax/**'
      - '.github/workflows/temporary-av-syntax.yml'
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Parse with gofmt
        run: |
          test -z "$(gofmt -l .validation/av-syntax/chat/internal/moderation/av.go)"
      - name: Corruption and helper contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.validation/av-syntax/chat/internal/moderation/av.go').read_text()
          assert s.count('package moderation') == 1
          assert '96}package moderation' not in s
          assert s.count('func validAudioInspectionURL') == 1
          assert s.count('func safeASRDiagnosticText') == 1
          assert s.count('func providerErrorFromData') == 1
          assert 'json:"errmsg"' in s
          assert 'ProviderMessage = safeASRDiagnosticText(response.Message)' in s
          print('AV moderation source parses and diagnostic helpers are intact')
          PY
