name: Temporary call-state regression
on:
  push:
    branches: [main]
    paths:
      - 'qa-chat-production/chat/**'
      - 'qa-chat-production/server/views/admin/chat-calls.php'
      - 'qa-chat-production/CALL_STATE_SOURCE_SHA'
      - 'qa-chat-production/CALL_STATE_MANIFEST'
      - '.github/workflows/temporary-call-state.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: temporary-call-state-${{ github.ref }}
  cancel-in-progress: true
jobs:
  call-state:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:5.7.44
        env:
          MYSQL_ROOT_PASSWORD: fixture
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pfixture"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: qa-chat-production/chat/go.mod
          cache-dependency-path: qa-chat-production/chat/go.sum
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.36'
          extensions: pdo_mysql,sodium,mbstring,curl,gd
          coverage: none
      - name: Verify exact server snapshot
        shell: bash
        run: |
          set -euo pipefail
          sha=$(tr -d '\r\n' < qa-chat-production/CALL_STATE_SOURCE_SHA)
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          while read -r expected path; do
            [[ "$expected" =~ ^[a-f0-9]{40}$ && -n "$path" ]]
            actual=$(git hash-object "$path")
            [[ "$actual" == "$expected" ]] || { echo "SNAPSHOT_MISMATCH $path $actual $expected"; exit 2; }
          done < qa-chat-production/CALL_STATE_MANIFEST
          echo "Testing Go/PHP server snapshot for workers source SHA $sha"
          go version
          php -v | head -n 1
      - name: Check Go formatting
        shell: bash
        run: |
          set -euo pipefail
          files=(
            qa-chat-production/chat/internal/calls/authority.go
            qa-chat-production/chat/internal/calls/lifecycle.go
            qa-chat-production/chat/internal/calls/mysql_integration_test.go
            qa-chat-production/chat/internal/calls/realtime_test.go
            qa-chat-production/chat/internal/calls/service.go
            qa-chat-production/chat/internal/calls/worker.go
            qa-chat-production/chat/internal/dependencies/messaging.go
            qa-chat-production/chat/internal/ports/contracts.go
            qa-chat-production/chat/internal/socket/gateway_test.go
            qa-chat-production/chat/internal/socket/realtime.go
          )
          diff=$(gofmt -d "${files[@]}")
          if [[ -n "$diff" ]]; then
            printf '%s\n' "$diff"
            echo 'GOFMT_REQUIRED'
            exit 1
          fi
          echo 'Go formatting passed'
      - name: PHP admin view syntax
        run: php -l qa-chat-production/server/views/admin/chat-calls.php
      - name: Go race and MySQL integration suite
        working-directory: qa-chat-production/chat
        env:
          CHAT_INTEGRATION: '1'
          CHAT_AUTH_TEST_PHP: /usr/bin/php
          CHAT_INTEGRATION_REDIS_ADDR: 127.0.0.1:6379
          CHAT_AUTH_TEST_REDIS_ADDRESS: 127.0.0.1:6379
          CHAT_INTEGRATION_MYSQL_ADDR: 127.0.0.1:3306
          CHAT_INTEGRATION_ADMIN_PASSWORD: fixture
          CHAT_AUTH_TEST_MYSQL_USER_HOST: '%'
          CHAT_CALLS_MYSQL_ADDR: 127.0.0.1:3306
          CHAT_CALLS_MYSQL_PASSWORD: fixture
          CHAT_CALLS_TEST_PHP: /usr/bin/php
          CHAT_CALLS_SCHEMA_FILE: ${{ github.workspace }}/qa-chat-production/server/database/upgrades/2.7.0.sql
        run: go test -race ./...
