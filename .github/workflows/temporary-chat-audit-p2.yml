name: Temporary chat audit P2 validation
on:
  push:
    paths:
      - '.validation/chat-audit-p2/**'
      - '.github/workflows/temporary-chat-audit-p2.yml'
permissions:
  contents: read
concurrency:
  group: temporary-chat-audit-p2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: Install nginx
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx
      - name: Go formatting
        working-directory: .validation/chat-audit-p2
        run: |
          files="$(find internal -type f -name '*.go' | sort)"
          unformatted="$(gofmt -l $files)"
          printf '%s\n' "$unformatted"
          test -z "$unformatted"
      - name: Socket tests
        working-directory: .validation/chat-audit-p2
        run: go test ./internal/socket -count=1
      - name: Nginx config
        run: .validation/chat-audit-p2/check-nginx.sh
