name: temporary chat avatar vectorize
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-chat-avatar-fetch.yml'
permissions:
  contents: write
jobs:
  vectorize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download source PNG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .validation/avatar
          curl -fL --retry 3 --connect-timeout 15 --max-time 60 'https://776f-worker-real-1301382302.tcb.qcloud.la/public/%E5%9D%90%E6%A0%87.png' -o .validation/avatar/source.png
          test "$(file -b --mime-type .validation/avatar/source.png)" = "image/png"
      - name: Vectorize and add background
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet vtracer cairosvg
          python3 -c "import vtracer; vtracer.convert_image_to_svg_py('.validation/avatar/source.png','.validation/avatar/raw.svg',colormode='color',hierarchical='stacked',mode='spline',filter_speckle=4,color_precision=8,layer_difference=16,corner_threshold=60,length_threshold=4.0,max_iterations=10,splice_threshold=45,path_precision=8)"
          python3 <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          import cairosvg
          raw = Path('.validation/avatar/raw.svg').read_text()
          m = re.search(r'<svg\b[^>]*>', raw)
          assert m, 'missing svg root'
          body = raw[m.end():]
          body = body.rsplit('</svg>', 1)[0]
          svg = (
              '<?xml version="1.0" encoding="UTF-8"?>\n'
              '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 300 300">'
              '<rect x="0" y="0" width="300" height="300" rx="56" fill="#e8f2ff"/>'
              + body +
              '</svg>\n'
          )
          assert '<image' not in svg and 'data:image' not in svg
          assert svg.count('<path') >= 10
          ET.fromstring(svg)
          Path('.validation/avatar/traced.svg').write_text(svg)
          cairosvg.svg2png(bytestring=svg.encode(), write_to='.validation/avatar/preview.png', output_width=300, output_height=300)
          PY
          file .validation/avatar/preview.png
          test "$(file -b --mime-type .validation/avatar/preview.png)" = "image/png"
          base64 -w0 .validation/avatar/preview.png > .validation/avatar/preview.png.b64
          printf 'source=300x300 RGBA PNG\nbackground=#e8f2ff rounded rx=56\noutput=pure SVG paths\n' > .validation/avatar/meta.txt
          rm .validation/avatar/source.png .validation/avatar/raw.svg .validation/avatar/preview.png
      - name: Commit temporary vector output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f .validation/avatar/traced.svg .validation/avatar/preview.png.b64 .validation/avatar/meta.txt
          git commit -m 'test(chat): stage vectorized default avatar'
          git push
