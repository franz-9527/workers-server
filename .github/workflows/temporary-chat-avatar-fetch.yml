name: temporary chat avatar vectorize
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-chat-avatar-fetch.yml'
permissions:
  contents: write
jobs:
  vectorize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download source PNG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .validation/avatar
          curl -fL --retry 3 --connect-timeout 15 --max-time 60 'https://776f-worker-real-1301382302.tcb.qcloud.la/public/%E5%9D%90%E6%A0%87.png' -o .validation/avatar/source.png
          test "$(file -b --mime-type .validation/avatar/source.png)" = "image/png"
      - name: Vectorize and add original avatar background
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet vtracer
          python3 -c "import vtracer; vtracer.convert_image_to_svg_py('.validation/avatar/source.png','.validation/avatar/traced.svg',colormode='color',hierarchical='stacked',mode='spline',filter_speckle=4,color_precision=8,layer_difference=16,corner_threshold=60,length_threshold=4.0,max_iterations=10,splice_threshold=45,path_precision=8)"
          python3 -c "from pathlib import Path; p=Path('.validation/avatar/traced.svg'); s=p.read_text(); i=s.find('>')+1; s=s[:i]+'<rect x="0" y="0" width="300" height="300" rx="56" fill="#e8f2ff"/>'+s[i:]; s=s.replace('width="300" height="300"','width="64" height="64"',1); p.write_text(s)"
          grep -q '<rect x="0" y="0" width="300" height="300" rx="56" fill="#e8f2ff"/>' .validation/avatar/traced.svg
          ! grep -Eq '<image|data:image' .validation/avatar/traced.svg
          grep -q '<path' .validation/avatar/traced.svg
          printf 'source=300x300 RGBA PNG\nbackground=#e8f2ff rounded rx=56\noutput=pure SVG paths\n' > .validation/avatar/meta.txt
          rm .validation/avatar/source.png
      - name: Commit temporary vector output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f .validation/avatar/traced.svg .validation/avatar/meta.txt
          git commit -m 'test(chat): stage vectorized default avatar'
          git push
