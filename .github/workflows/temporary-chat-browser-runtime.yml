name: Temporary chat recovery and browser runtime
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-chat-browser-runtime.yml'
      - '.validation/chat-runtime/**'
permissions:
  contents: read
concurrency:
  group: temporary-chat-browser-runtime
  cancel-in-progress: true
jobs:
  browser-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .validation/chat-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frozen source blobs
        run: |
          set -euo pipefail
          test "$(cat SOURCE_SHA)" = 'd238019f55991a4e5f91ff4f536f5773d10a10a7'
          while read -r expected path; do
            test "$(git hash-object "$path")" = "$expected"
            echo "verified $path $expected"
          done < SOURCE_MANIFEST
          node --version
      - name: Isolated text recovery and title fixture
        run: |
          set -euo pipefail
          node --check miniprogram/utils/ChatManager.js
          node --test recovery.test.js
      - name: Build public browser runtime
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts esbuild@0.25.12 spark-md5@3.0.2
          ./node_modules/.bin/esbuild --version
          ./node_modules/.bin/esbuild server/assets/chat-testing-client.js --bundle --platform=browser --format=iife --target=es2020 --outfile=server/assets/chat-testing-runtime.js
          node --check server/assets/chat-testing-runtime.js
          grep -q 'canAutoRetryText' server/assets/chat-testing-runtime.js
          grep -q 'textProbeEligible' server/assets/chat-testing-runtime.js
          echo "BUNDLE_GIT_SHA=$(git hash-object server/assets/chat-testing-runtime.js)"
          sha256sum server/assets/chat-testing-runtime.js
          wc -c server/assets/chat-testing-runtime.js
          base64 -w 12000 server/assets/chat-testing-runtime.js | sed 's/^/BUNDLE64:/'
      - uses: actions/upload-artifact@v4
        with:
          name: chat-browser-runtime
          path: .validation/chat-runtime/server/assets/chat-testing-runtime.js
          retention-days: 7
          if-no-files-found: error
