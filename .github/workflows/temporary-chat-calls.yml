name: Temporary complete call validation
on:
  push:
    branches: [main]
    paths: ['.validation/**', '.github/workflows/temporary-chat-calls.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: temporary-chat-calls-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:5.7.44
        env:
          MYSQL_ROOT_PASSWORD: calls-fixture-only
          MYSQL_ROOT_HOST: '%'
        ports: ['3306/tcp']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pcalls-fixture-only"
          --health-interval=5s --health-timeout=3s --health-retries=30
    env:
      GOTOOLCHAIN: local
      CHAT_CALLS_MYSQL_PASSWORD: calls-fixture-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .validation/src/chat/go.mod
          cache: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.36'
          extensions: pdo_mysql,mbstring,sodium
          coverage: none
      - name: Isolated service endpoint
        env:
          MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
        run: echo "CHAT_CALLS_MYSQL_ADDR=127.0.0.1:$MYSQL_PORT" >> "$GITHUB_ENV"
      - name: Verify snapshot
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('.validation/src')
          manifest=json.loads(pathlib.Path('.validation/manifest.json').read_text())
          for name,expected in manifest['files'].items():
              data=(root/name).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==expected,name
          print('Verified',len(manifest['files']),'candidate source blobs from',manifest['base_commit'])
          PY
      - name: PHP syntax and resource contract
        run: |
          set -euo pipefail
          php -r 'if(PHP_VERSION!=="8.3.36")exit(1);echo PHP_VERSION."\n";'
          find .validation/src/server -name '*.php' -print0 | xargs -0 -n1 php -l
          php .validation/src/server/tests/chat_call_resource_contract.php
          echo "CHAT_CALLS_TEST_PHP=$(command -v php)" >> "$GITHUB_ENV"
          echo "CHAT_CALLS_SCHEMA_FILE=$(realpath .validation/src/calls.sql)" >> "$GITHUB_ENV"
      - name: Build unreleased SQL manifest
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('.validation/src')
          p=root/'server/database/upgrades/manifest.json'
          m=json.loads(p.read_text())
          old={"server/database/database.sql":"612a80f914172b595c83931139c68b1dc9412893","server/database/upgrades/2.7.0.sql":"a1daa57594c3c0e57cf608a65599b04f6693b438"}
          for name,expected in old.items():
              d=(root/name).read_bytes().split(b'\n-- CHAT_BEGIN calls\n')[0]
              assert hashlib.sha1(b'blob '+str(len(d)).encode()+b'\0'+d).hexdigest()==expected,name
          m['install_checksum']=hashlib.sha256((root/'server/database/database.sql').read_bytes()).hexdigest()
          for row in m['upgrades']:
              actual=hashlib.sha256((root/'server/database/upgrades'/row['file']).read_bytes()).hexdigest()
              if row['version']=='2.7.0':
                  row['checksum']=actual
              else: assert actual==row['checksum'],row['version']
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          print('Historical SQL unchanged; install and unreleased 2.7.0 checksums generated')
          PY
      - name: Install and immutable 2.6.0 migration
        if: success() || failure()
        run: CHAT_AUTH_TEST_INTEGRATION=1 CHAT_INTEGRATION_MYSQL_ADDR="$CHAT_CALLS_MYSQL_ADDR" CHAT_INTEGRATION_ADMIN_PASSWORD="$CHAT_CALLS_MYSQL_PASSWORD" php .validation/src/server/tests/chat_schema_contract.php
      - name: PHP transactional integration
        if: success() || failure()
        run: CHAT_CALLS_SCHEMA_FILE="$PWD/.validation/src/calls.sql" php .validation/src/server/tests/chat_calls_mysql_contract.php
      - name: Download pinned official miniapp SDK
        run: |
          set -euo pipefail
          mkdir -p .validation/npm
          cd .validation/npm
          npm pack --ignore-scripts --silent agora-miniapp-sdk@2.6.5
          tar -xzf agora-miniapp-sdk-2.6.5.tgz
          node -e 'const p=require("./package/package.json");if(p.version!=="2.6.5")process.exit(1);console.log("SDK",p.name,p.version,p.main)'
          sha256sum agora-miniapp-sdk-2.6.5.tgz
          cmp package/build/agora-miniapp-sdk.js ../../src/miniprogram/subpackages/chat/call/vendor/agora-miniapp-sdk.js
          cmp package/build/agora-miniapp-sdk.js.LICENSE.txt ../../src/miniprogram/subpackages/chat/call/vendor/agora-miniapp-sdk.js.LICENSE.txt
      - name: Build and all Go unit race tests
        if: success() || failure()
        working-directory: .validation/src/chat
        run: |
          set -euo pipefail
          gofmt -w internal/calls/authority.go internal/calls/service.go internal/agoratoken/rtctokenbuilder2/rtctokenbuilder.go internal/agoratoken/accesstoken2/accesstoken.go internal/agoratoken/accesstoken2/util.go internal/calls/lifecycle.go internal/calls/worker.go internal/calls/providers.go internal/calls/http.go internal/dependencies/calls.go internal/dependencies/runtime.go internal/dependencies/socket.go internal/bootstrap/app.go internal/bootstrap/server.go internal/bootstrap/config.go internal/dependencies/mysql.go internal/calls/confirmation.go internal/calls/mysql_integration_test.go internal/calls/http_test.go
          go build ./...
          go vet ./...
          go test -race -count=1 ./...
      - name: Frontend syntax
        if: success() || failure()
        run: |
          set -euo pipefail
          find .validation/src/miniprogram -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Frontend behavior regressions
        if: success() || failure()
        run: |
          node --test .validation/src/tools/test_chat_calls.js
          node .validation/src/tools/test_chat_s11.js
      - name: Record tested sources
        if: always()
        run: |
          python3 - <<'PY'
          import json,pathlib,hashlib,base64
          root=pathlib.Path('.validation/src')
          files={p:(root/p).read_text() for p in ["chat/internal/calls/authority.go","chat/internal/calls/service.go","chat/internal/agoratoken/rtctokenbuilder2/rtctokenbuilder.go","chat/internal/agoratoken/accesstoken2/accesstoken.go","chat/internal/agoratoken/accesstoken2/util.go","chat/internal/calls/lifecycle.go","chat/internal/calls/worker.go","chat/internal/calls/providers.go","chat/internal/calls/http.go","chat/internal/dependencies/calls.go","chat/internal/dependencies/runtime.go","chat/internal/dependencies/socket.go","chat/internal/bootstrap/app.go","chat/internal/bootstrap/server.go","chat/internal/bootstrap/config.go","chat/internal/dependencies/mysql.go","chat/internal/calls/confirmation.go","chat/internal/calls/mysql_integration_test.go","chat/internal/calls/http_test.go","server/database/upgrades/manifest.json"]}
          encoded=base64.b64encode(json.dumps(files,separators=(',',':')).encode()).decode()
          chunks=[encoded[i:i+5000] for i in range(0,len(encoded),5000)]
          for i,c in enumerate(chunks):print('FORMATTED_B64',i,len(chunks),c)
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  d=p.read_bytes()
                  print('TESTED_BLOB',p.relative_to(root),hashlib.sha1(b'blob '+str(len(d)).encode()+b'\0'+d).hexdigest())
          package=pathlib.Path('.validation/npm/package')
          if (package/'package.json').exists():
              meta=json.loads((package/'package.json').read_text())
              print('SDK_META',json.dumps(meta,separators=(',',':')))
          PY
      - name: Verify snapshot cleanup plan
        if: success() || failure()
        run: |
          git rm -r --cached .validation .github/workflows/temporary-chat-calls.yml >/dev/null
          python3 tools/check-clean-state.py
          git diff --cached --check
