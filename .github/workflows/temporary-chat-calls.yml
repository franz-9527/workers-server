name: Temporary complete call validation
on:
  push:
    branches: [main]
    paths: ['.validation/**', '.github/workflows/temporary-chat-calls.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: temporary-chat-calls-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:5.7.44
        env:
          MYSQL_ROOT_PASSWORD: calls-fixture-only
          MYSQL_ROOT_HOST: '%'
        ports: ['3306/tcp']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pcalls-fixture-only"
          --health-interval=5s --health-timeout=3s --health-retries=30
    env:
      GOTOOLCHAIN: local
      CHAT_CALLS_MYSQL_PASSWORD: calls-fixture-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .validation/src/chat/go.mod
          cache: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.36'
          extensions: pdo_mysql,mbstring,sodium
          coverage: none
      - name: Isolated service endpoint
        env:
          MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
        run: echo "CHAT_CALLS_MYSQL_ADDR=127.0.0.1:$MYSQL_PORT" >> "$GITHUB_ENV"
      - name: Verify snapshot
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('.validation/src')
          manifest=json.loads(pathlib.Path('.validation/manifest.json').read_text())
          for name,expected in manifest['files'].items():
              data=(root/name).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==expected,name
          print('Verified',len(manifest['files']),'candidate source blobs from',manifest['base_commit'])
          PY
      - name: PHP syntax and resource contract
        run: |
          set -euo pipefail
          php -r 'if(PHP_VERSION!=="8.3.36")exit(1);echo PHP_VERSION."\n";'
          find .validation/src/server -name '*.php' -print0 | xargs -0 -n1 php -l
          php .validation/src/server/tests/chat_call_resource_contract.php
          echo "CHAT_CALLS_TEST_PHP=$(command -v php)" >> "$GITHUB_ENV"
          echo "CHAT_CALLS_SCHEMA_FILE=$(realpath .validation/src/calls.sql)" >> "$GITHUB_ENV"
      - name: PHP transactional integration
        run: CHAT_CALLS_SCHEMA_FILE="$PWD/.validation/src/calls.sql" php .validation/src/server/tests/chat_calls_mysql_contract.php
      - name: Download pinned official miniapp SDK
        run: |
          set -euo pipefail
          mkdir -p .validation/npm
          cd .validation/npm
          npm pack --ignore-scripts --silent agora-miniapp-sdk@2.6.5
          tar -xzf agora-miniapp-sdk-2.6.5.tgz
          node -e 'const p=require("./package/package.json");if(p.version!=="2.6.5")process.exit(1);console.log("SDK",p.name,p.version,p.main)'
          find package -maxdepth 3 -type f
      - name: Build and all Go unit race tests
        working-directory: .validation/src/chat
        run: |
          set -euo pipefail
          gofmt -w internal/calls/authority.go internal/calls/service.go internal/agoratoken/rtctokenbuilder2/rtctokenbuilder.go internal/agoratoken/accesstoken2/accesstoken.go internal/agoratoken/accesstoken2/util.go internal/calls/lifecycle.go internal/calls/worker.go internal/calls/providers.go internal/calls/http.go internal/dependencies/calls.go internal/dependencies/runtime.go internal/dependencies/socket.go internal/bootstrap/app.go internal/bootstrap/server.go internal/bootstrap/config.go internal/dependencies/mysql.go internal/calls/confirmation.go internal/calls/mysql_integration_test.go
          go build ./...
          go vet ./...
          go test -race -count=1 ./...
      - name: Frontend syntax
        run: |
          set -euo pipefail
          find .validation/src/miniprogram -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Frontend behavior regressions
        run: |
          node --test .validation/src/tools/test_chat_calls.js
          node .validation/src/tools/test_chat_s11.js
      - name: Record tested sources
        if: always()
        run: |
          python3 - <<'PY'
          import json,pathlib,hashlib,base64
          root=pathlib.Path('.validation/src')
          files={p:(root/p).read_text() for p in ["chat/internal/calls/authority.go","chat/internal/calls/service.go","chat/internal/agoratoken/rtctokenbuilder2/rtctokenbuilder.go","chat/internal/agoratoken/accesstoken2/accesstoken.go","chat/internal/agoratoken/accesstoken2/util.go","chat/internal/calls/lifecycle.go","chat/internal/calls/worker.go","chat/internal/calls/providers.go","chat/internal/calls/http.go","chat/internal/dependencies/calls.go","chat/internal/dependencies/runtime.go","chat/internal/dependencies/socket.go","chat/internal/bootstrap/app.go","chat/internal/bootstrap/server.go","chat/internal/bootstrap/config.go","chat/internal/dependencies/mysql.go","chat/internal/calls/confirmation.go","chat/internal/calls/mysql_integration_test.go"]}
          encoded=base64.b64encode(json.dumps(files,separators=(',',':')).encode()).decode()
          chunks=[encoded[i:i+5000] for i in range(0,len(encoded),5000)]
          for i,c in enumerate(chunks):print('FORMATTED_B64',i,len(chunks),c)
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  d=p.read_bytes()
                  print('TESTED_BLOB',p.relative_to(root),hashlib.sha1(b'blob '+str(len(d)).encode()+b'\0'+d).hexdigest())
          package=pathlib.Path('.validation/npm/package')
          if (package/'package.json').exists():
              meta=json.loads((package/'package.json').read_text())
              print('SDK_META',json.dumps(meta,separators=(',',':')))
              licenses={str(p.relative_to(package)):p.read_text(errors='strict') for p in package.rglob('*') if p.is_file() and ('LICENSE' in p.name.upper() or p.name.endswith('.js'))}
              encoded=json.dumps(licenses,separators=(',',':'))
              chunks=[encoded[i:i+5000] for i in range(0,len(encoded),5000)]
              for i,c in enumerate(chunks):print('SDK_CHUNK',i,len(chunks),c)
          PY
