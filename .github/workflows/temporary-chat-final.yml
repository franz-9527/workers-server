name: Temporary final chat context regression
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-chat-final.yml', '.validation/chat-final/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: temporary-chat-final
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: .validation/chat-final
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact source
        run: |
          set -euo pipefail
          test "$(cat SOURCE_SHA)" = '37221900006b5d1c1cc4a5e6af128586ff87a727'
          while read -r expected path; do
            test "$(git hash-object "$path")" = "$expected"
            echo "verified $path $expected"
          done < SOURCE_MANIFEST
          node --version
      - name: Full isolated client context and message contracts
        run: |
          set -euo pipefail
          find miniprogram server tools -name '*.js' -print0 | xargs -0 -n1 node --check
          node --test tools/test_chat_s11.js tools/test_chat_direct_inbox_merge.js
