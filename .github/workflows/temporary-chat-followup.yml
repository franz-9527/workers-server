name: Temporary chat followup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-chat-followup.yml', '.validation/chat-followup/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: temporary-chat-followup
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .validation/chat-followup
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frozen source and historical fixture
        run: |
          set -euo pipefail
          test "$(cat SOURCE_SHA)" = '83f1b03fb58653a6242475c1d837a6269f5e281e'
          while read -r expected path; do
            test "$(git hash-object "$path")" = "$expected"
            echo "verified $path $expected"
          done < SOURCE_MANIFEST
          test "$(git hash-object recovery.test.js)" = 'a3a686648252c7ae0f9d29d837b4d4a3c4fe1ac9'
      - name: Chat JavaScript regression
        run: |
          set -euo pipefail
          node --version
          find miniprogram tools -name '*.js' -print0 | xargs -0 -n1 node --check
          node --test recovery.test.js tools/test_chat_image_archive.js tools/test_chat_conversation_input.js tools/test_chat_lifecycle_regression.js tools/test_chat_voice_limit.js
      - name: PHP 8.3.36 region contract (no network requests)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/app:ro" -w /app php:8.3.36-cli sh -ec 'php -r "if(PHP_VERSION!==\"8.3.36\" || !extension_loaded(\"mbstring\")) exit(1); echo PHP_VERSION.PHP_EOL;"; php -l server/app/Infrastructure/External/TencentMapIpLocator.php; php tools/test_chat_ip_region.php'
