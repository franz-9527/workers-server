name: Temporary chat health snapshot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-chat-health-snapshot.yml'
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read test-site chat health
        run: |
          set -euo pipefail
          BODY=$(curl --silent --show-error --fail --max-time 15 'https://test.20m.cc/api/?route=health')
          echo "$BODY" | jq -c '{version,chat_go}'
