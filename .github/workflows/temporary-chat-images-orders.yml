name: Temporary chat image and order conversation verification
on:
  push:
    branches: [main]
    paths:
      - '.validation/chat-images-orders-50b9674a/**'
      - '.github/workflows/temporary-chat-images-orders.yml'
permissions:
  contents: read
concurrency:
  group: temporary-chat-images-orders-
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Runtime versions
        run: |
          node --version
          php --version | head -n 1
          python3 --version
      - name: JavaScript syntax
        run: |
          for file in .validation/chat-images-orders-50b9674a/fixtures/*.js; do node --check "$file"; done
          node --check .validation/chat-images-orders-50b9674a/check.js
      - name: PHP syntax
        run: php -l .validation/chat-images-orders-50b9674a/fixtures/OrderDetailFullView.php
      - name: Source SHA and presentation contracts
        run: python3 .validation/chat-images-orders-50b9674a/check.py
      - name: Isolated JavaScript behavior checks
        run: node .validation/chat-images-orders-50b9674a/check.js
