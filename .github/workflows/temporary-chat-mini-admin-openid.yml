name: temporary chat mini admin OpenID validation

on:
  push:
    branches: [main]
    paths:
      - '.validation/**'
      - '.github/workflows/temporary-chat-mini-admin-openid.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: temporary-chat-mini-admin-openid-main
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify source marker
        run: grep -q 'source_sha=5600816c3cd57bf64700e4e04c0c1811cfafcb1d' .validation/SOURCE.txt
      - name: PHP 8.3.36 syntax
        id: syntax
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/work" -w /work php:8.3.36-cli php -l .validation/source/server/app/Infrastructure/Persistence/DatabaseChatPlatformStaff.php
          docker run --rm -v "$PWD:/work" -w /work php:8.3.36-cli php -l .validation/source/server/app/Application/Chat/ChatSandbox.php
          docker run --rm -v "$PWD:/work" -w /work php:8.3.36-cli php -l .validation/source/server/views/admin/chat-testing.php
          docker run --rm -v "$PWD:/work" -w /work php:8.3.36-cli php -l .validation/tests/chat_mini_admin_openid_contract.php
      - name: Mini admin OpenID display contract
        id: contract
        continue-on-error: true
        run: docker run --rm -v "$PWD:/work" -w /work php:8.3.36-cli php .validation/tests/chat_mini_admin_openid_contract.php
      - name: Publish commit statuses
        if: always()
        uses: actions/github-script@v7
        env:
          SYNTAX_STATUS: ${{ steps.syntax.outcome }}
          CONTRACT_STATUS: ${{ steps.contract.outcome }}
        with:
          script: |
            const checks = {
              'chat-mini-admin-openid/php-syntax': process.env.SYNTAX_STATUS,
              'chat-mini-admin-openid/contract': process.env.CONTRACT_STATUS
            }
            let failed = false
            for (const [name, outcome] of Object.entries(checks)) {
              const state = outcome === 'success' ? 'success' : 'failure'
              if (state !== 'success') failed = true
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
                state, context: name, description: outcome === 'success' ? 'passed' : 'failed'
              })
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: failed ? 'failure' : 'success',
              context: 'chat-mini-admin-openid/validation',
              description: failed ? 'mini admin OpenID validation failed' : 'mini admin OpenID validation passed'
            })
            if (failed) core.setFailed('mini admin OpenID validation failed')
