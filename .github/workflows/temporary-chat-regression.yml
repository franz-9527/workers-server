name: Temporary unified chat regression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-chat-regression.yml'
      - '.validation/chat-regression/**'
permissions:
  contents: read
concurrency:
  group: temporary-chat-regression
  cancel-in-progress: true
jobs:
  client-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .validation/chat-regression
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frozen source
        id: verify
        run: |
          set -euo pipefail
          test "$(cat SOURCE_SHA)" = 'dc997bb4c4f3c369cb9708f976daa9809bd6f971'
          cat SOURCE_MANIFEST SOURCE_MANIFEST_UI | while read -r sha path; do
            test "$(git hash-object "$path")" = "$sha"
            echo "verified $path"
          done
          node --version
      - name: Install pinned mini program compiler
        run: |
          npm install --no-save --package-lock=false --ignore-scripts miniprogram-compiler@0.2.3
          node -p "require('miniprogram-compiler/package.json').version"
      - name: Compile the three changed WXML templates
        id: wxml
        run: |
          node tools/check-wxml.js --self-test
          node tools/check-wxml.js --compile
      - name: Compile the three changed WXSS pages and shared stylesheet
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: |
          node <<'JS'
          const fs=require('node:fs'),path=require('node:path'),compiler=require('miniprogram-compiler')
          const root=path.resolve('miniprogram')
          const sheets=['pages/chatMessages/index.wxss','subpackages/chat/conversation/index.wxss','subpackages/chat/direct/index.wxss','style/chat-native.wxss']
          for(const file of sheets)if(!fs.existsSync(path.join(root,file)))throw Error(file)
          const result=compiler.wxssToJs(root,{maxBuffer:32*1024*1024})
          if(typeof result!=='string'||!result.trim())throw Error('empty WXSS compiler result')
          console.log('WXSS compile OK: '+sheets.join(', ')+'; output chars='+result.length)
          JS
