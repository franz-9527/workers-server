name: Temporary chat runtime fixes
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'miniprogram/**'
      - 'tools/test_chat_voice_heard.js'
      - 'tools/test_chat_conversation_input.js'
      - '.github/workflows/temporary-chat-runtime-fixes.yml'
permissions:
  contents: read
concurrency:
  group: temporary-chat-runtime-fixes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Runtime versions
        run: |
          php -v
          node -v
      - name: Syntax
        run: |
          php -l server/app/Domain/Chat/CallResourcePolicy.php
          php -l server/app/Domain/Chat/CallVerificationBootstrap.php
          php -l server/app/Domain/Chat/CallQuotaDisplay.php
          php -l server/views/admin/chat-calls.php
          php -l server/views/admin/chat-settings.php
          node --check miniprogram/subpackages/chat/conversation/av.js
          node --check miniprogram/subpackages/chat/conversation/index.js
      - name: Resource and admin contracts
        run: |
          php server/tests/chat_call_resource_contract.php
          php server/tests/chat_call_verification_bootstrap.php
          php server/tests/chat_call_usage_optional_contract.php
          php server/tests/chat_settings_safety_contract.php
          php server/tests/chat_calls_admin_form_contract.php
          php server/tests/chat_call_enablement_contract.php
      - name: Mini program regressions
        run: |
          node tools/test_chat_voice_heard.js
          node tools/test_chat_conversation_input.js
