name: temporary chat testing call availability validation

on:
  push:
    branches: [main]
    paths:
      - '.validation/**'
      - '.github/workflows/temporary-chat-testing-call-availability.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: temporary-chat-testing-call-availability-main
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify source marker
        run: grep -q 'source_sha=5600816c3cd57bf64700e4e04c0c1811cfafcb1d' .validation/SOURCE.txt
      - name: Syntax
        id: syntax
        continue-on-error: true
        run: |
          node --check .validation/source/server/assets/chat-testing-client.js
          node --check .validation/source/server/assets/chat-testing-runtime.js
          php -l .validation/source/server/views/admin/chat-testing.php
          node --check .validation/tests/chat_testing_call_availability_contract.js
      - name: Call availability contract
        id: contract
        continue-on-error: true
        run: node .validation/tests/chat_testing_call_availability_contract.js
      - name: Publish commit statuses
        if: always()
        uses: actions/github-script@v7
        env:
          SYNTAX_STATUS: ${{ steps.syntax.outcome }}
          CONTRACT_STATUS: ${{ steps.contract.outcome }}
        with:
          script: |
            const checks = {
              'chat-testing-calls/syntax': process.env.SYNTAX_STATUS,
              'chat-testing-calls/contract': process.env.CONTRACT_STATUS
            }
            let failed = false
            for (const [name, outcome] of Object.entries(checks)) {
              const state = outcome === 'success' ? 'success' : 'failure'
              if (state !== 'success') failed = true
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
                state, context: name, description: outcome === 'success' ? 'passed' : 'failed'
              })
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: failed ? 'failure' : 'success',
              context: 'chat-testing-calls/validation',
              description: failed ? 'test call validation failed' : 'test call validation passed'
            })
            if (failed) core.setFailed('test call validation failed')
