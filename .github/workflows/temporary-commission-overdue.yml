name: temporary commission overdue notification validation

on:
  push:
    branches: [main]
    paths:
      - '.validation/**'
      - '.github/workflows/temporary-commission-overdue.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: temporary-commission-overdue-main
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify source marker
        run: grep -q 'source_sha=2626d108d38e13ae65158342b0a26a1274ce29d8' .validation/SOURCE.txt
      - name: PHP 8.3.36 syntax
        id: syntax
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/work" -w /work php:8.3.36-cli php -l .validation/source/server/app/Domain/Messaging/OrderProgressMessageCatalog.php
          docker run --rm -v "$PWD:/work" -w /work php:8.3.36-cli php -l .validation/source/server/app/Domain/Messaging/MessageEventCatalog.php
          docker run --rm -v "$PWD:/work" -w /work php:8.3.36-cli php -l .validation/source/server/app/Services/SchedulerService.php
          docker run --rm -v "$PWD:/work" -w /work php:8.3.36-cli php -l .validation/tests/commission_overdue_contract.php
      - name: Overdue notification contract
        id: contract
        continue-on-error: true
        run: docker run --rm -v "$PWD:/work" -w /work php:8.3.36-cli php .validation/tests/commission_overdue_contract.php
      - name: Publish commit statuses
        if: always()
        uses: actions/github-script@v7
        env:
          SYNTAX_STATUS: ${{ steps.syntax.outcome }}
          CONTRACT_STATUS: ${{ steps.contract.outcome }}
        with:
          script: |
            const checks = {
              'overdue-notification/php-syntax': process.env.SYNTAX_STATUS,
              'overdue-notification/contract': process.env.CONTRACT_STATUS
            }
            let failed = false
            for (const [name, outcome] of Object.entries(checks)) {
              const state = outcome === 'success' ? 'success' : 'failure'
              if (state !== 'success') failed = true
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
                state, context: name, description: outcome === 'success' ? 'passed' : 'failed'
              })
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: failed ? 'failure' : 'success',
              context: 'overdue-notification/validation',
              description: failed ? 'overdue notification validation failed' : 'overdue notification validation passed'
            })
            if (failed) core.setFailed('overdue notification validation failed')
