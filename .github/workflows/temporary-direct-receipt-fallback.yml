name: temporary direct receipt fallback validation
on:
  push:
    branches: [main]
    paths:
      - '.validation/**'
      - '.github/workflows/temporary-direct-receipt-fallback.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Go formatting
        run: |
          gofmt -d .validation/source/chat/internal/message/unread.go > /tmp/gofmt.diff
          test ! -s /tmp/gofmt.diff || (cat /tmp/gofmt.diff && false)
      - name: JavaScript syntax
        run: node --check .validation/source/miniprogram/utils/ChatManager.js
      - name: Direct receipt fallback contract
        run: node .validation/tests/direct_receipt_fallback.js
