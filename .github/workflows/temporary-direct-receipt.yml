name: temporary direct receipt validation
on:
  push:
    branches: [main]
    paths:
      - '.validation/**'
      - '.github/workflows/temporary-direct-receipt.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Go syntax and formatting
        run: |
          set -e
          for f in \
            .validation/source/chat/internal/message/history.go \
            .validation/source/chat/internal/message/collaboration.go \
            .validation/source/chat/internal/message/unread.go \
            .validation/source/chat/internal/message/read_progress.go \
            .validation/source/chat/internal/socket/realtime.go \
            .validation/source/chat/internal/dependencies/socket.go; do
            gofmt -d "$f" > /tmp/gofmt.diff
            if [ -s /tmp/gofmt.diff ]; then cat /tmp/gofmt.diff; exit 1; fi
          done
      - name: JavaScript syntax
        run: |
          node --check .validation/source/miniprogram/utils/ChatManager.js
          node --check .validation/source/miniprogram/subpackages/chat/conversation/experience.js
          node --check .validation/source/miniprogram/subpackages/chat/conversation/index.js
          node --check .validation/source/miniprogram/subpackages/chat/conversation/group.js
          node --check .validation/tests/direct_receipt_behavior.js
          node --check .validation/tests/direct_receipt_contract.js
      - name: PHP syntax
        run: |
          php -l .validation/source/server/app/Application/Chat/ChatSimulation.php
          php -l .validation/source/server/app/Application/Chat/ChatSandbox.php
      - name: Direct receipt behavior
        run: node .validation/tests/direct_receipt_behavior.js
      - name: Direct receipt protocol contract
        run: node .validation/tests/direct_receipt_contract.js
