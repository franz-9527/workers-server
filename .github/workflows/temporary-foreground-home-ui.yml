name: temporary-foreground-home-ui-regression
on:
  push:
    branches: [main]
    paths:
      - '.validation/foreground-home-ui/**'
      - '.github/workflows/temporary-foreground-home-ui.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node .validation/foreground-home-ui/test.js
