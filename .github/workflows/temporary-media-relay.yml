name: Temporary WeChat callback relay acceptance
on:
  push:
    paths:
      - .github/workflows/temporary-media-relay.yml
      - chat/**
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:5.7.44
        env:
          MYSQL_ROOT_PASSWORD: relay-fixture-only
          MYSQL_ROOT_HOST: '%'
        ports: ['3306/tcp']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 --silent" --health-interval=5s --health-timeout=4s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: chat/go.mod
          cache-dependency-path: chat/go.sum
      - name: PHP configuration and template regression
        run: |
          php -l .validation/ChatGoRuntimeConfig.php
          php -l .validation/chat-settings.php
          php .validation/relay-config.php
      - name: Go format and suite
        working-directory: chat
        run: |
          test -z "$(gofmt -l $(cat ../.validation/go-files.txt))"
          go test ./...
      - name: MySQL 5.7 independent trace ownership
        env:
          DB_ID: ${{ job.services.mysql.id }}
          DB_PORT: ${{ job.services.mysql.ports[3306] }}
        working-directory: chat
        run: |
          docker exec -e MYSQL_PWD=relay-fixture-only "$DB_ID" mysql -uroot -e 'CREATE DATABASE relay_formal; CREATE DATABASE relay_test;'
          export CHAT_MEDIA_RELAY_PROD_DSN="root:relay-fixture-only@tcp(127.0.0.1:$DB_PORT)/relay_formal"
          export CHAT_MEDIA_RELAY_TEST_DSN="root:relay-fixture-only@tcp(127.0.0.1:$DB_PORT)/relay_test"
          go test -count=1 -v ./internal/message -run '^TestMySQLMediaRelayOnlyStoresLocalTrace$'
      - name: Actual Go public callback to signed internal delivery
        run: python3 .validation/relay-process.py
