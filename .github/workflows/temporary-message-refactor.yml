name: temporary message refactor validation

on:
  push:
    branches: [main]
    paths:
      - '.validation/**'
      - '.github/workflows/temporary-message-refactor.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: temporary-message-refactor-main
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify source marker
        run: |
          cat .validation/SOURCE.txt
          grep -q 'source_sha=435b9989a0b5a556ac9b025e8b0178ae50b5ab07' .validation/SOURCE.txt

      - name: PHP 8.3.36 syntax
        id: php
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/work" -w /work php:8.3.36-cli sh -lc 'find .validation/source/server -name "*.php" -print0 | xargs -0 -n1 php -l'
          docker run --rm -v "$PWD:/work" -w /work php:8.3.36-cli php -l .validation/tests/message_subscription_contract.php

      - name: Message subscription behavior
        id: behavior
        continue-on-error: true
        run: docker run --rm -v "$PWD:/work" -w /work php:8.3.36-cli php .validation/tests/message_subscription_contract.php

      - name: Mini program subscription client
        id: client
        continue-on-error: true
        run: |
          node --check .validation/source/miniprogram/utils/SubscribeMessageUtils.js
          node .validation/tests/message_subscription_client.js

      - name: Static notification coverage
        id: static
        continue-on-error: true
        run: python3 .validation/tests/message_refactor_static.py

      - name: Publish validation commit statuses
        if: always()
        uses: actions/github-script@v7
        env:
          PHP_STATUS: ${{ steps.php.outcome }}
          BEHAVIOR_STATUS: ${{ steps.behavior.outcome }}
          CLIENT_STATUS: ${{ steps.client.outcome }}
          STATIC_STATUS: ${{ steps.static.outcome }}
        with:
          script: |
            const checks = {
              'message-refactor/php-syntax': process.env.PHP_STATUS,
              'message-refactor/php-behavior': process.env.BEHAVIOR_STATUS,
              'message-refactor/client': process.env.CLIENT_STATUS,
              'message-refactor/static': process.env.STATIC_STATUS
            }
            let failed = false
            for (const [name, outcome] of Object.entries(checks)) {
              const state = outcome === 'success' ? 'success' : 'failure'
              if (state !== 'success') failed = true
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state,
                context: name,
                description: outcome === 'success' ? 'passed' : 'failed'
              })
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: failed ? 'failure' : 'success',
              context: 'message-refactor/validation',
              description: failed ? 'one or more validation checks failed' : 'all message refactor checks passed'
            })
            if (failed) core.setFailed('message refactor validation failed')
