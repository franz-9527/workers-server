name: temporary mini-program call frontend validation
on:
  push:
    branches: [main]
    paths:
      - '.validation/**'
      - '.github/workflows/temporary-mini-call-frontend.yml'
permissions:
  contents: read
  statuses: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify source marker
        run: grep -q 'source_sha=8d0a9e40787f35414eea25e5bf4f5d4eae4b1282' .validation/SOURCE.txt
      - name: JavaScript syntax
        id: syntax
        continue-on-error: true
        run: |
          node --check .validation/source/miniprogram/utils/ChatCalls.js
          node --check .validation/source/miniprogram/subpackages/chat/conversation/calls.js
          node --check .validation/source/miniprogram/subpackages/chat/conversation/index.js
          node --check .validation/source/miniprogram/subpackages/chat/call/index.js
          node --check .validation/source/server/assets/chat-testing-runtime.js
          node --check .validation/tests/mini_call_frontend.js
      - name: Frontend call contract
        id: contract
        continue-on-error: true
        run: node .validation/tests/mini_call_frontend.js
      - name: Publish statuses
        if: always()
        uses: actions/github-script@v7
        env:
          SYNTAX_STATUS: ${{ steps.syntax.outcome }}
          CONTRACT_STATUS: ${{ steps.contract.outcome }}
        with:
          script: |
            const checks={'mini-call/syntax':process.env.SYNTAX_STATUS,'mini-call/contract':process.env.CONTRACT_STATUS}
            let failed=false
            for(const [context,outcome] of Object.entries(checks)){
              const state=outcome==='success'?'success':'failure'
              if(state!=='success')failed=true
              await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context,description:state==='success'?'passed':'failed'})
            }
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:failed?'failure':'success',context:'mini-call/validation',description:failed?'mini call frontend validation failed':'mini call frontend validation passed'})
            if(failed)core.setFailed('mini call frontend validation failed')
