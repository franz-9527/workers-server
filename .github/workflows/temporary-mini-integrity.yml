name: Temporary mini module gate self-tests
on:
  push:
    branches: [main]
    paths: ['.validation/**', '.github/workflows/temporary-mini-integrity.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: temporary-mini-integrity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate isolated generic gate utilities
        shell: bash
        run: |
          set -euo pipefail
          echo 'Source SHA: 30d6df704c6ee392dd36911b02cf1d3938eed10e'
          node --version
          npm install --prefix "$RUNNER_TEMP/mini-check" --no-audit --no-fund acorn@8.15.0
          export NODE_PATH="$RUNNER_TEMP/mini-check/node_modules"
          cd .validation
          for file in tools/*.js; do node --check "$file"; done
          node tools/check-miniprogram-main-js-ownership.js --self-test
          node tools/check-miniprogram-compiled-integrity.js --self-test
          node -e 'const fs=require("node:fs");fs.mkdirSync("miniprogram/sub/a",{recursive:true});fs.writeFileSync("project.config.json",JSON.stringify({setting:{uglifyFileName:false,ignoreUploadUnusedFiles:false,ignoreDevUnusedFiles:false}}));fs.writeFileSync("miniprogram/app.json",JSON.stringify({pages:[],subpackages:[{root:"sub/a",pages:["index"]}]}));for(const e of ["js","json","wxml","wxss"])fs.writeFileSync("miniprogram/sub/a/index."+e,e==="json"?"{}":"");fs.writeFileSync("miniprogram/sub/a/index.js","const x = require(\u0027./data\u0027)");fs.writeFileSync("miniprogram/sub/a/data.json","{}")'
          node tools/check-miniprogram-package-boundaries.js
          echo 'require("./missing")' >> miniprogram/sub/a/index.js
          if node tools/check-miniprogram-package-boundaries.js > "$RUNNER_TEMP/mini-negative.log" 2>&1; then echo 'Missing module was not blocked'; exit 1; fi
          grep -F 'missing ./missing' "$RUNNER_TEMP/mini-negative.log"
