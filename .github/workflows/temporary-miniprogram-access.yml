name: Temporary miniprogram source access check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-miniprogram-access.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: temporary-miniprogram-access-${{ github.ref }}
  cancel-in-progress: true
jobs:
  access:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check exact candidate access without transferring source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ff91f209c6ecf8c25aceaca3eacd0da6e7b0a4ac
        shell: bash
        run: |
          set -euo pipefail
          echo "source_sha=$SOURCE_SHA"
          echo "test_sha=$GITHUB_SHA"
          echo "runner=$RUNNER_OS"
          code=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' -I -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/franz-9527/workers/commits/$SOURCE_SHA")
          echo "cross_repository_http_status=$code"
          if [ "$code" != 200 ]; then
            echo "::error::Cross-repository access not confirmed; no source transferred"
            exit 1
          fi
          echo "Candidate accessible to test repository token; no source transferred"
