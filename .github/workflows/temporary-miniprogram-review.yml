name: Temporary package and SQL focused review
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-miniprogram-review.yml']
permissions:
  contents: read
concurrency:
  group: temporary-miniprogram-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:5.7.44
        env:
          MYSQL_ROOT_PASSWORD: fixture-only
        options: --health-cmd="mysqladmin ping -pfixture-only" --health-interval=5s --health-timeout=3s --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record source and verify minimal snapshots
        run: |
          echo 'source_sha=01c0f07be9374805c89ad82df570ca481aa82fe5'
          git rev-parse HEAD
          node --version
          test "$(git hash-object .validation/miniprogram-review/ownership.js)" = '3c7aaa126e7a8cd92b360a3e0d1199b1ad9b13ec'
          test "$(git hash-object .validation/miniprogram-review/app.json)" = 'ea7bb5e16bba36b22e3548cbfd475a35e8e7d2e9'
      - name: Main JS ownership checker synthetic self-test
        if: ${{ !cancelled() }}
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --prefix "$RUNNER_TEMP/audit" acorn@8.15.0
          NODE_PATH="$RUNNER_TEMP/audit/node_modules" node .validation/miniprogram-review/ownership.js --self-test
      - name: Actual app manifest focused checks
        if: ${{ !cancelled() }}
        run: |
          node <<'JS'
          const a=require('./.validation/miniprogram-review/app.json'),assert=require('node:assert/strict')
          assert.equal(a.lazyCodeLoading,'requiredComponents')
          assert.deepEqual(a.usingComponents||{},{})
          assert.equal(a.tabBar.list.length,4)
          assert.equal(a.plugins?.WechatSI,undefined)
          assert.equal(a.subpackages.find(x=>x.root==='subpackages/chat').plugins.WechatSI.version,'0.3.10')
          assert(!a.subpackages.find(x=>x.root==='subpackages/chat').pages.includes('call/index'))
          assert.deepEqual(a.preloadRule,{
            'pages/orderHall/orderHall':{network:'wifi',packages:['subpackages/order']},
            'pages/chatMessages/index':{network:'wifi',packages:['subpackages/chat']},
            'pages/mine/mine':{network:'wifi',packages:['subpackages/account']}
          })
          assert(a.subpackages.find(x=>x.root==='subpackages/order').pages.length===6)
          assert(a.subpackages.find(x=>x.root==='subpackages/admin').pages.length===7)
          const pages=[...a.pages,...a.subpackages.flatMap(p=>p.pages.map(x=>p.root+'/'+x))]
          assert.equal(pages.length,71)
          assert.equal(new Set(pages).size,pages.length)
          assert(!pages.some(p=>/^pages\/(orderCenter|constructionOrder|orderSubmit|userOrder|workerOrder|adminWorkbench|platformOrderShare)\//.test(p)))
          console.log('PASS focused app manifest checks; not full source dependency or compiler verification')
          JS
      - name: MySQL 5.7 exact unread predicate with synthetic fixtures
        if: ${{ !cancelled() }}
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          set -euo pipefail
          docker exec -e MYSQL_PWD=fixture-only "$MYSQL_CONTAINER" mysql -uroot -Nse 'SELECT VERSION()' | grep '^5\.7\.44'
          output="$(docker exec -i -e MYSQL_PWD=fixture-only "$MYSQL_CONTAINER" mysql -uroot -N -B < .validation/miniprogram-review/unread.sql)"
          printf '%s\n' "$output"
          expected="$(printf '%s\n' 'predicate=1,2,8,10' 'join=1,2,8,10' 'active_unread=3' 'later=2' 'unread_not_later=2')"
          test "$output" = "$expected"
          echo 'PASS exact predicate and join equivalence on focused fixture; full integration still required'
