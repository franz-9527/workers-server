name: Temporary moderation package build
on:
  push:
    branches: [main]
    paths:
      - '.validation/mod-build/**'
      - '.github/workflows/temporary-mod-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: '.validation/mod-build/chat/go.mod'
          cache: false
      - name: Build moderation package
        run: |
          cd .validation/mod-build/chat
          go mod verify
          go test ./internal/moderation
