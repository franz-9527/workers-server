name: Temporary onboarding notification acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-onboarding-notice.yml', '.validation/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: temporary-onboarding-notice-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:5.7.44
        env:
          MYSQL_ROOT_PASSWORD: test-only
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned source blobs
        run: |
          cat .validation/SOURCE_SHA
          git rev-parse HEAD
          while read -r expected path; do
            test "$(git hash-object "$path")" = "$expected" || { echo "Blob mismatch: $path"; exit 1; }
          done < .validation/SOURCE_MANIFEST
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.36'
          extensions: pdo_mysql, mbstring
          coverage: none
      - name: Exact PHP and isolated MySQL versions
        run: |
          php -v
          php -r 'exit(PHP_VERSION === "8.3.36" ? 0 : 2);'
          php -r '$p=new PDO("mysql:host=127.0.0.1;port=3306","root","test-only"); $v=$p->query("SELECT VERSION()")->fetchColumn(); echo $v,PHP_EOL; exit(str_starts_with($v,"5.7.44") ? 0 : 2);'
      - name: PHP syntax of selected source
        run: |
          find .validation/source -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Delivery failure and dispatcher policies
        if: ${{ !cancelled() }}
        run: |
          cd .validation/source
          php server/tests/v260_message_delivery_failure_policy.php
          php server/tests/v260_message_outbox_dispatch_policy.php
      - name: Onboarding outbox, receipt, quota, lock and review reconciliation MySQL
        if: ${{ !cancelled() }}
        env:
          ONBOARDING_NOTICE_MYSQL_TEST: '1'
          V250_DB_PORT: '3306'
        run: |
          cd .validation/source
          php server/tests/v260_onboarding_notice_mysql.php
      - name: Review list reconciliation with synthetic API
        if: ${{ !cancelled() }}
        run: |
          node --version
          cd .validation/source
          node tools/test_review_notice_reconciliation.js
