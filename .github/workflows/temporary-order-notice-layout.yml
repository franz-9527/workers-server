name: Temporary order notice layout validation

on:
  push:
    branches: [main]
    paths:
      - '.validation/order-notice-layout/**'
      - '.github/workflows/temporary-order-notice-layout.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-order-notice-layout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layout-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source snapshot
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .validation/order-notice-layout/SOURCE_SHA)" = "06d30b0782ddd5ee42767ed9ab2959cf4e879497"
          test -f .validation/order-notice-layout/miniprogram/pages/orderCenter/index.wxml
          test -f .validation/order-notice-layout/miniprogram/pages/constructionOrder/index.wxml
      - name: WXML ordering and WXSS spacing regression
        run: node .validation/order-notice-layout/check.js
