name: Temporary order role separation audit
on:
  push:
    branches: [main]
    paths:
      - '.validation/order-role-separation-20261108/**'
      - '.github/workflows/temporary-order-role-separation.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          node --check .validation/order-role-separation-20261108/fixtures/CustomerOrderBillingPresentation.js
          node --check .validation/order-role-separation-20261108/fixtures/OrderSupportPresentation.js
          node --check .validation/order-role-separation-20261108/fixtures/userOrder-detail.js
          node --check .validation/order-role-separation-20261108/fixtures/workerOrder-detail.js
          node --check .validation/order-role-separation-20261108/check.js
      - name: Role separation and billing regression
        run: node .validation/order-role-separation-20261108/check.js
