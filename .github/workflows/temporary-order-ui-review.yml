name: Temporary order UI review

on:
  push:
    branches: [main]
    paths:
      - '.validation/order-ui/**'
      - '.github/workflows/temporary-order-ui-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-order-ui-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  order-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pinned WXML compiler
        run: npm install --no-save --package-lock=false --no-audit --no-fund miniprogram-compiler@0.2.3
      - name: JavaScript syntax
        run: |
          node --check .validation/order-ui/miniprogram/pages/userOrder/detail.js
          node --check .validation/order-ui/miniprogram/utils/CustomerOrderBillingPresentation.js
          node --check .validation/order-ui/miniprogram/utils/OrderSupportPresentation.js
          node --check .validation/order-ui/miniprogram/pages/orderSubmit/index.js
          node --check .validation/order-ui/miniprogram/utils/OrderApi.js
          node --check .validation/order-ui/miniprogram/subpackages/support/agreements/index.js
          node --check .validation/order-ui/miniprogram/pages/applogin/applogin.js
          node --check .validation/order-ui/miniprogram/subpackages/account/workerProfile/index.js
          node --check .validation/order-ui/tools/check-wxml.js
          node --check .validation/order-ui/tools/test-order-ui-regression.js
      - name: WXML expression and compile check
        run: node .validation/order-ui/tools/check-wxml.js .validation/order-ui/miniprogram --compile
      - name: WXML checker self-test
        run: node .validation/order-ui/tools/check-wxml.js --self-test
      - name: Order UI regression contracts
        run: node .validation/order-ui/tools/test-order-ui-regression.js
      - name: Verify cleanup procedure in isolated worktree
        if: always()
        run: |
          git rm -r --ignore-unmatch .validation/order-ui .github/workflows/temporary-order-ui-review.yml
          python3 - <<'PY'
          from pathlib import Path
          assert not Path('.validation/order-ui').exists()
          assert not Path('.github/workflows/temporary-order-ui-review.yml').exists()
          print('Temporary order UI snapshot cleanup verified.')
          PY
          git diff --cached --check
