name: Temporary participant identity verification
on:
  push:
    paths: ['.validation/participants/**', '.github/workflows/temporary-participants.yml']
permissions:
  contents: read
concurrency:
  group: temporary-participants-${{ github.ref }}
  cancel-in-progress: true
jobs:
  php-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:5.7.44
        env:
          MYSQL_ROOT_PASSWORD: participants-fixture-only
          MYSQL_ROOT_HOST: '%'
        ports: ['3306/tcp']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pparticipants-fixture-only"
          --health-interval=5s --health-timeout=3s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - name: Verify and materialize exact snapshot
        shell: python
        run: |
          import json,pathlib,hashlib
          snapshot=json.loads(pathlib.Path('.validation/participants/source.json').read_text())
          root=pathlib.Path('.validation/participants/worktree')
          for name,content in snapshot['files'].items():
              p=pathlib.PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts and p.parts[0]=='server'
              raw=content.encode()
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==snapshot['blob_shas'][name]
              destination=root/name
              destination.parent.mkdir(parents=True,exist_ok=True)
              destination.write_bytes(raw)
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.36'
          extensions: pdo_mysql,sodium,mbstring
          coverage: none
      - name: Syntax, original login authority and identity projection
        working-directory: .validation/participants/worktree
        env:
          CHAT_INTEGRATION_MYSQL_ADDR: 127.0.0.1:${{ job.services.mysql.ports['3306'] }}
          CHAT_INTEGRATION_ADMIN_PASSWORD: participants-fixture-only
        run: |
          find server -name '*.php' -print0 | xargs -0 -n1 php -l
          php server/tests/chat_identity_contract.php
          php server/tests/chat_participant_contract.php --mysql
      - name: Export exact tested source hashes
        if: always()
        working-directory: .validation/participants/worktree
        shell: python
        run: |
          import pathlib,hashlib,json
          for p in sorted(pathlib.Path('server').rglob('*.php')):
              raw=p.read_bytes()
              print('TESTED_BLOB '+json.dumps({'path':p.as_posix(),'sha':hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()}))
