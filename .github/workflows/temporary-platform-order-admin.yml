name: Temporary platform-order admin regression
on:
  push:
    paths:
      - '.validation/platform-order-admin/**'
      - '.github/workflows/temporary-platform-order-admin.yml'
permissions:
  contents: read
concurrency:
  group: temporary-platform-order-admin-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.36'
          coverage: none
      - name: Verify candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .validation/platform-order-admin/SOURCE_SHA)" = "0df514a7054b0444b16c6969e7597c4756216885"
          php -l .validation/platform-order-admin/source/PlatformOrderAdminModule.php
          php -l .validation/platform-order-admin/source/MeasurementAwarePlatformOrderAdminRepository.php
          php -l .validation/platform-order-admin/source/PlatformOrderAdminCreateSnapshot.php
          php -l .validation/platform-order-admin/source/v250_platform_order_smoke.php
          php -l .validation/platform-order-admin/generate.php
          php -l .validation/platform-order-admin/architecture-test.php
          php .validation/platform-order-admin/generate.php
          node --check .validation/platform-order-admin/generated.js
          node .validation/platform-order-admin/runtime-test.js .validation/platform-order-admin/generated.js
          php .validation/platform-order-admin/architecture-test.php
          printf '{"source_sha":"0df514a7054b0444b16c6969e7597c4756216885","php":"%s","node":"%s","result":"pass"}\n' "$(php -r 'echo PHP_VERSION;')" "$(node --version)" > .validation/platform-order-admin/evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: platform-order-admin-0df514a7054b0444b16c6969e7597c4756216885
          path: .validation/platform-order-admin/evidence.json
          if-no-files-found: error
          retention-days: 7
