name: Temporary plugin-first ASR live verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-plugin-first-asr-live.yml'
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for test-site chatd deployment
        env:
          TARGET_SHA: 18b8a6f2f17de42605805390d03f01be69c96e1b
        run: |
          set -euo pipefail
          URL='https://test.20m.cc/api/?route=health'
          for i in $(seq 1 96); do
            if BODY=$(curl --silent --show-error --fail --max-time 10 "$URL"); then
              if echo "$BODY" | jq -e . >/dev/null 2>&1; then
                echo "$BODY" | jq -c '{version,chat_go}'
                RUNNING=$(echo "$BODY" | jq -r '.chat_go.running_sha // ""')
                DEPLOYED=$(echo "$BODY" | jq -r '.chat_go.deployed_sha // ""')
                if [[ "$RUNNING" == "$TARGET_SHA" && "$DEPLOYED" == "$TARGET_SHA" ]]; then
                  echo 'PLUGIN_FIRST_ASR_DEPLOY_OK'
                  exit 0
                fi
              fi
            fi
            sleep 5
          done
          echo 'PLUGIN_FIRST_ASR_DEPLOY_NOT_READY'
          exit 1
