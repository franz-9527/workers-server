name: Temporary private source access check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-private-source-access.yml']
permissions:
  contents: read
jobs:
  access:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check cross-repository read permission without transferring source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/franz-9527/workers/git/commits/a2d5201f59e73d4d0d8713b67dd30b14b7eb00c7)
          echo "Candidate metadata HTTP status: $status"
          if [[ "$status" != 200 ]]; then echo "Full private source access unavailable to this token"; exit 1; fi
          echo "Metadata access only; no private source transferred"
