name: Temporary production Go rollout verification
on:
  push:
    paths:
      - .github/workflows/temporary-production-go.yml
      - chat/**
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: chat/go.mod
          cache-dependency-path: chat/go.sum
      - name: PHP and shell syntax
        run: |
          php -l .validation/chat-settings.php
          for script in chat/deploy/*.sh; do bash -n "$script"; done
      - name: Go formatting and regression
        working-directory: chat
        run: |
          test -z "$(gofmt -l internal/bootstrap/app.go internal/bootstrap/config.go internal/bootstrap/callback_verifier_test.go)"
          go test ./...
      - name: Real Linux deploy, run and callback handshake
        run: python3 .validation/production-rollout.py
