name: Temporary Qiniu AV object regression
on:
  push:
    branches: [main]
    paths:
      - '.validation/qiniu-av-object/**'
      - '.github/workflows/temporary-qiniu-av-object.yml'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          gofmt -d .validation/qiniu-av-object/chat/internal/imagepipeline/qiniu.go | tee /tmp/q1
          gofmt -d .validation/qiniu-av-object/chat/internal/imagepipeline/qiniu_av.go | tee /tmp/q2
          gofmt -d .validation/qiniu-av-object/chat/internal/message/av_worker.go | tee /tmp/q3
          test ! -s /tmp/q1 && test ! -s /tmp/q2 && test ! -s /tmp/q3
      - name: Formal object naming
        run: |
          python3 - <<'PY'
          from pathlib import Path
          q=Path('.validation/qiniu-av-object/chat/internal/imagepipeline/qiniu_av.go').read_text()
          w=Path('.validation/qiniu-av-object/chat/internal/message/av_worker.go').read_text()
          for x in ['main\\.(?:mp3|mp4)','poster\\.jpg','check-[01]\\.mp3','frame-[0-7]\\.jpg']:
              assert x in q, x
          for x in ['return "main.mp3", true','return "main.mp4", true','return "poster.jpg", true','return role + ".mp3", true','return role + ".jpg", true']:
              assert x in w, x
          assert 'key := prefix + hash + "/" + filename' in w
          print('formal AV object names are explicit')
          PY
      - name: Qiniu MIME contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          q=Path('.validation/qiniu-av-object/chat/internal/imagepipeline/qiniu_av.go').read_text()
          base=Path('.validation/qiniu-av-object/chat/internal/imagepipeline/qiniu.go').read_text()
          assert 'policy["detectMime"] = -1' in q
          assert 'policy["mimeLimit"] = mime' in q
          assert 'MIME string `json:"mimeType"`' in q
          assert 'mime != "audio/mpeg"' in q and 'mime != "video/mp4"' in q
          assert 'header.Set("Content-Type", mime)' in base
          assert 'media.mp3' in q and 'media.mp4' in q and 'media.jpg' in q
          assert 'strings.HasSuffix(key, ".jpg")' in q
          print('upload MIME is explicit and provider inspection validates stored MIME')
          PY
