name: Temporary release baseline guard
on:
  push:
    paths:
      - '.validation/release-baseline/**'
      - '.github/workflows/temporary-release-baseline.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact baseline and reject misleading branch
        shell: bash
        run: |
          set -euo pipefail
          FIX="$RUNNER_TEMP/release-fixture"; OUT="$RUNNER_TEMP/out"
          mkdir -p "$FIX"/{server/api,server/app/Support,server/database/upgrades,miniprogram/config,cloudfunctions}
          cp .validation/release-baseline/package-release.sh "$FIX/package-release.sh"
          cd "$FIX"
          git init -b main
          git config user.name release-test
          git config user.email release-test@example.invalid
          printf '2.6.0\n' > server/VERSION
          printf '<?php\n' > server/api/index.php
          printf '<?php\n' > server/app/Support/functions.php
          printf '{"upgrades":[]}\n' > server/database/upgrades/manifest.json
          printf 'SELECT 1;\n' > server/database/upgrades/2.6.0.sql
          printf '# upgrade\n' > server/UPGRADE.md
          cat > miniprogram/config/config.js <<'JS'
          const MINIPROGRAM_VERSION = '2.7.0'
          const API_VERSION = '2.7.0'
          JS
          printf 'App({})\n' > miniprogram/app.js
          printf '{}\n' > project.config.json
          printf '{}\n' > cloudbaserc.json
          printf 'exports.main=()=>({})\n' > cloudfunctions/index.js
          git add . && git commit -m base
          BASE_SHA="$(git rev-parse HEAD)"
          git branch release-base/2.6.0 "$BASE_SHA"
          printf '2.7.4\n' > server/VERSION
          printf 'SELECT 1;\n' > server/database/upgrades/2.7.4.sql
          git add . && git commit -m target
          bash ./package-release.sh release-base/2.6.0 "$OUT"
          grep -Fxq "base_version=2.6.0" "$OUT/RELEASE-VERSIONS.txt"
          grep -Fxq "base_commit=$BASE_SHA" "$OUT/RELEASE-VERSIONS.txt"
          git branch -f dev/2.6.0 HEAD
          if bash ./package-release.sh dev/2.6.0 "$RUNNER_TEMP/bad" >"$RUNNER_TEMP/bad.log" 2>&1; then
            echo "misleading dev/2.6.0 unexpectedly accepted" >&2
            exit 1
          fi
          grep -Fq 'server/VERSION=2.7.4' "$RUNNER_TEMP/bad.log"
          grep -Fq '声明基线 2.6.0 不一致' "$RUNNER_TEMP/bad.log"
