name: Temporary global exception acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-runtime-acceptance.yml', '.validation/runtime/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: temporary-runtime-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:5.7.44
        env:
          MYSQL_ROOT_PASSWORD: fixture-only
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: runtime_fixture
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pfixture-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned source blobs
        run: |
          cat .validation/runtime/SOURCE_SHA
          git rev-parse HEAD
          cat .validation/runtime/MANIFEST_USER .validation/runtime/MANIFEST_LOG | while read -r expected path; do
            test "$(git hash-object "$path")" = "$expected" || { echo "Blob mismatch: $path"; exit 1; }
          done
      - name: Build PHP 8.3.36
        run: |
          docker build -t runtime-php:8.3.36 - <<'DOCKERFILE'
          FROM php:8.3.36-cli
          RUN docker-php-ext-install pdo_mysql
          RUN php -r 'exit(PHP_VERSION === "8.3.36" && extension_loaded("pdo_mysql") && extension_loaded("mbstring") ? 0 : 2);'
          DOCKERFILE
      - name: Selected PHP syntax
        run: |
          docker run --rm -v "$PWD/.validation/runtime/:/work:ro" -w /work runtime-php:8.3.36 sh -ec 'php -v; find . -name "*.php" -print0 | xargs -0 -n1 php -l'
      - name: Real user search schema and native PDO
        if: ${{ !cancelled() }}
        run: docker run --rm --network host -v "$PWD/.validation/runtime/:/work:ro" -w /work runtime-php:8.3.36 php user-search.php
      - name: Runtime logging contract
        if: ${{ !cancelled() }}
        run: docker run --rm -v "$PWD/.validation/runtime/:/work:ro" -w /work runtime-php:8.3.36 php source/server/tests/v260_runtime_log_maintenance_contract.php
      - name: Disabled readlink and partial HTTP probe
        if: ${{ !cancelled() }}
        run: docker run --rm -v "$PWD/.validation/runtime/:/work:ro" -w /work runtime-php:8.3.36 php -d disable_functions=readlink,stream_set_timeout disabled.php
