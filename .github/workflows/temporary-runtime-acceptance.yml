name: Temporary global exception acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-runtime-acceptance.yml', '.validation/runtime/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: temporary-runtime-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  http-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned source blobs
        run: |
          cat .validation/runtime/SOURCE_SHA
          git rev-parse HEAD
          cat .validation/runtime/MANIFEST_USER .validation/runtime/MANIFEST_LOG .validation/runtime/MANIFEST_HTTP | while read -r expected path; do
            test "$(git hash-object "$path")" = "$expected" || { echo "Blob mismatch: $path"; exit 1; }
          done
      - name: Build PHP 8.3.36
        run: |
          docker build -t runtime-php:8.3.36 - <<'DOCKERFILE'
          FROM php:8.3.36-cli
          RUN php -r 'exit(PHP_VERSION === "8.3.36" ? 0 : 2);'
          DOCKERFILE
      - name: Syntax of entry points and kernels
        run: |
          docker run --rm -v "$PWD/.validation/runtime/:/work:ro" -w /work runtime-php:8.3.36 sh -ec 'php -v; cut -d" " -f2 MANIFEST_HTTP | sed "s@^.validation/runtime/@@" | xargs -n1 php -l'
      - name: HTTP startup errors, callback protocol, log failure and session guards
        run: python3 .validation/runtime/http-acceptance.py
      - name: Obsolete PHP 7.4 controlled CLI rejection
        if: ${{ !cancelled() }}
        run: |
          set +e
          output=$(docker run --rm -v "$PWD/.validation/runtime/source/server:/work:ro" php:7.4.33-cli php /work/bootstrap.php 2>&1)
          status=$?
          set -e
          echo "$output"
          test "$status" = 1
          grep -q PHP_RUNTIME_UNSUPPORTED <<< "$output"
