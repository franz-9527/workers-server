name: temporary-runtime-log-review
on:
  push:
    branches: [main]
    paths: ['.validation/**', '.github/workflows/temporary-runtime-log-review.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: temporary-runtime-log-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime-log-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.36'
          extensions: mbstring
          coverage: none
      - name: Verify PHP 8.3.36 and syntax
        run: |
          php -r 'if(PHP_VERSION!=="8.3.36") exit(1); echo PHP_VERSION,PHP_EOL;'
          find .validation/project/server -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Runtime log cleanup, locking and redaction
        run: php .validation/project/server/tests/v260_runtime_log_maintenance_contract.php
