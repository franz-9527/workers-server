name: Temporary S18-S20 service verification
on:
  push:
    paths: ['.github/workflows/temporary-s18-s20.yml', '.validation/s18-s20/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: temporary-s18-s20-${{ github.ref }}
  cancel-in-progress: true
jobs:
  service-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:5.7.44
        env:
          MYSQL_ROOT_PASSWORD: s14-fixture-only
          MYSQL_ROOT_HOST: '%'
        ports: ['3306/tcp']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ps14-fixture-only"
          --health-interval=5s --health-timeout=3s --health-retries=30
      redis:
        image: redis:7.0.15
        ports: ['6379/tcp']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      GOTOOLCHAIN: local
      CHAT_AUTH_TEST_INTEGRATION: '1'
      CHAT_IMAGE_HELPER_TEST: '1'
      CHAT_AUTH_TEST_MYSQL_USER_HOST: '%'
      CHAT_INTEGRATION_ADMIN_PASSWORD: s14-fixture-only
      MESSAGING_MIGRATION_MYSQL_TEST: '1'
      V250_DB_HOST: 127.0.0.1
      V250_DB_USER: root
      V250_DB_PASSWORD: s14-fixture-only
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact source snapshot and materialize isolated files
        id: source
        shell: python
        run: |
          import json,hashlib,pathlib,base64
          manifest=json.loads(''.join(p.read_text() for p in sorted(pathlib.Path('.validation/s18-s20').glob('source-*.part'))))
          root=pathlib.Path('.validation/s18-s20/worktree')
          for name,content in manifest['files'].items():
              path=pathlib.PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert path.parts[0] in ('chat','server','tools')
              data=base64.b64decode(content) if manifest.get('encodings',{}).get(name)=='base64' else content.encode()
              blob=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert blob==manifest['blob_shas'][name],name+' does not match source commit'
              target=root.joinpath(*path.parts);target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
          print('Verified source commit:',manifest['source_commit'],'files:',len(manifest['files']))
      - uses: actions/setup-go@v5
        with:
          go-version-file: .validation/s18-s20/worktree/chat/go.mod
          cache: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.36'
          extensions: pdo_mysql,sodium,ctype,mbstring,gd
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install hash-pinned local image libraries
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .validation/s18-s20/worktree/chat/helpers/images/requirements.lock
      - name: Set isolated endpoints and verify runtimes
        env:
          MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
          REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
        run: |
          php -r 'if (PHP_VERSION !== "8.3.36") exit(1); echo "PHP ".PHP_VERSION."\n";'
          go version
          echo "CHAT_INTEGRATION_MYSQL_ADDR=127.0.0.1:$MYSQL_PORT" >> "$GITHUB_ENV"
          echo "CHAT_INTEGRATION_REDIS_ADDR=127.0.0.1:$REDIS_PORT" >> "$GITHUB_ENV"
          echo "CHAT_AUTH_TEST_REDIS_ADDRESS=127.0.0.1:$REDIS_PORT" >> "$GITHUB_ENV"
          echo "V250_DB_PORT=$MYSQL_PORT" >> "$GITHUB_ENV"
          echo "CHAT_AUTH_TEST_PHP=$(command -v php)" >> "$GITHUB_ENV"
      - name: PHP syntax and complete install/upgrade regression
        working-directory: .validation/s18-s20/worktree
        run: |
          find server tools -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php server/tests/chat_schema_contract.php
          php server/tests/chat_identity_contract.php
          php server/tests/chat_reminder_contract.php
