name: temporary-scheduler-review
on:
  push:
    branches: [main]
    paths: ['.validation/**', '.github/workflows/temporary-scheduler-review.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: temporary-scheduler-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:5.7.44
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: worker_test }
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3.36', extensions: mbstring, pdo_mysql, coverage: none }
      - name: Verify PHP 8.3.36 and syntax
        run: |
          set -euo pipefail
          php -r 'if(PHP_VERSION!=="8.3.36") exit(1); echo PHP_VERSION,PHP_EOL;'
          find .validation/project/server -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Scheduler backoff and atomic retention regression
        env:
          V260_SCHEDULER_TASK_BACKOFF_MYSQL_TEST: '1'
          V250_DB_NAME: worker_test
          V250_DB_HOST: 127.0.0.1
          V250_DB_PORT: '3306'
          V250_DB_USER: root
          V250_DB_PASSWORD: root
        run: php .validation/project/server/tests/v260_scheduler_task_backoff_mysql.php
      - name: Chat policy retry cursor regression
        env:
          V260_CHAT_POLICY_REFRESH_TEST: '1'
          V250_DB_NAME: worker_test
          V250_DB_HOST: 127.0.0.1
          V250_DB_PORT: '3306'
          V250_DB_USER: root
          V250_DB_PASSWORD: root
        run: php .validation/project/server/tests/v260_chat_policy_refresh_backoff_mysql.php
      - name: Runtime log retention regression
        run: php .validation/project/server/tests/v260_runtime_log_maintenance_contract.php
