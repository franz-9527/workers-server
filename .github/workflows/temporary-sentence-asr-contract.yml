name: Temporary SentenceASR exact-contract regression
on:
  push:
    branches: [main]
    paths:
      - '.validation/sentence-asr-contract/**'
      - '.github/workflows/temporary-sentence-asr-contract.yml'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          gofmt -d .validation/sentence-asr-contract/chat/internal/ports/contracts.go | tee /tmp/1
          gofmt -d .validation/sentence-asr-contract/chat/internal/message/av_inspection.go | tee /tmp/2
          gofmt -d .validation/sentence-asr-contract/chat/internal/moderation/av.go | tee /tmp/3
          gofmt -d .validation/sentence-asr-contract/chat/internal/moderation/media_callback_test.go | tee /tmp/4
          test ! -s /tmp/1 && test ! -s /tmp/2 && test ! -s /tmp/3 && test ! -s /tmp/4
          php -l .validation/sentence-asr-contract/server/app/Application/Chat/ChatGoRuntimeConfig.php
          php -l .validation/sentence-asr-contract/server/views/admin/chat-settings.php
      - name: Exact request shape
        run: |
          python3 - <<'PY'
          from pathlib import Path
          mod=Path('.validation/sentence-asr-contract/chat/internal/moderation/av.go').read_text()
          msg=Path('.validation/sentence-asr-contract/chat/internal/message/av_inspection.go').read_text()
          php=Path('.validation/sentence-asr-contract/server/app/Application/Chat/ChatGoRuntimeConfig.php').read_text()
          call=mod.split('data := any(map[string]any{',1)[1].split('})',1)[0]
          for x in ['"Action": "SentenceRecognitionWX"','"EngSerViceType": "16k_zh"','"SourceType": 0','"VoiceFormat": "mp3"','"Url": url.QueryEscape(q.URL)','"UsrAudioKey": q.UserAudioKey']: assert x in call,x
          for x in ['Version','ProjectId','SubServiceType','"Data"','DataLen']: assert x not in call,x
          assert 'InspectionURL(ctx, segment.Key)' in msg
          assert 'Data: audio' not in msg
          assert "if($profile==='sentence_asr')$encoding='object';" in php
          assert "$asrEncoding=$asrProfile==='sentence_asr'?'object'" in php
          print('SentenceASR exact URL-mode contract passed')
          PY
      - name: URL encoding
        run: |
          cat >/tmp/urlencode.go <<'GO'
          package main
          import ("fmt"; "net/url")
          func main(){fmt.Print(url.QueryEscape("https://cdn.example.invalid/main.mp3?e=1&token=a:b"))}
          GO
          test "$(go run /tmp/urlencode.go)" = "https%3A%2F%2Fcdn.example.invalid%2Fmain.mp3%3Fe%3D1%26token%3Da%3Ab"
