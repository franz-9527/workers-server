name: Temporary low frequency subpackages
on:
  push:
    branches: [main]
    paths:
      - '.validation-small-features/**'
      - '.github/workflows/temporary-small-features.yml'
permissions:
  contents: read
concurrency:
  group: temporary-small-features
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.36'
          coverage: none
      - name: Identify exact source and syntax
        working-directory: .validation-small-features
        run: |
          cat source.json
          node --version
          find miniprogram -name '*.js' -print0 | while IFS= read -r -d '' file; do node --input-type=module --check < "$file" || exit 1; done
          find tools -name '*.js' -print0 | xargs -0 -n1 node --check
          php -l tools/test-mini-admin-worker-store-migration.php
      - name: Package routes, original behavior and finance entry
        working-directory: .validation-small-features
        env:
          SMALL_PACKAGE_BASELINE_DIR: .baseline
        run: node tools/test_low_frequency_subpackages.js
      - name: Existing onboarding subscription identity and environment regressions
        working-directory: .validation-small-features
        run: |
          node tools/test-realname-draft-page.js
          node tools/test_v260_onboarding_notice_compact_ui.js
          node tools/test_v250_invite_onboarding_resume.js
          node tools/test_v250_cancellation_risk_ui.js
          node tools/test_v250_api_environment.js
          node tools/test_store_subpackage.js

# Configured confirmation notice regression; source 810bb6f595cbedcb4d87b66b4c6647224af5e6b2
