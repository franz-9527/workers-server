name: Temporary store package validation
on:
  push:
    branches: [main]
    paths:
      - '.validation-store-package/**'
      - '.github/workflows/temporary-store-package.yml'
permissions:
  contents: read
concurrency:
  group: temporary-store-package
  cancel-in-progress: true
jobs:
  store:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Identify source and validate syntax
        working-directory: .validation-store-package
        run: |
          cat source.json
          node --version
          node --check tools/test_store_subpackage.js
          node --check miniprogram/subpackages/store/utils/CloudUtils.js
          node --input-type=module --check < miniprogram/subpackages/store/plus/plus.js
      - name: Store routing and actual upload handler regression
        working-directory: .validation-store-package
        run: node tools/test_store_subpackage.js

