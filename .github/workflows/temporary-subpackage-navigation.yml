name: Temporary direct subpackage navigation validation
on:
  push:
    branches: [main]
    paths:
      - '.validation-subpackage-navigation/**'
      - '.github/workflows/temporary-subpackage-navigation.yml'
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact source blobs
        working-directory: .validation-subpackage-navigation
        run: |
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),m=require('./source-manifest.json')
          for(const [p,sha]of Object.entries(m.files)){
            const b=fs.readFileSync(p)
            if(crypto.createHash('sha1').update(Buffer.from('blob '+b.length+'\0')).update(b).digest('hex')!==sha)throw Error('Source mismatch '+p)
          }
          console.log('Verified '+Object.keys(m.files).length+' source blobs',m.branches)
          NODE
      - name: Install pinned WXML compiler
        run: npm install --prefix "$RUNNER_TEMP/wxml-compiler" --no-save --no-audit --no-fund miniprogram-compiler@0.2.3
      - name: v260 direct navigation and existing feature regressions
        working-directory: .validation-subpackage-navigation/v260
        run: |
          find miniprogram tools -name '*.js' -print0 | xargs -0 -n1 node --check >/dev/null
          node tools/test_low_frequency_subpackages.js
          node tools/test_store_subpackage.js
          node tools/test_v250_invite_onboarding_resume.js
          node tools/test_v260_onboarding_notice_compact_ui.js
          node tools/test-realname-draft-page.js
          NODE_PATH="$RUNNER_TEMP/wxml-compiler/node_modules" node tools/check-wxml.js --compile
      - name: chat direct navigation and feature regressions
        if: success() || failure()
        working-directory: .validation-subpackage-navigation/chat
        run: |
          find miniprogram tools -name '*.js' -print0 | xargs -0 -n1 node --check >/dev/null
          node tools/test_low_frequency_subpackages.js
          node tools/test_store_subpackage.js
          node tools/test_v250_invite_onboarding_resume.js
          node tools/test_v260_onboarding_notice_compact_ui.js
          node tools/test-realname-draft-page.js
          node tools/test_chat_s11.js
          node tools/test_chat_s12_business_entry.js
          node tools/test_chat_s24.js
          node tools/test_chat_sms.js
          NODE_PATH="$RUNNER_TEMP/wxml-compiler/node_modules" node tools/check-wxml.js --compile
# Shared route resolver fixture included
