name: Temporary Tencent direct ASR validation
on:
  push:
    branches: [main]
    paths:
      - '.validation/tencent-asr-direct/**'
      - '.github/workflows/temporary-tencent-asr-direct.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: PHP and JSON syntax
        run: |
          set -euo pipefail
          ROOT=.validation/tencent-asr-direct/candidate
          php -l "$ROOT/server/app/Application/Chat/ChatGoRuntimeConfig.php"
          php -l "$ROOT/server/app/Application/Chat/ChatAsrSelfDiagnostic.php"
          php -l "$ROOT/server/app/Http/Admin/Modules/ChatSettingsAdminModule.php"
          php -l "$ROOT/server/views/admin/chat-settings.php"
          php -l "$ROOT/server/bin/chat-asr-diagnostic.php"
          node -e "JSON.parse(require('fs').readFileSync('$ROOT/chat/config.example.json','utf8'));JSON.parse(require('fs').readFileSync('$ROOT/miniprogram/app.json','utf8'))"
      - name: Go formatting
        run: |
          set -euo pipefail
          ROOT=.validation/tencent-asr-direct/candidate
          for f in             "$ROOT/chat/internal/moderation/av.go"             "$ROOT/chat/internal/moderation/tencent_asr.go"             "$ROOT/chat/internal/moderation/tencent_asr_test.go"             "$ROOT/chat/internal/moderation/media_callback_test.go"             "$ROOT/chat/internal/avpipeline/config.go"             "$ROOT/chat/internal/message/av_background_asr.go"; do
            test -z "$(gofmt -d "$f")" || { gofmt -d "$f"; exit 1; }
          done
      - name: Compile and test actual Tencent provider file
        run: |
          set -euo pipefail
          ROOT="$PWD/.validation/tencent-asr-direct/candidate"
          TMP="$(mktemp -d)"
          mkdir -p "$TMP/internal/moderation" "$TMP/internal/ports"
          cat > "$TMP/go.mod" <<'EOF'
          module github.com/franz-9527/workers/chat
          go 1.22
          EOF
          cp "$ROOT/chat/internal/moderation/tencent_asr.go" "$TMP/internal/moderation/"
          cp "$ROOT/chat/internal/moderation/tencent_asr_test.go" "$TMP/internal/moderation/"
          cat > "$TMP/internal/ports/contracts.go" <<'EOF'
          package ports
          import "errors"
          var ErrInvalid=errors.New("invalid")
          var ErrUnavailable=errors.New("unavailable")
          type AudioInspectionRequest struct{ URL string }
          type Transcription struct {
            Text,RequestID,AuthorityProof,ServiceID,APIName,Engine string
            ProviderCode,ProviderMessage,ProviderInnerCode string
            DataEncoding,InputHost string
            InputURLLength,EncodedURLLength int
            Dispatched,Known,Retryable bool
          }
          EOF
          cat > "$TMP/internal/moderation/stubs.go" <<'EOF'
          package moderation
          import (
            "encoding/json"
            "net/http"
            "regexp"
            "strings"
          )
          type AVConfig struct { APIName,DataEncoding,Provider,Engine,SecretID,SecretKey string }
          type HTTPClient interface{ Do(*http.Request)(*http.Response,error) }
          type AV struct{ c AVConfig; client HTTPClient }
          type binding struct{ proof string }
          type httpFunc func(*http.Request)(*http.Response,error)
          func(f httpFunc)Do(r *http.Request)(*http.Response,error){return f(r)}
          func avJSON(raw []byte,target any)bool{return json.Unmarshal(raw,target)==nil}
          var tracePattern=regexp.MustCompile("^[A-Za-z0-9_.:-]{1,128}$")
          func safeASRDiagnosticText(v string)string{return strings.TrimSpace(v)}
          type asrFailure string
          func(e asrFailure)Error()string{return string(e)}
          EOF
          (cd "$TMP" && go test ./internal/moderation -count=1)
      - name: Contract checks
        run: |
          set -euo pipefail
          python3 .validation/tencent-asr-direct/contract.py
