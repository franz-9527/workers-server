name: Temporary format Tencent ASR candidate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-tencent-asr-format.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Format candidate Go
        run: |
          set -euo pipefail
          ROOT=.validation/tencent-asr-direct/candidate
          gofmt -w             "$ROOT/chat/internal/moderation/av.go"             "$ROOT/chat/internal/moderation/tencent_asr.go"             "$ROOT/chat/internal/moderation/tencent_asr_test.go"             "$ROOT/chat/internal/moderation/media_callback_test.go"             "$ROOT/chat/internal/avpipeline/config.go"             "$ROOT/chat/internal/message/av_background_asr.go"
          if git diff --quiet; then
            echo FORMAT_ALREADY_CLEAN
            exit 0
          fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -f "$ROOT"
          git commit -m "test: gofmt Tencent ASR candidate"
          git push origin HEAD:main

# rerun after optional-ASR change

# rerun after repaired optional credential patch
