name: Temporary test-site health snapshot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-test-site-health-snapshot.yml'
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read health once
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --max-time 15 'https://test.20m.cc/api/?route=health' | jq -c '{version,build_sha,chat_go,asr_probe}'
