name: Temporary trigger upgrade recovery
on:
  push:
    branches: [main]
    paths:
      - '.validation/**'
      - '.github/workflows/temporary-trigger-upgrade.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: temporary-trigger-upgrade-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mysql57-binlog-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHAT_AUTH_TEST_INTEGRATION: '1'
      CHAT_UPGRADE_PERMISSION_TEST: '1'
      CHAT_INTEGRATION_ADMIN_PASSWORD: isolated-upgrade-only
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.36'
          extensions: pdo_mysql,mbstring,curl,openssl,fileinfo,gd,simplexml,ctype,sodium
          coverage: none
      - name: Verify exact source blobs and PHP
        working-directory: .validation
        run: |
          set -euo pipefail
          php -r 'if(PHP_VERSION!=="8.3.36")exit(1);echo "PHP ".PHP_VERSION."\n";'
          python3 - <<'PY'
          import json, subprocess
          m=json.load(open('source-blobs.json'))
          for path, expected in m['blobs'].items():
              actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
              assert actual==expected, path
          print("Verified",len(m['blobs']),"exact source blobs from",m['source_commit'])
          PY
          find server -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
      - name: Start isolated MySQL 5.7.44 with binary logging
        run: |
          set -euo pipefail
          container="upgrade-mysql-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "UPGRADE_MYSQL_CONTAINER=$container" >> "$GITHUB_ENV"
          docker run -d --name "$container" -e MYSQL_ROOT_PASSWORD=isolated-upgrade-only -e MYSQL_ROOT_HOST='%' -p 127.0.0.1::3306 mysql:5.7.44 --log-bin=mysql-bin --server-id=1 >/dev/null
          for n in $(seq 1 60); do
            if docker exec "$container" mysqladmin ping -h127.0.0.1 -pisolated-upgrade-only --silent >/dev/null 2>&1; then break; fi
            sleep 1
          done
          port="$(docker port "$container" 3306/tcp | head -n1 | awk -F: '{print $NF}')"
          echo "CHAT_INTEGRATION_MYSQL_ADDR=127.0.0.1:$port" >> "$GITHUB_ENV"
      - name: Checksums, historical compatibility and native upgrade recovery
        working-directory: .validation
        run: |
          set -euo pipefail
          php server/tests/upgrade_manifest_checksums_contract.php
          php server/tests/upgrade_historical_checksum_alias_contract.php
          php server/tests/chat_schema_contract.php
      - name: Remove isolated database container
        if: always()
        run: |
          if [ -n "${UPGRADE_MYSQL_CONTAINER:-}" ]; then docker rm -f "$UPGRADE_MYSQL_CONTAINER" >/dev/null; fi
