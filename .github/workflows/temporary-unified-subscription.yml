name: temporary unified subscription validation

on:
  push:
    branches: [main]
    paths:
      - '.validation/**'
      - '.github/workflows/temporary-unified-subscription.yml'

permissions:
  contents: read

concurrency:
  group: temporary-unified-subscription-main
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: PHP 8.3.36 syntax
        run: |
          for file in             .validation/source/server/app/Infrastructure/Messaging/OrderSubscriptionDefinitionOperations.php             .validation/source/server/app/Infrastructure/Messaging/SubscriptionCatalog.php             .validation/source/server/app/Infrastructure/Messaging/OrderSubscriptionQueue.php             .validation/source/server/app/Application/Messaging/SubscriptionTestData.php             .validation/source/server/app/Infrastructure/Messaging/ChatReminderTemplate.php             .validation/source/server/app/Application/Messaging/SubscriptionPreferences.php             .validation/source/server/app/Domain/Messaging/SettingsValuePolicy.php             .validation/source/server/app/Domain/Messaging/MessageEventCatalog.php             .validation/source/server/app/Domain/Messaging/WechatTemplateValue.php             .validation/source/server/views/admin/settings-subscription-editor.php             .validation/source/server/views/admin/settings.php; do
            docker run --rm -v "$PWD:/work" -w /work php:8.3.36-cli php -l "$file"
          done
      - name: JavaScript syntax
        run: node --check .validation/source/miniprogram/utils/SubscribeMessageUtils.js
      - name: Unified subscription behavior
        run: docker run --rm -v "$PWD:/work" -w /work php:8.3.36-cli php .validation/tests/unified_subscription_contract.php
      - name: Static safety and UI contracts
        run: python3 .validation/tests/unified_subscription_static.py
