name: Temporary voice nonblocking validation
on:
  push:
    branches: [main]
    paths:
      - '.validation/voice-nonblocking/**'
      - '.github/workflows/temporary-voice-nonblocking.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: fixture-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pfixture-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          path: testrepo
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Candidate syntax and client fallback
        run: |
          set -euo pipefail
          gofmt -w testrepo/.validation/voice-nonblocking/candidate/policy.go
          gofmt -w testrepo/.validation/voice-nonblocking/candidate/av_inspection.go
          gofmt -w testrepo/.validation/voice-nonblocking/candidate/av_worker.go
          gofmt -w testrepo/.validation/voice-nonblocking/candidate/av_publish.go
          gofmt -w testrepo/.validation/voice-nonblocking/candidate/av_integration_test.go
          test -z "$(gofmt -l testrepo/.validation/voice-nonblocking/candidate/*.go)"
          python3 testrepo/.validation/voice-nonblocking/state_contract.py
          node testrepo/.validation/voice-nonblocking/recorder_test.js
      - name: Policy regression
        working-directory: testrepo/.validation/voice-nonblocking
        run: |
          set -euo pipefail
          mkdir -p avfallback
          cp candidate/policy.go avfallback/policy.go
          go test -race -count=1 ./avfallback
      - name: MySQL 5.7 old-job recovery regression
        run: |
          set -euo pipefail
          python3 testrepo/.validation/voice-nonblocking/mysql_recovery.py
