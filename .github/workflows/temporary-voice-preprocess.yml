name: Temporary voice preprocessing regression
on:
  push:
    branches: [main]
    paths:
      - '.validation/voice-preprocess/**'
      - '.github/workflows/temporary-voice-preprocess.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          python3 -m py_compile .validation/voice-preprocess/chat/helpers/media/inspect.py .validation/voice-preprocess/chat/helpers/preflight.py
          php -l .validation/voice-preprocess/server/app/Application/Chat/ChatMediaPreflight.php
          php -l .validation/voice-preprocess/server/app/Application/Chat/ChatGoRuntimeConfig.php
          node --check .validation/voice-preprocess/miniprogram/subpackages/chat/conversation/av.js
          gofmt -d .validation/voice-preprocess/chat/internal/avpipeline/helper.go | tee /tmp/gofmt.diff
          test ! -s /tmp/gofmt.diff
      - name: Embedded standard MP3 fixture
        run: |
          python3 - <<'PY'
          import base64,pathlib
          p=pathlib.Path('.validation/voice-preprocess/chat/helpers/media/voice-fixture.b64')
          raw=base64.b64decode(p.read_text().strip(),validate=True)
          assert 512 <= len(raw) <= 65536
          assert raw[0] == 0xff and (raw[1] & 0xe0) == 0xe0
          print('fixture bytes',len(raw))
          PY
      - name: Preflight fixture path reaches helper contract
        run: |
          cat > /tmp/fake-python <<'SH'
          #!/bin/sh
          printf '%s\n' '{"kind":"audio","main":"main.mp3"}'
          SH
          chmod 700 /tmp/fake-python
          python3 - <<'PY'
          import importlib.util
          p='.validation/voice-preprocess/chat/helpers/preflight.py'
          spec=importlib.util.spec_from_file_location('preflight',p);m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          ok,code=m.voice_pipeline('/tmp/fake-python','.validation/voice-preprocess/chat/helpers/media/inspect.py','/bin/true','/bin/true')
          assert ok and code=='',(ok,code)
          print('fixture contract passed')
          PY
      - name: Existing stricter hard ulimit must not crash helper startup
        run: |
          (ulimit -n 32; python3 - <<'PY'
          import importlib.util,resource
          p='.validation/voice-preprocess/chat/helpers/media/inspect.py'
          spec=importlib.util.spec_from_file_location('media_inspect',p);m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          m.apply_resource_limits()
          soft,hard=resource.getrlimit(resource.RLIMIT_NOFILE)
          assert soft <= 32 and hard <= 32,(soft,hard)
          print('nofile',soft,hard)
          PY
          )
      - name: Normal WeChat MP3 path avoids unnecessary re-encode
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.validation/voice-preprocess/chat/helpers/media/inspect.py').read_text()
          assert 'if sample in (8000, 16000) and channels == 1:' in s
          assert 'encoding = ["-c:a", "copy"]' in s
          assert 'CHAT_AV_HELPER_RUNTIME_FAILED' in s
          print('voice fast path assertions passed')
          PY
