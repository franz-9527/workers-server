name: Temporary WXML compiler validation
on:
  push:
    branches: [main]
    paths:
      - '.validation-wxml/**'
      - '.github/workflows/temporary-wxml-compile.yml'
permissions:
  contents: read
jobs:
  wxml:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source blobs
        working-directory: .validation-wxml
        run: |
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),m=require('./source-manifest.json')
          for(const [p,sha]of Object.entries(m.files)){
            const b=fs.readFileSync(p)
            const hash=crypto.createHash('sha1').update(Buffer.from('blob '+b.length+'\0')).update(b).digest('hex')
            if(hash!==sha)throw Error('Source mismatch '+p)
          }
          console.log('Verified '+Object.keys(m.files).length+' source blobs',m.branches)
          NODE
      - name: Install WXML compiler
        run: |
          npm install --prefix "$RUNNER_TEMP/wxml-compiler" --no-save --no-audit --no-fund miniprogram-compiler@0.2.3
          NODE_PATH="$RUNNER_TEMP/wxml-compiler/node_modules" node -e "console.log('miniprogram-compiler '+require('miniprogram-compiler/package.json').version)"
      - name: Guard regression and original failure reproduction
        working-directory: .validation-wxml
        run: |
          node v260/tools/check-wxml.js --self-test
          NODE_PATH="$RUNNER_TEMP/wxml-compiler/node_modules" node - <<'NODE'
          const fs=require('fs'),path=require('path'),assert=require('assert/strict')
          const guard=require('./chat/tools/check-wxml.js')
          const before=fs.readFileSync('before/conversation.wxml','utf8')
          assert(guard.expressionErrors(before).length>0,'guard must reject the reported source')
          const compiler=require('miniprogram-compiler')
          let error=''
          try{compiler.wxmlToJs(path.resolve('before'),{})}catch(e){error=String(e.message||e)}
          assert.match(error,/unexpected|Bad attr/i,'original WXML must fail in the compiler')
          console.log('Original source fails as expected: '+error.slice(0,350))
          const fixed=fs.readFileSync('chat/miniprogram/subpackages/chat/conversation/index.wxml','utf8')
          assert.equal(fixed,before.replace('isGroup &amp;&amp; item.isMine','isGroup && item.isMine'),'business template has exactly one operator correction')
          const raw=guard.expressionErrors('<view wx:if="{{isGroup && item.isMine}}"/>')
          assert.equal(raw.length,0)
          console.log('Single-expression correction and original failure regression passed')
          NODE
      - name: Compile all v260 WXML
        working-directory: .validation-wxml
        run: NODE_PATH="$RUNNER_TEMP/wxml-compiler/node_modules" node v260/tools/check-wxml.js v260/miniprogram --compile
      - name: Compile all chat WXML
        if: success() || failure()
        working-directory: .validation-wxml
        run: NODE_PATH="$RUNNER_TEMP/wxml-compiler/node_modules" node chat/tools/check-wxml.js chat/miniprogram --compile
