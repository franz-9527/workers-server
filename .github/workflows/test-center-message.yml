name: Test Center Message And Coverage Contract

on:
  push:
    paths:
      - 'server/app/Infrastructure/Messaging/OrderNotificationProjector.php'
      - 'server/app/Infrastructure/Testing/TestMessageProjectionRecorder.php'
      - 'server/app/Infrastructure/Persistence/DatabaseTestCenterRepository.php'
      - 'server/app/Application/Testing/TestCenter.php'
      - 'server/views/admin/test-center.php'
      - 'server/views/admin/test-center-detail.php'
      - 'server/database/upgrades/2.6.0.sql'
      - 'server/database/upgrades/manifest.json'
      - 'server/tests/v260_test_center_message_contract.php'
      - 'server/tests/v260_test_center_coverage_contract.php'
      - '.github/workflows/test-center-message.yml'
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
      - name: PHP syntax
        run: |
          php -l server/app/Infrastructure/Messaging/OrderNotificationProjector.php
          php -l server/app/Infrastructure/Testing/TestMessageProjectionRecorder.php
          php -l server/app/Infrastructure/Persistence/DatabaseTestCenterRepository.php
          php -l server/app/Application/Testing/TestCenter.php
          php -l server/views/admin/test-center.php
          php -l server/views/admin/test-center-detail.php
          php -l server/tests/v260_test_center_message_contract.php
          php -l server/tests/v260_test_center_coverage_contract.php
      - name: Test center contracts
        run: |
          php server/tests/v260_test_center_message_contract.php
          php server/tests/v260_test_center_coverage_contract.php
      - name: Migration checksum
        run: |
          actual="$(sha256sum server/database/upgrades/2.6.0.sql | awk '{print $1}')"
          expected="$(php -r '$m=json_decode(file_get_contents("server/database/upgrades/manifest.json"),true); foreach($m as $row){ if(($row["version"]??"")==="2.6.0"){echo $row["checksum"]; exit;}} exit(1);')"
          test "$actual" = "$expected"
