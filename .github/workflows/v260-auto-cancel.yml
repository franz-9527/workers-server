name: V2.6.0 Scoped Auto Cancel

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v260-auto-cancel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: worker_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize candidate snapshot
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            target="${file#.test-center-auto-cancel-snapshot/}"
            mkdir -p "$(dirname "$target")"
            cp "$file" "$target"
          done < <(find .test-center-auto-cancel-snapshot -type f -print0)

      - name: PHP 7.4 syntax and safety contract
        id: contract
        continue-on-error: true
        shell: bash
        run: |
          set +e
          docker run --rm -v "$PWD:/app" -w /app php:7.4-cli bash -lc '
            php -l server/app/Infrastructure/Scheduling/AutoCancelProcessor.php
            php -l server/app/Services/SchedulerService.php
            php -l server/app/Infrastructure/Testing/DatabaseTestCenterSchedulerActionRunner.php
            php -l server/app/Infrastructure/Testing/DatabaseTestCenterSchedulerInspector.php
            php -l server/app/Infrastructure/Testing/DatabaseTestCenterAutoCancelVerificationRepository.php
            php -l server/app/Infrastructure/Testing/DatabaseTestCenterAutoCancelCleanupRepository.php
            php -l server/app/Foundation/TestCenterComposition.php
            php -l server/views/admin/test-center-scheduler-diagnostics.php
            php -l server/tests/v260_test_center_auto_cancel_contract.php
            php -l server/tests/v260_auto_cancel_processor_mysql.php
            php -l server/tests/v260_auto_cancel_cleanup_mysql.php
            php -l server/tests/v260_test_center_m2_refund_contract.php
            php -l server/tests/v260_test_center_m2_repair_contract.php
            php -l server/tests/v260_test_center_m2_negotiation_contract.php
            php -l server/tests/v260_test_center_m2_fulfillment_contract.php
            php server/tests/v260_test_center_auto_cancel_contract.php
          ' > .auto-cancel-contract.log 2>&1
          status=$?
          cat .auto-cancel-contract.log
          exit "$status"

      - name: MySQL 5.7 processor integration
        id: mysql
        continue-on-error: true
        env:
          V260_AUTO_CANCEL_MYSQL_TEST: '1'
          V250_DB_NAME: worker_test
          V250_DB_HOST: 127.0.0.1
          V250_DB_PORT: '3306'
          V250_DB_USER: root
          V250_DB_PASSWORD: root
        shell: bash
        run: |
          set +e
          php -m | grep -qi pdo_mysql
          php server/tests/v260_auto_cancel_processor_mysql.php > .auto-cancel-mysql.log 2>&1
          status=$?
          cat .auto-cancel-mysql.log
          exit "$status"

      - name: MySQL 5.7 cleanup integration
        id: cleanup_mysql
        continue-on-error: true
        env:
          V260_AUTO_CANCEL_CLEANUP_MYSQL_TEST: '1'
          V250_DB_NAME: worker_test
          V250_DB_HOST: 127.0.0.1
          V250_DB_PORT: '3306'
          V250_DB_USER: root
          V250_DB_PASSWORD: root
        shell: bash
        run: |
          set +e
          php -m | grep -qi pdo_mysql
          php server/tests/v260_auto_cancel_cleanup_mysql.php > .auto-cancel-cleanup-mysql.log 2>&1
          status=$?
          cat .auto-cancel-cleanup-mysql.log
          exit "$status"

      - name: Record verification result
        if: always()
        shell: bash
        env:
          CONTRACT_OUTCOME: ${{ steps.contract.outcome }}
          MYSQL_OUTCOME: ${{ steps.mysql.outcome }}
          CLEANUP_MYSQL_OUTCOME: ${{ steps.cleanup_mysql.outcome }}
          SOURCE_SHA: e295549282b4790a1047a9e7f625076f9a2b0b1d
        run: |
          set -euo pipefail
          printf '{"source_sha":"%s","php74_contract":"%s","mysql57_processor":"%s","mysql57_cleanup":"%s","workflow_sha":"%s"}\n' "$SOURCE_SHA" "$CONTRACT_OUTCOME" "$MYSQL_OUTCOME" "$CLEANUP_MYSQL_OUTCOME" "$GITHUB_SHA" > .auto-cancel-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .auto-cancel-result.json .auto-cancel-contract.log .auto-cancel-mysql.log .auto-cancel-cleanup-mysql.log
          git commit -m "test: record scoped auto cancel verification $CONTRACT_OUTCOME/$MYSQL_OUTCOME/$CLEANUP_MYSQL_OUTCOME"
          git push

      - name: Fail workflow when verification failed
        if: steps.contract.outcome != 'success' || steps.mysql.outcome != 'success' || steps.cleanup_mysql.outcome != 'success'
        run: exit 1
