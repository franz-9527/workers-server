name: V2.6.0 Test Center Failure Replay

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v260-failure-replay.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  php74-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Materialize candidate snapshot
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            target="${file#.test-center-replay-snapshot/}"
            mkdir -p "$(dirname "$target")"
            cp "$file" "$target"
          done < <(find .test-center-replay-snapshot -type f -print0)
      - name: PHP 7.4 syntax and replay contract
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          docker run --rm -v "$PWD:/app" -w /app php:7.4-cli bash -lc '
            php -l server/app/Contracts/TestCenterFailureReplay.php
            php -l server/app/Infrastructure/Testing/DatabaseTestCenterReplayCaptureRunner.php
            php -l server/app/Infrastructure/Testing/DatabaseTestCenterFailureReplay.php
            php -l server/app/Application/Testing/TestCenter.php
            php -l server/app/Foundation/TestCenterComposition.php
            php -l server/app/Http/Admin/Modules/TestCenterAdminModule.php
            php -l server/views/admin/test-center-detail-v260.php
            php -l server/views/admin/test-center-failure-replay.php
            php -l server/tests/v260_test_center_failure_replay_contract.php
            php server/tests/v260_test_center_failure_replay_contract.php
          ' > .test-center-replay-verify.log 2>&1
          status=$?
          cat .test-center-replay-verify.log
          exit "$status"
      - name: Record verification result
        if: always()
        shell: bash
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          SOURCE_SHA: 4a6bb4f26c3a81b9910dc7172fa60be72b0d0546
        run: |
          set -euo pipefail
          printf '{"source_sha":"%s","php74_contract":"%s","workflow_sha":"%s"}\n' "$SOURCE_SHA" "$VERIFY_OUTCOME" "$GITHUB_SHA" > .test-center-replay-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .test-center-replay-result.json .test-center-replay-verify.log
          git commit -m "test: record failure replay verification $VERIFY_OUTCOME"
          git push
      - name: Fail workflow when verification failed
        if: steps.verify.outcome != 'success'
        run: exit 1
