name: V2.6.0 Exact Candidate Verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v260-final-candidate.yml'

permissions:
  contents: read

concurrency:
  group: v260-final-candidate
  cancel-in-progress: true

jobs:
  exact-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: worker_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact workers dev/2.6.0
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --branch dev/2.6.0 https://github.com/franz-9527/workers.git source-workers
          git -C source-workers rev-parse HEAD
          test "$(cat source-workers/server/VERSION)" = "2.6.0"

      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mbstring
          coverage: none

      - name: Lint exact test-center PHP candidate
        shell: bash
        run: |
          set -euo pipefail
          files=(
            source-workers/server/app/Application/Testing/TestCenter.php
            source-workers/server/app/Application/Testing/TestScenarioCatalog.php
            source-workers/server/app/Contracts/TestCenterRepository.php
            source-workers/server/app/Domain/Testing/TestCenterException.php
            source-workers/server/app/Foundation/TestCenterComposition.php
            source-workers/server/app/Http/Admin/Modules/TestCenterAdminModule.php
            source-workers/server/app/Infrastructure/Persistence/DatabaseTestCenterRepository.php
            source-workers/server/views/admin/test-center.php
            source-workers/server/views/admin/test-center-detail.php
            source-workers/server/views/admin/test-center-batch-cleanup.php
            source-workers/server/tests/v260_test_center_contract.php
          )
          while IFS= read -r -d '' file; do files+=("$file"); done < <(find source-workers/server/app/Infrastructure/Testing -maxdepth 1 -type f -name '*.php' -print0)
          for file in "${files[@]}"; do php -l "$file"; done

      - name: Run V2.6.0 contract regression against exact candidate
        shell: bash
        run: |
          set -euo pipefail
          php source-workers/server/tests/v260_test_center_contract.php

      - name: Verify exact migration manifest checksum
        shell: bash
        run: |
          set -euo pipefail
          php -r '
            $root="source-workers/server";
            $manifest=json_decode(file_get_contents($root."/database/upgrades/manifest.json"),true);
            if(!is_array($manifest))exit(20);
            $found=null;foreach($manifest["upgrades"]??[] as $row){if(($row["version"]??"")==="2.6.0"){$found=$row;break;}}
            if(!$found)exit(21);
            $sha=hash_file("sha256",$root."/database/upgrades/2.6.0.sql");
            if(!hash_equals((string)$found["checksum"],$sha)){fwrite(STDERR,"manifest=$found[checksum] actual=$sha\n");exit(22);}
            if(($found["idempotent"]??null)!==true||($found["retry_failed"]??null)!==false||($found["install_baseline"]??null)!==true)exit(23);
            echo "v260_sql_sha256=$sha\n";
          '

      - name: Prepare MySQL 5.7 minimum dependency
        shell: bash
        run: |
          set -euo pipefail
          MYSQL=(mysql --protocol=tcp -h127.0.0.1 -P3306 -uroot -proot --default-character-set=utf8mb4 worker_test)
          VERSION="$(${MYSQL[@]} -Nse 'SELECT VERSION()')"
          [[ "$VERSION" == 5.7.* ]] || { echo "expected MySQL 5.7, got $VERSION" >&2; exit 1; }
          "${MYSQL[@]}" <<'SQL'
          CREATE TABLE database_field_dictionary (
            id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT,
            table_name VARCHAR(128) NOT NULL,
            field_name VARCHAR(128) NOT NULL,
            chinese_name VARCHAR(255) NOT NULL,
            description VARCHAR(1000) NULL,
            created_at DATETIME NOT NULL,
            updated_at DATETIME NOT NULL,
            PRIMARY KEY (id),
            UNIQUE KEY uq_database_field_dictionary (table_name,field_name)
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
          SQL
          echo "MySQL=$VERSION"

      - name: Apply exact V2.6.0 migration twice
        shell: bash
        run: |
          set -euo pipefail
          MYSQL=(mysql --protocol=tcp -h127.0.0.1 -P3306 -uroot -proot --default-character-set=utf8mb4 worker_test)
          "${MYSQL[@]}" < source-workers/server/database/upgrades/2.6.0.sql
          "${MYSQL[@]}" < source-workers/server/database/upgrades/2.6.0.sql
          TABLES="$(${MYSQL[@]} -Nse "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name IN ('test_batches','test_instances','test_runs','test_assertion_results','test_payment_facts','test_participants','test_media_facts')")"
          [[ "$TABLES" == "7" ]] || { echo "expected 7 test tables, got $TABLES" >&2; exit 1; }
          DICT="$(${MYSQL[@]} -Nse "SELECT COUNT(*) FROM database_field_dictionary WHERE table_name LIKE 'test_%'")"
          [[ "$DICT" == "9" ]] || { echo "expected 9 dictionary rows, got $DICT" >&2; exit 1; }
          echo "exact candidate migration assertions passed"
