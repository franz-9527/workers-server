# source_candidate: 9257ff785b897f03c5c44658d7fa843ed65c2152
name: V2.6.0 Paid SMS Receipt Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v260-paid-sms-receipt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paid-sms-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: worker_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mbstring, pdo_mysql, json
          coverage: none

      - name: Materialize candidate snapshot
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            target="${file#.test-center-paid-sms-receipt-snapshot/}"
            mkdir -p "$(dirname "$target")"
            cp "$file" "$target"
          done < <(find .test-center-paid-sms-receipt-snapshot -type f -print0)

      - name: PHP 7.4 syntax and receipt contracts
        shell: bash
        run: |
          set -euo pipefail
          php -l server/app/Domain/Messaging/PaidSmsReceiptPolicy.php
          php -l server/app/Domain/Messaging/PaidSmsPolicy.php
          php -l server/app/Infrastructure/Messaging/DatabasePaidSmsDeliveryRepository.php
          php -l server/app/Infrastructure/Testing/DatabaseTestCenterPaidSmsReceiptActionRunner.php
          php -l server/app/Infrastructure/Testing/TestingActionExecution.php
          php -l server/app/Foundation/TestCenterComposition.php
          php -l server/views/admin/test-center-detail-v260.php
          php -l server/views/admin/test-center-paid-sms-receipt-actions.php
          php -l server/tests/v260_paid_sms_receipt_policy.php
          php -l server/tests/v260_test_center_paid_sms_receipt_contract.php
          php -l server/tests/v260_test_center_paid_sms_receipt_mysql.php
          php -l server/tests/v260_paid_sms_receipt_repository_mysql.php
          php server/tests/v260_paid_sms_receipt_policy.php
          php server/tests/v260_test_center_paid_sms_receipt_contract.php

      - name: MySQL 5.7 test-center receipt probe
        env:
          V260_PAID_SMS_RECEIPT_MYSQL_TEST: '1'
          V250_DB_NAME: worker_test
          V250_DB_HOST: 127.0.0.1
          V250_DB_PORT: '3306'
          V250_DB_USER: root
          V250_DB_PASSWORD: root
        run: php server/tests/v260_test_center_paid_sms_receipt_mysql.php

      - name: MySQL 5.7 production receipt repository regression
        env:
          V260_PAID_SMS_REPOSITORY_MYSQL_TEST: '1'
          V250_DB_NAME: worker_test
          V250_DB_HOST: 127.0.0.1
          V250_DB_PORT: '3306'
          V250_DB_USER: root
          V250_DB_PASSWORD: root
        run: php server/tests/v260_paid_sms_receipt_repository_mysql.php
