name: V2.6.0 Scoped Platform Balance Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v260-platform-balance-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  platform-balance-release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: worker_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Materialize candidate snapshot
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            target="${file#.test-center-platform-balance-release-snapshot/}"
            mkdir -p "$(dirname "$target")"
            cp "$file" "$target"
          done < <(find .test-center-platform-balance-release-snapshot -type f -print0)

      - name: PHP 7.4 syntax and safety contract
        id: contract
        continue-on-error: true
        shell: bash
        run: |
          set +e
          docker run --rm -v "$PWD:/app" -w /app php:7.4-cli bash -lc '
            php -l server/app/Infrastructure/Persistence/PlatformOrderFrozenBalanceReleaser.php
            php -l server/app/Infrastructure/Persistence/DatabaseTestCenterRepository.php
            php -l server/app/Infrastructure/Testing/DatabaseTestCenterPlatformMeasurementActionRunner.php
            php -l server/app/Infrastructure/Testing/DatabaseTestCenterSchedulerInspector.php
            php -l server/app/Infrastructure/Testing/TestingPlatformFinanceOwnership.php
            php -l server/app/Infrastructure/Testing/DatabaseTestCenterPlatformMeasurementRepository.php
            php -l server/views/admin/test-center-scheduler-diagnostics.php
            php -l server/views/admin/test-center-platform-measurement-actions.php
            php -l server/tests/v260_test_center_platform_balance_release_contract.php
            php -l server/tests/v260_platform_balance_release_mysql.php
            php -l server/tests/v250_platform_balance_release_mysql.php
            php -l server/tests/v260_test_center_platform_measurement_mysql.php
            php server/tests/v260_test_center_platform_balance_release_contract.php
          ' > .platform-balance-contract.log 2>&1
          status=$?
          cat .platform-balance-contract.log
          exit "$status"

      - name: MySQL 5.7 scoped platform balance integration
        id: scoped_mysql
        continue-on-error: true
        env:
          V260_PLATFORM_BALANCE_RELEASE_MYSQL_TEST: '1'
          V250_DB_NAME: worker_test
          V250_DB_HOST: 127.0.0.1
          V250_DB_PORT: '3306'
          V250_DB_USER: root
          V250_DB_PASSWORD: root
        shell: bash
        run: |
          set +e
          php server/tests/v260_platform_balance_release_mysql.php > .platform-balance-scoped-mysql.log 2>&1
          status=$?
          cat .platform-balance-scoped-mysql.log
          exit "$status"

      - name: MySQL 5.7 legacy platform balance integration
        id: legacy_mysql
        continue-on-error: true
        env:
          V250_PLATFORM_MYSQL_TEST: '1'
          V250_DB_NAME: worker_test
          V250_DB_HOST: 127.0.0.1
          V250_DB_PORT: '3306'
          V250_DB_USER: root
          V250_DB_PASSWORD: root
        shell: bash
        run: |
          set +e
          php server/tests/v250_platform_balance_release_mysql.php > .platform-balance-legacy-mysql.log 2>&1
          status=$?
          cat .platform-balance-legacy-mysql.log
          exit "$status"

      - name: Record verification result
        if: always()
        shell: bash
        env:
          CONTRACT_OUTCOME: ${{ steps.contract.outcome }}
          SCOPED_OUTCOME: ${{ steps.scoped_mysql.outcome }}
          LEGACY_OUTCOME: ${{ steps.legacy_mysql.outcome }}
          SOURCE_SHA: 82572aab90f662c58da56c71d5e0794b8f3e9309
        run: |
          set -euo pipefail
          printf '{"source_sha":"%s","php74_contract":"%s","mysql57_scoped":"%s","mysql57_legacy":"%s","workflow_sha":"%s"}\n' "$SOURCE_SHA" "$CONTRACT_OUTCOME" "$SCOPED_OUTCOME" "$LEGACY_OUTCOME" "$GITHUB_SHA" > .platform-balance-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .platform-balance-result.json .platform-balance-contract.log .platform-balance-scoped-mysql.log .platform-balance-legacy-mysql.log
          git commit -m "test: record scoped platform balance verification $CONTRACT_OUTCOME/$SCOPED_OUTCOME/$LEGACY_OUTCOME"
          git push

      - name: Fail workflow when verification failed
        if: steps.contract.outcome != 'success' || steps.scoped_mysql.outcome != 'success' || steps.legacy_mysql.outcome != 'success'
        run: exit 1
