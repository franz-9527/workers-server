# source_candidate: dca28bc4efd46fcbd750a349d62ccbd15a4aa239
name: V2.6.0 Short Miniapp Entry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v260-short-entry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  short-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: worker_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mbstring, pdo_mysql, json
          coverage: none

      - name: Materialize candidate snapshot
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            target="${file#.test-center-short-entry-snapshot/}"
            mkdir -p "$(dirname "$target")"
            cp "$file" "$target"
          done < <(find .test-center-short-entry-snapshot -type f -print0)

      - name: PHP 7.4 syntax and short-entry contract
        shell: bash
        run: |
          set -euo pipefail
          php -l server/app/Infrastructure/Testing/TestCenterEntrySession.php
          php -l server/app/Contracts/ApiActorRepository.php
          php -l server/app/Infrastructure/Persistence/DatabaseApiActorRepository.php
          php -l server/app/Application/Identity/ApiActorResolver.php
          php -l server/app/Foundation/ApplicationContainer.php
          php -l server/app/Infrastructure/Persistence/DatabaseMiniAdminDemoRepository.php
          php -l server/app/Application/Identity/MiniAdminDemoOperations.php
          php -l server/app/Foundation/MiniAdminDemoComposition.php
          php -l server/app/Http/Api/Modules/MiniAdminDemoApiModule.php
          php -l server/app/Http/Admin/Modules/TestCenterAdminModule.php
          php -l server/views/admin/test-center-entry-token.php
          php -l server/views/admin/test-center-detail.php
          php -l server/tests/v260_test_center_short_entry_contract.php
          php -l server/tests/v260_test_center_short_entry_mysql.php
          php -l tools/test-messaging-migration.php
          php -l server/tests/support/payment_http_router.php
          php server/tests/v260_test_center_short_entry_contract.php

      - name: Miniapp JS and JSON syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check miniprogram/pages/testEntry/index.js
          node -e "const fs=require('fs'); JSON.parse(fs.readFileSync('miniprogram/pages/testEntry/index.json','utf8')); JSON.parse(fs.readFileSync('miniprogram/app.json','utf8'));"

      - name: MySQL 5.7 short-entry integration
        env:
          V260_SHORT_ENTRY_MYSQL_TEST: '1'
          V250_DB_NAME: worker_test
          V250_DB_HOST: 127.0.0.1
          V250_DB_PORT: '3306'
          V250_DB_USER: root
          V250_DB_PASSWORD: root
        shell: bash
        run: php server/tests/v260_test_center_short_entry_mysql.php
