name: V2.6.0 Scoped Supplement Timeout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v260-supplement-timeout.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  supplement-timeout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: worker_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mbstring, pdo_mysql, json
          coverage: none

      - name: Materialize candidate snapshot
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            target="${file#.test-center-supplement-timeout-snapshot/}"
            mkdir -p "$(dirname "$target")"
            cp "$file" "$target"
          done < <(find .test-center-supplement-timeout-snapshot -type f -print0)

      - name: PHP 7.4 syntax and safety contract
        id: contract
        continue-on-error: true
        shell: bash
        run: |
          set +e
          {
            php -l server/app/Infrastructure/Scheduling/SupplementTimeoutProcessor.php
            php -l server/app/Services/SchedulerService.php
            php -l server/app/Infrastructure/Testing/DatabaseTestCenterProxyOrderActionRunner.php
            php -l server/app/Infrastructure/Testing/DatabaseTestCenterSchedulerActionRunner.php
            php -l server/app/Infrastructure/Testing/DatabaseTestCenterSchedulerInspector.php
            php -l server/app/Infrastructure/Testing/DatabaseTestCenterSupplementTimeoutVerificationRepository.php
            php -l server/app/Infrastructure/Testing/DatabaseTestCenterSupplementTimeoutCleanupRepository.php
            php -l server/app/Foundation/TestCenterComposition.php
            php -l server/app/Domain/Messaging/MessageEventCatalog.php
            php -l server/views/admin/test-center-proxy-invitation-actions.php
            php -l server/views/admin/test-center-scheduler-diagnostics.php
            php -l server/tests/v260_test_center_supplement_timeout_contract.php
            php -l server/tests/v260_supplement_timeout_processor_mysql.php
            php -l server/tests/v260_supplement_timeout_cleanup_mysql.php
            php -l server/tests/v260_test_center_expansion_mysql.php
            php server/tests/v260_test_center_supplement_timeout_contract.php
          } > .supplement-timeout-contract.log 2>&1
          status=$?
          cat .supplement-timeout-contract.log
          exit "$status"

      - name: MySQL 5.7 processor integration
        id: mysql
        continue-on-error: true
        env:
          V260_SUPPLEMENT_TIMEOUT_MYSQL_TEST: '1'
          V250_DB_NAME: worker_test
          V250_DB_HOST: 127.0.0.1
          V250_DB_PORT: '3306'
          V250_DB_USER: root
          V250_DB_PASSWORD: root
        shell: bash
        run: |
          set +e
          php server/tests/v260_supplement_timeout_processor_mysql.php > .supplement-timeout-mysql.log 2>&1
          status=$?
          cat .supplement-timeout-mysql.log
          exit "$status"

      - name: MySQL 5.7 cleanup integration
        id: cleanup
        continue-on-error: true
        env:
          V260_SUPPLEMENT_CLEANUP_MYSQL_TEST: '1'
          V250_DB_NAME: worker_test
          V250_DB_HOST: 127.0.0.1
          V250_DB_PORT: '3306'
          V250_DB_USER: root
          V250_DB_PASSWORD: root
        shell: bash
        run: |
          set +e
          php server/tests/v260_supplement_timeout_cleanup_mysql.php > .supplement-timeout-cleanup.log 2>&1
          status=$?
          cat .supplement-timeout-cleanup.log
          exit "$status"

      - name: Record verification result
        if: always()
        shell: bash
        env:
          CONTRACT_OUTCOME: ${{ steps.contract.outcome }}
          MYSQL_OUTCOME: ${{ steps.mysql.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
          SOURCE_SHA: bb5293c368642c0426af6dd890cdad21643100a9
        run: |
          set -euo pipefail
          printf '{"source_sha":"%s","php74_contract":"%s","mysql57_processor":"%s","mysql57_cleanup":"%s","workflow_sha":"%s"}\n' "$SOURCE_SHA" "$CONTRACT_OUTCOME" "$MYSQL_OUTCOME" "$CLEANUP_OUTCOME" "$GITHUB_SHA" > .supplement-timeout-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .supplement-timeout-result.json .supplement-timeout-contract.log .supplement-timeout-mysql.log .supplement-timeout-cleanup.log
          git commit -m "test: record supplement timeout verification $CONTRACT_OUTCOME/$MYSQL_OUTCOME/$CLEANUP_OUTCOME"
          git push

      - name: Fail workflow when verification failed
        if: steps.contract.outcome != 'success' || steps.mysql.outcome != 'success' || steps.cleanup.outcome != 'success'
        run: exit 1
