name: V2.6.0 Test Center Isolated Smoke

on:
  push:
    branches: [main]
    paths:
      - 'tests/v260/**'
      - '.github/workflows/v260-test-center.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v260-test-center-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: worker_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 7.4 for test-center E2E
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: pdo_mysql, mbstring, pcntl
          coverage: none

      - name: Verify MySQL 5.7 and prepare minimum dependency
        shell: bash
        run: |
          set -euo pipefail
          MYSQL=(mysql --protocol=tcp -h127.0.0.1 -P3306 -uroot -proot --default-character-set=utf8mb4 worker_test)
          VERSION="$(${MYSQL[@]} -Nse 'SELECT VERSION()')"
          [[ "$VERSION" == 5.7.* ]] || { echo "expected MySQL 5.7, got $VERSION" >&2; exit 1; }
          "${MYSQL[@]}" <<'SQL'
          CREATE TABLE database_field_dictionary (
            id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT,
            table_name VARCHAR(128) NOT NULL,
            field_name VARCHAR(128) NOT NULL,
            chinese_name VARCHAR(255) NOT NULL,
            description VARCHAR(1000) NULL,
            created_at DATETIME NOT NULL,
            updated_at DATETIME NOT NULL,
            PRIMARY KEY (id),
            UNIQUE KEY uq_database_field_dictionary (table_name,field_name)
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
          SQL
          echo "MySQL=$VERSION"

      - name: Apply V2.6.0 migration twice
        shell: bash
        run: |
          set -euo pipefail
          MYSQL=(mysql --protocol=tcp -h127.0.0.1 -P3306 -uroot -proot --default-character-set=utf8mb4 worker_test)
          "${MYSQL[@]}" < tests/v260/2.6.0.sql
          "${MYSQL[@]}" < tests/v260/2.6.0.sql

      - name: Assert test center schema
        shell: bash
        run: |
          set -euo pipefail
          MYSQL=(mysql --protocol=tcp -h127.0.0.1 -P3306 -uroot -proot --default-character-set=utf8mb4 worker_test)
          TABLES="$(${MYSQL[@]} -Nse "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name IN ('test_batches','test_instances','test_runs','test_assertion_results','test_payment_facts','test_participants','test_media_facts')")"
          [[ "$TABLES" == "7" ]] || { echo "expected 7 test center tables, got $TABLES" >&2; exit 1; }
          DICT="$(${MYSQL[@]} -Nse "SELECT COUNT(*) FROM database_field_dictionary WHERE table_name LIKE 'test_%'")"
          [[ "$DICT" == "9" ]] || { echo "expected 9 test field dictionary rows, got $DICT" >&2; exit 1; }
          [[ "$(${MYSQL[@]} -Nse "SELECT COUNT(*) FROM information_schema.statistics WHERE table_schema=DATABASE() AND table_name='test_batches' AND index_name='uniq_test_batches_request' AND non_unique=0")" == "2" ]]
          [[ "$(${MYSQL[@]} -Nse "SELECT COUNT(*) FROM information_schema.statistics WHERE table_schema=DATABASE() AND table_name='test_runs' AND index_name='uniq_test_runs_idempotency' AND non_unique=0")" == "2" ]]
          [[ "$(${MYSQL[@]} -Nse "SELECT COUNT(*) FROM information_schema.statistics WHERE table_schema=DATABASE() AND table_name='test_payment_facts' AND index_name='uniq_test_payment_request' AND non_unique=0")" == "1" ]]
          echo "test center schema assertions passed"

      - name: Execute single-grab MySQL race E2E
        shell: bash
        env:
          V260_SINGLE_GRAB_MYSQL_TEST: '1'
          V260_DB_NAME: worker_test
          V260_DB_HOST: 127.0.0.1
          V260_DB_PORT: '3306'
          V260_DB_USER: root
          V260_DB_PASSWORD: root
        run: |
          set -euo pipefail
          php tests/v260/snapshot/server/tests/v260_test_center_single_grab_mysql_strict.php

      - name: Execute ordinary construction MySQL E2E
        shell: bash
        env:
          V260_ORDINARY_FLOW_MYSQL_TEST: '1'
          V260_DB_NAME: worker_test
          V260_DB_HOST: 127.0.0.1
          V260_DB_PORT: '3306'
          V260_DB_USER: root
          V260_DB_PASSWORD: root
        run: |
          set -euo pipefail
          php tests/v260/snapshot/server/tests/v260_test_center_ordinary_flow_mysql_strict.php

      - name: Execute ordinary measurement MySQL E2E
        shell: bash
        env:
          V260_MEASUREMENT_MYSQL_TEST: '1'
          V260_DB_NAME: worker_test
          V260_DB_HOST: 127.0.0.1
          V260_DB_PORT: '3306'
          V260_DB_USER: root
          V260_DB_PASSWORD: root
        run: |
          set -euo pipefail
          php tests/v260/snapshot/server/tests/v260_test_center_measurement_mysql_strict.php

      - name: Execute dispute finance MySQL E2E
        shell: bash
        env:
          V260_DISPUTE_FINANCE_MYSQL_TEST: '1'
          V260_DB_NAME: worker_test
          V260_DB_HOST: 127.0.0.1
          V260_DB_PORT: '3306'
          V260_DB_USER: root
          V260_DB_PASSWORD: root
        run: |
          set -euo pipefail
          php tests/v260/snapshot/server/tests/v260_test_center_dispute_finance_mysql_strict.php

      - name: Execute dispute finance cleanup MySQL E2E
        shell: bash
        env:
          V260_DISPUTE_FINANCE_CLEANUP_MYSQL_TEST: '1'
          V260_DB_NAME: worker_test
          V260_DB_HOST: 127.0.0.1
          V260_DB_PORT: '3306'
          V260_DB_USER: root
          V260_DB_PASSWORD: root
        run: |
          set -euo pipefail
          php tests/v260/snapshot/server/tests/v260_test_center_dispute_finance_cleanup_mysql_strict.php

      - name: Execute M2 safety MySQL E2E
        shell: bash
        env:
          V260_M2_SAFETY_MYSQL_TEST: '1'
          V260_DB_NAME: worker_test
          V260_DB_HOST: 127.0.0.1
          V260_DB_PORT: '3306'
          V260_DB_USER: root
          V260_DB_PASSWORD: root
        run: |
          set -euo pipefail
          php tests/v260/snapshot/server/tests/v260_test_center_m2_safety_mysql_strict.php

      - name: Candidate checksum
        shell: bash
        run: |
          set -euo pipefail
          echo "v260_sql_sha256=$(sha256sum tests/v260/2.6.0.sql | awk '{print $1}')"
