# source_candidate: 4df09a164760f82d33cd657632e65e06c7f91d51
name: V2.6.0 Upgrade Manifest

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v260-upgrade-manifest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
      - name: Materialize candidate snapshot
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            target="${file#.v260-manifest-snapshot/}"
            mkdir -p "$(dirname "$target")"
            cp "$file" "$target"
          done < <(find .v260-manifest-snapshot -type f -print0)
      - name: Verify manifest checksum contract
        shell: bash
        run: |
          set -euo pipefail
          php -l server/tests/v260_upgrade_manifest_contract.php
          php server/tests/v260_upgrade_manifest_contract.php
          echo "2.6.0.sql sha256=$(sha256sum server/database/upgrades/2.6.0.sql | awk '{print $1}')"
