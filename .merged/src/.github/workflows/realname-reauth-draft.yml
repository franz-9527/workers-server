name: Real-name reauthentication drafts

on:
  pull_request:
    paths:
      - 'miniprogram/pages/realName/**'
      - 'server/app/Application/Identity/**'
      - 'server/app/Application/Media/**'
      - 'server/app/Infrastructure/Persistence/Database*RealName*'
      - 'server/app/Infrastructure/Persistence/DatabaseOcrResultRepository.php'
      - 'server/app/Infrastructure/Persistence/DatabaseMediaRepository.php'
      - 'server/app/Infrastructure/Persistence/DatabaseWorkerMoneyRepository.php'
      - 'server/app/Contracts/RealName*'
      - 'server/app/Foundation/ApplicationContainer.php'
      - 'server/app/Foundation/MediaComposition.php'
      - 'server/app/Http/Api/Modules/RealNameApiModule.php'
      - 'tools/test-realname-*.php'
      - 'tools/test-realname-*.js'
      - '.github/workflows/realname-reauth-draft.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.36'
          extensions: pdo_mysql,pdo_sqlite,mbstring,curl,openssl,fileinfo,gd,simplexml,ctype,sodium
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify draft lifecycle and atomic history switch
        run: php tools/test-realname-reauth-draft.php
      - name: Verify original OCR recording contract
        run: php tools/test-ocr-result-recorder.php
      - name: Verify Mini Program draft interactions
        run: node tools/test-realname-draft-page.js
