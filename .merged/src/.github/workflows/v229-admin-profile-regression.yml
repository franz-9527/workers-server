name: V2.2.9 Regression

on:
  push:
    branches:
      - dev/2.2.9
    paths:
      - 'server/app/Controllers/ApiController.php'
      - 'server/app/Controllers/AdminController.php'
      - 'server/UPGRADE.md'
      - 'UPGRADE-2.2.9-MINIPROGRAM.md'
      - 'server/app/Services/UserWalletService.php'
      - 'server/app/Services/WorkerQuoteEligibilityService.php'
      - 'miniprogram/pages/orderHall/orderHall.js'
      - 'miniprogram/pages/workerOrder/detail.js'
      - 'server/app/Services/PaidSmsDispatchService.php'
      - 'server/app/Services/SchedulerService.php'
      - 'server/app/Services/OrderNotificationService.php'
      - 'server/app/Services/MessageEventCatalog.php'
      - 'server/app/Services/WeChatSubscribeMessageService.php'
      - 'server/app/Services/WorkerCloudGatewayService.php'
      - 'server/views/admin/settings.php'
      - 'server/views/admin/message-outbox.php'
      - 'server/assets/admin.js'
      - 'server/assets/admin.css'
      - 'server/database/upgrades/2.2.9.sql'
      - 'docs/消息配置开发说明.md'
      - 'server/docs/消息配置说明.md'
      - 'miniprogram/utils/SubscribeMessageUtils.js'
      - 'server/views/admin/wallets.php'
      - 'miniprogram/app.js'
      - 'miniprogram/pages/mine/mine.js'
      - 'miniprogram/pages/record/detail.js'
      - 'miniprogram/pages/record/detail.wxml'
      - 'miniprogram/pages/record/detail.wxss'
      - 'miniprogram/pages/mine/examine.js'
      - 'cloudfunctions/worker/index.js'
      - '.github/workflows/v229-admin-profile-regression.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.36'
          extensions: pdo_mysql,pdo_sqlite,mbstring,curl,openssl,fileinfo,gd,simplexml,ctype,sodium
      - name: PHP 8.3.36 syntax
        shell: bash
        run: |
          set -euo pipefail
          find server -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          tail -n 20 /tmp/php-lint.log
      - name: Mini Program JS syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check miniprogram/app.js
          node --check miniprogram/pages/mine/mine.js
          node --check miniprogram/pages/record/detail.js
          node --check miniprogram/pages/mine/examine.js
          node --check miniprogram/pages/orderHall/orderHall.js
          node --check miniprogram/pages/workerOrder/detail.js
          node --check miniprogram/utils/SubscribeMessageUtils.js
          node --check cloudfunctions/worker/index.js
      - name: Unified cloud worker review contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          examine=Path('miniprogram/pages/mine/examine.js').read_text()
          detail=Path('miniprogram/pages/record/detail.js').read_text()
          app=Path('miniprogram/app.js').read_text()
          mine=Path('miniprogram/pages/mine/mine.js').read_text()
          cloud=Path('cloudfunctions/worker/index.js').read_text()
          admin=Path('server/app/Controllers/AdminController.php').read_text()

          assert 'loadWorkerByPhoneV228' not in examine
          assert "db.collection('user')" not in examine
          assert "callWorker('miniAdmin.identity')" in examine
          assert "callWorker('miniAdmin.reviewList'" in examine
          assert "OrderApi.request('admin.review.records'" in examine, 'store review path remains intentionally server-backed'

          for old in ["workers.phone-reveal.policy", "workers.phone-reveal.authorize", "workers.phone-reveal", "admin.worker.review", "admin.worker.update", "legacyAdmin", "userInfo.gly"]:
              assert old not in detail, old
          assert "callWorker('member.phonePolicy'" in detail
          assert "callWorker('miniAdmin.identity')" in detail
          assert "callWorker('miniAdmin.phoneReveal'" in detail
          assert "callWorker('member.phoneReveal'" in detail
          assert "callWorker('miniAdmin.review'" in detail
          assert "callWorker('miniAdmin.update'" in detail
          assert "db.collection('user')" not in detail, 'worker detail must never directly read user phone records'
          assert "this.data.detail && this.data.detail._openid" not in detail

          assert "membership.summary" not in app
          assert "action: 'member.status'" in app
          assert "userInfo.mobile || userInfo.lastmobile" in mine

          for action in ["miniAdmin.identity","miniAdmin.reviewList","miniAdmin.detail","miniAdmin.update","miniAdmin.review","miniAdmin.phoneReveal","member.status","member.phonePolicy","member.phoneReveal"]:
              assert "case '"+action+"'" in cloud, action
          assert "case 'server.runtimeConfigSync'" in cloud
          assert "cloud.getWXContext()" in cloud
          assert "async function requireMiniAdmin()" in cloud
          assert "config.adminOpenids.indexOf(openid)" in cloud
          assert "const fields = ['mobile', 'lastmobile'];" in cloud
          assert "const fields = ['mobile', 'lastmobile', 'phone'];" not in cloud
          assert "const mobile = normalizeWorkerMobile(user && user.mobile);" in cloud
          assert "const mobile = normalizeWorkerMobile(user && user.lastmobile);" in cloud

          review_start=cloud.index('async function adminWorkerReview(payload, options)')
          review_end=cloud.index('async function adminWorkerDelete(payload)', review_start)
          review=cloud[review_start:review_end]
          assert 'isRealWorkerRecord' not in review
          assert "published: decision === 'approved'" in review
          assert "notifyFromCloud" in review
          assert "deliverReviewResultNotice" in review

          update_start=cloud.index('async function adminWorkerUpdate(payload)')
          update_end=cloud.index('async function updateCloudUserWorkerFlag', update_start)
          update=cloud[update_start:update_end]
          assert 'findWorkerRecord(payload.id, true)' in update
          assert 'keepExistingWorkerShape' not in update
          assert 'delete patch.updatedTime' in update

          delete_start=cloud.index('async function adminWorkerDelete(payload)')
          delete_end=cloud.index('function normalizeMarkedCategoryText', delete_start)
          assert 'findWorkerRecord(payload.id, true)' in cloud[delete_start:delete_end]

          assert "WORKER_RUNTIME_CONFIG_COLLECTION = 'worker_runtime_config'" in cloud
          assert "WORKER_PHONE_REVEAL_LOG_COLLECTION = 'worker_phone_reveal_logs'" in cloud
          assert "WORKER_PHONE_REVEAL_QUOTA_COLLECTION = 'worker_phone_reveal_quota'" in cloud
          assert "phoneRevealMember24hLimit" in cloud
          assert "viewerKey" in cloud and "workerId" in cloud
          assert "viewerOpenid:" not in cloud
          log_block=cloud[cloud.index('async function writeRevealLog'):cloud.index('async function currentPhonePolicy')]
          assert "mobile:" not in log_block
          assert "writeRevealQuota(openid, workerId)" in cloud
          assert "recentRevealWorkerIds(openid)" in cloud

          assert "wechat.admin_openids" in admin
          assert "server.runtimeConfigSync" in admin
          assert "syncWorkerRuntimeConfig" in admin
          assert "小程序管理员至少保留 1 个 OpenID" in admin
          assert "OrderNotificationService::queueWorkerReviewResult" in admin
          assert "syncWorkerRuntimeConfig()" in admin
          assert "运行配置已同步" in admin
          print('unified-cloud-worker-review-contract=ok')
          PY

      - name: Phone resolver deterministic unit
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs')
          const src = fs.readFileSync('cloudfunctions/worker/index.js', 'utf8')
          function workerStatus(record) { return record && record.published ? 'approved' : 'pending' }
          function workerTimeValue() { return 0 }
          function workerPublishTimestamp() { return 0 }
          function workerTimestamp() { return 0 }
          const normalizeStart = src.indexOf('function normalizeWorkerMobile(value)')
          const normalizeEnd = src.indexOf('async function resolveWorkerPhone(record)', normalizeStart)
          const searchStart = src.indexOf('function phoneSearchSafeText(value, maximum)')
          const searchEnd = src.indexOf('async function serverPhoneSearchIds(payload)', searchStart)
          if (normalizeStart < 0 || normalizeEnd < 0 || searchStart < 0 || searchEnd < 0) throw new Error('phone helper block missing')
          eval(src.slice(normalizeStart, normalizeEnd))
          eval(src.slice(searchStart, searchEnd))
          const expect = (actual, wanted, label) => {
            if (actual !== wanted) throw new Error(label + ': ' + actual + ' !== ' + wanted)
          }
          expect(chooseWorkerPhoneFromUsers([
            {_id:'b', regtime:200, mobile:'bad', lastmobile:'13900000002'},
            {_id:'a', regtime:100, mobile:'13800000001'}
          ]), '13800000001', 'valid current mobile beats newer lastmobile')
          expect(chooseWorkerPhoneFromUsers([
            {_id:'a', regtime:100, mobile:'13800000001'},
            {_id:'b', regtime:300, mobile:'+8613900000002'}
          ]), '13900000002', 'newer valid current mobile wins')
          expect(chooseWorkerPhoneFromUsers([
            {_id:'a', regtime:100, mobile:'', lastmobile:'13800000001'},
            {_id:'b', regtime:300, mobile:'invalid', lastmobile:'13900000002'}
          ]), '13900000002', 'latest valid historical mobile fallback')
          expect(normalizeWorkerMobile('86 138-0000-0001'), '13800000001', '86 normalization')
          const reviewItem = phoneSearchReviewItem({
            _id:'fake-worker-1',
            workerName:{legacy:'object-name'},
            workerType:['legacy','array'],
            published:true,
            publishTime:{legacy:'date-object'},
            createTime:{legacy:'date-object'},
            reviewNotice:{status:['bad'],message:{legacy:true},statusCode:{code:1},errorStatus:['legacy']}
          })
          if (reviewItem._id !== 'fake-worker-1') throw new Error('phone search review sanitizer lost id')
          if (typeof reviewItem.workerName !== 'string' || typeof reviewItem.workerType !== 'string') throw new Error('review sanitizer must emit strings')
          if (typeof reviewItem.publishTime !== 'number' || typeof reviewItem.updatedTime !== 'number' || typeof reviewItem.createTime !== 'number') throw new Error('review sanitizer must emit numeric times')

          const searchFnStart = src.indexOf('async function serverPhoneSearchIds(payload)')
          const searchFnEnd = src.indexOf('// 2026-09-22：门店审核也统一', searchFnStart)
          if (searchFnStart < 0 || searchFnEnd < 0) throw new Error('serverPhoneSearchIds block missing')
          const users = [
            {_id:'u-real', openid:'oyAoh-real', mobile:'13900000001'},
            {_id:'u-fake', openid:'fake-openid-9527', mobile:'13800000001'}
          ]
          const workers = [
            {_id:'w-fake', _openid:'fake-openid-9527', workerName:'非真实师傅', workerType:'墙布', published:true, deleteTime:'', publishTime:300, createTime:100}
          ]
          const makeQuery = (rows, condition) => ({
            limit: () => ({
              get: async () => ({data: rows.filter(row => Object.keys(condition).every(k => row[k] === condition[k]))})
            })
          })
          global.db = {
            collection(name) {
              const rows = name === 'user' ? users : (name === 'worker' ? workers : [])
              return { where(condition) { return makeQuery(rows, condition) } }
            }
          }
          eval(src.slice(searchFnStart, searchFnEnd))
          ;(async () => {
            const result = await serverPhoneSearchIds({mobile:'13800000001', source:'worker'})
            if (!result || result.ids[0] !== 'w-fake') throw new Error('non-real worker phone search did not resolve worker id')
            if (!result.items || result.items[0]._id !== 'w-fake') throw new Error('non-real worker phone search did not return sanitized item')
            if (result.items[0].workerName !== '非真实师傅') throw new Error('sanitized non-real worker item mismatch')
            console.log('phone-resolver-unit=ok')
          })().catch(error => { console.error(error); process.exit(1) })
          NODE
      - name: Worker cloud retry unit
        shell: bash
        run: |
          set -euo pipefail
          php <<'PHP'
          <?php
          require 'server/app/Services/WorkerCloudGatewayService.php';
          $service=new \WorkerAdmin\Services\WorkerCloudGatewayService();
          $method=new ReflectionMethod($service,'shouldRetryReadOnlyWorkerCloudTransport');
          $method->setAccessible(true);
          $yes=$method->invoke($service,'server.phoneReveal',new RuntimeException('微信云开发接口连接失败，HTTP 502'));
          $yes2=$method->invoke($service,'server.phoneSearchIds',new RuntimeException('微信云开发接口返回了非 JSON 数据。'));
          $no=$method->invoke($service,'server.phoneReveal',new RuntimeException('手机号查询失败：未找到 user'));
          $no2=$method->invoke($service,'admin.list',new RuntimeException('微信云开发接口连接失败，HTTP 502'));
          if(!$yes||!$yes2||$no||$no2) throw new RuntimeException('worker cloud retry contract failed');
          echo "worker-cloud-retry-unit=ok\n";
          PHP
      - name: Final V2.2.9 upgrade docs contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          server=Path('server/UPGRADE.md').read_text()
          root=Path('UPGRADE-2.2.9-MINIPROGRAM.md').read_text()
          assert '正式发行只保留 `v2.2.9`' in server
          assert 'cloud.getWXContext().OPENID' in server
          assert 'user.mobile' in server and 'user.lastmobile' in server
          assert '运行配置已同步' in server
          assert '先部署最终版 `cloudfunctions/worker`' in server
          for obsolete in ['### RC10', '### RC11', '### RC5', '完整号码仍只通过 PHP']:
              assert obsolete not in server, obsolete
          assert '只进行单一正式 `v2.2.9` 打包发行' in root
          assert '不再创建新的 RC 版本' in root
          print('final-v229-upgrade-docs=ok')
          PY
      - name: Admin profile security contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          js=Path('miniprogram/pages/record/detail.js').read_text()
          worker_cloud=Path('cloudfunctions/worker/index.js').read_text()
          admin=Path('server/app/Controllers/AdminController.php').read_text()
          app=Path('miniprogram/app.js').read_text()
          examine=Path('miniprogram/pages/mine/examine.js').read_text()
          wxml=Path('miniprogram/pages/record/detail.wxml').read_text()
          mine=Path('miniprogram/pages/mine/mine.js').read_text()
          api=Path('server/app/Controllers/ApiController.php').read_text()

          # 管理员编辑不消耗师傅本人资料更新时间；四状态审核和真实/非真实共用同一个 core。
          admin_start=worker_cloud.index('async function adminWorkerUpdate(payload)')
          admin_end=worker_cloud.index('async function updateCloudUserWorkerFlag', admin_start)
          admin_block=worker_cloud[admin_start:admin_end]
          assert 'patch.updatedTime = Date.now()' not in admin_block
          assert 'delete patch.updatedTime' in admin_block
          assert 'findWorkerRecord(payload.id, true)' in admin_block

          save_start=worker_cloud.index('async function saveOwnerWorker(openid, source, requireNew, touchUpdatedTime)')
          save_end=worker_cloud.index('async function adminWorkerCreate', save_start)
          save_block=worker_cloud[save_start:save_end]
          assert 'if (touchUpdatedTime && primary) data.updatedTime = now' in save_block
          assert "saveOwnerWorker(String(payload.openid || ''), payload.profile || {}, true, false)" in worker_cloud
          assert "saveOwnerWorker(String(payload.openid || ''), payload.profile || {}, false, true)" in worker_cloud

          # 时间字段语义：createTime=首次创建；updatedTime=师傅本人后续修改；publishTime=管理员审核通过/发布生效。
          unique_start=worker_cloud.index('async function saveUniqueRecord(event)')
          unique_end=worker_cloud.index('//我的发布记录搜索', unique_start)
          unique_block=worker_cloud[unique_start:unique_end]
          assert 'published: false, updatedTime: now' in unique_block
          assert "published: false, publishTime: ''," in unique_block
          assert 'published: false, publishTime: now' not in unique_block

          location_start=worker_cloud.index('async function updateActiveLocation(event)')
          location_end=worker_cloud.index('// 2026-08-24：不再限制重复发布', location_start)
          location_block=worker_cloud[location_start:location_end]
          assert 'updatedTime: Date.now()' in location_block
          assert 'publishTime:' not in location_block

          mini_list_start=worker_cloud.index('async function miniAdminReviewList(payload)')
          mini_list_end=worker_cloud.index('async function miniAdminDetail(payload)', mini_list_start)
          mini_list_block=worker_cloud[mini_list_start:mini_list_end]
          assert "orderBy('publishTime'" not in mini_list_block
          assert "readStream({ updatedTime: _.gt(0) }, 'updatedTime')" in mini_list_block
          assert "'createTime'" in mini_list_block

          review_start=worker_cloud.index('async function adminWorkerReview(payload, options)')
          review_end=worker_cloud.index('async function adminWorkerDelete(payload)', review_start)
          review_block=worker_cloud[review_start:review_end]
          assert 'updatedTime' not in review_block
          assert "publishTime: decision === 'approved' ? now : (current.publishTime || '')" in review_block
          assert 'isRealWorkerRecord' not in review_block
          assert "['approved','pending','rejected','suspended']" in review_block
          assert 'notifyFromCloud' in review_block

          # 详情不再拿 _openid，不直查 user，不走 PHP phone token；权限由云函数真实 OPENID 判断。
          assert "db.collection('user')" not in js
          assert 'legacyAdmin' not in js and 'userInfo.gly' not in js
          assert "callWorker('miniAdmin.phoneReveal'" in js
          assert "callWorker('member.phoneReveal'" in js
          assert "callWorker('member.phonePolicy'" in js
          assert "callWorker('miniAdmin.identity')" in js
          assert "callWorker('miniAdmin.review'" in js
          assert "callWorker('miniAdmin.update'" in js
          assert 'workers.phone-reveal' not in js
          assert 'admin.worker.review' not in js and 'admin.worker.update' not in js

          detail_start=worker_cloud.index('async function getRecordDetail(event)')
          detail_end=worker_cloud.index('async function delRecord', detail_start)
          public_detail=worker_cloud[detail_start:detail_end]
          assert "delete safe[key]" in public_detail and 'openid|mobile|phone' in public_detail

          resolver_start=worker_cloud.index('async function resolveWorkerPhone(record)')
          resolver_end=worker_cloud.index('async function membershipCardBound', resolver_start)
          resolver=worker_cloud[resolver_start:resolver_end]
          assert "const ownerOpenid = String(record._openid || '').trim();" in resolver
          assert "where({ openid: ownerOpenid }).limit(100).get()" in resolver
          assert "where({ _openid: ownerOpenid })" not in resolver
          assert 'chooseWorkerPhoneFromUsers(rows)' in resolver
          assert 'record.mobile' not in resolver and 'record.lastmobile' not in resolver and 'record.phone' not in resolver

          search_start=worker_cloud.index('async function serverPhoneSearchIds(payload)')
          search_end=worker_cloud.index('async function serverStoreReview(payload)', search_start)
          search=worker_cloud[search_start:search_end]
          assert "const fields = ['mobile', 'lastmobile'];" in search
          assert "'phone'" not in search.split('const fields =',1)[1].split(';',1)[0]
          assert "db.collection(source).where({ _openid: openid }).limit(100).get()" in search

          # 方案 B：会员状态/权限/额度均从云端读取，不依赖 PHP membership.summary。
          assert "action: 'member.status'" in app and 'membership.summary' not in app
          assert "async function currentPhonePolicy(workerId)" in worker_cloud
          assert "phoneRevealVipActive(viewer)" in worker_cloud
          assert "recentRevealWorkerIds(openid)" in worker_cloud
          assert "WORKER_PHONE_REVEAL_LOG_COLLECTION" in worker_cloud

          # 后台是管理员名单和手机号策略唯一配置入口；保存后签名同步云端。
          assert "private function syncWorkerRuntimeConfig(): array" in admin
          assert "invoke('server.runtimeConfigSync'" in admin
          assert "'wechat.admin_openids'" in admin
          assert "'worker.phone_reveal_member_24h_limit'" in admin
          assert "OrderNotificationService::queueWorkerReviewResult" in admin

          # “我的”管理员身份只认云端同步名单；PHP bootstrap 只提供订单/工作台数据。
          assert "loadCloudAdminIdentity()" in mine
          assert "action: 'miniAdmin.identity'" in mine
          assert "isOrderAdmin: identity.is_admin === true" not in mine

          # 云端审核为事实源；服务器在 bootstrap 尽力刷新、报价前强制刷新轻量投影。
          assert "private function refreshActorWorkerProjection(array $actor,bool $required=false):array" in api
          assert "$actor=$this->refreshActorWorkerProjection($actor,false);" in api
          assert "private function requireApprovedWorker(array &$actor): void" in api
          assert "$actor=$this->refreshActorWorkerProjection($actor,true);" in api
          assert "$cloudUser['mobile']??''" in api
          assert "$cloudUser['lastmobile']??''" in api

          # 审核页 worker 走云端；store 仍保留原服务器审核能力。
          assert 'loadWorkerByPhoneV228' not in examine
          assert "db.collection('user')" not in examine
          assert "callWorker('miniAdmin.reviewList'" in examine
          assert "OrderApi.request('admin.review.records'" in examine

          assert 'cu-modal phone-reveal-modal' in wxml
          assert '<view class="content">手机号</view>' in wxml
          assert 'bindtap="copyPhoneReveal">复制</view>' in wxml
          assert 'bindtap="callPhoneReveal">拨打</view>' in wxml
          assert 'bindtap="loadAdminSmsStats"' in wxml
          assert '点击统计' in wxml
          assert "saveAdminProfilePatch" in js
          for field in ['workerName','workerType','skills','location_city','address','baseFeeAmount','paid','pay_fixed','pay_oldwall','sell','workerTime','startDate','content']:
              assert f'data-field="{field}"' in wxml, field
          assert '管理图片' in wxml
          wallet=Path('server/app/Services/UserWalletService.php').read_text()
          paid=Path('server/app/Services/PaidSmsDispatchService.php').read_text()
          api=Path('server/app/Controllers/ApiController.php').read_text()
          scheduler=Path('server/app/Services/SchedulerService.php').read_text()
          admin=Path('server/app/Controllers/AdminController.php').read_text()
          wallets=Path('server/views/admin/wallets.php').read_text()
          assert "wallet_recharge_refund" in wallet
          assert "wallet_refund_hold:" in wallet and "wallet_refund_consume:" in wallet and "wallet_refund_release:" in wallet
          assert "receipt_deadline_at=DATE_ADD(UTC_TIMESTAMP()" in paid
          assert "lockWalletThenInvite" in paid
          assert "receipt_deadline_at=COALESCE(receipt_deadline_at,DATE_ADD(UTC_TIMESTAMP()" not in paid
          assert "'wallets.recharge.refund' => 'walletRechargeRefund'" in admin
          assert "private function walletRechargeRefund()" in admin
          assert "consumeRechargeRefundHoldLocked" in api and "releaseRechargeRefundHoldLocked" in api
          assert "consumeRechargeRefundHoldLocked" in scheduler and "releaseRechargeRefundHoldLocked" in scheduler
          assert "p.business_type='wallet_recharge'" in scheduler
          assert "整笔纠错退款" in wallets

          # V2.2.9 消息配置：单一事件目录、具体企微标题、订阅映射、可靠队列契约
          notification=Path('server/app/Services/OrderNotificationService.php').read_text()
          catalog=Path('server/app/Services/MessageEventCatalog.php').read_text()
          message_settings=Path('server/views/admin/settings.php').read_text()
          admin_js=Path('server/assets/admin.js').read_text()
          outbox_view=Path('server/views/admin/message-outbox.php').read_text()
          wechat_service=Path('server/app/Services/WeChatSubscribeMessageService.php').read_text()
          subscribe_js=Path('miniprogram/utils/SubscribeMessageUtils.js').read_text()
          upgrade_229=Path('server/database/upgrades/2.2.9.sql').read_text()
          message_doc=Path('docs/消息配置开发说明.md').read_text()
          message_ops=Path('server/docs/消息配置说明.md').read_text()

          assert '【壁选后台待办】' not in notification
          assert '【壁选订单提醒】' not in notification
          assert "$content='【'.$title.'】';" in notification
          assert 'MessageEventCatalog::all()' in notification and 'MessageEventCatalog::get($type)' in notification
          assert 'final class MessageEventCatalog' in catalog
          assert "$enabled = $saved === null ? false" in catalog, 'unsaved external events must fail closed'
          assert "'repair_platform_intervention_requested'=>['用户已申请平台介入维修',['worker']" in catalog
          assert "'measurement_result_submitted'=>['测量成果待确认',['user']" in catalog
          assert "'measurement_income_released'=>['测量费用已结算',['worker']" in catalog
          assert 'admin-message-priority-list' in message_settings
          assert 'OrderNotificationService::eventCatalog()' in message_settings
          assert 'data-notification-field-map=' in message_settings
          assert 'data-event-switch-bulk="all"' in message_settings and 'data-event-switch-bulk="none"' in message_settings
          assert "saved.priority = input.getAttribute('data-event-priority') || 'important';" in admin_js
          assert "value[key].field_map[semantic] = mapped;" in admin_js
          assert "'measurement_hold_extension_requested'" in api and "'测量冻结延期申请'" in api
