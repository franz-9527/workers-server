name: V2.5.0 Agreed Refund Execution

on:
  push:
    branches:
      - dev/2.5.0
    paths:
      - 'server/app/Application/Admin/AgreedRefundExecution.php'
      - 'server/app/Application/Admin/FailedRefundRecovery.php'
      - 'server/app/Contracts/AgreedRefundExecutionRepository.php'
      - 'server/app/Contracts/FailedRefundRecoveryRepository.php'
      - 'server/app/Foundation/AgreedRefundExecutionComposition.php'
      - 'server/app/Foundation/FailedRefundRecoveryComposition.php'
      - 'server/app/Infrastructure/Persistence/DatabaseAgreedRefundExecutionRepository.php'
      - 'server/app/Infrastructure/Persistence/DatabaseFailedRefundRecoveryRepository.php'
      - 'server/app/Infrastructure/Persistence/DatabaseOrderCancellationRepository.php'
      - 'server/app/Infrastructure/Persistence/OrderExceptionWorkbenchTaskSource.php'
      - 'server/app/Infrastructure/Scheduling/ApprovedOrderRefundRetryBridge.php'
      - 'server/app/Infrastructure/Scheduling/ApprovedOrderRefundRetryProcessor.php'
      - 'server/app/Http/Admin/Modules/AgreedRefundExecutionAdminModule.php'
      - 'server/app/Http/Admin/Modules/FailedRefundRecoveryAdminModule.php'
      - 'server/app/Http/Admin/AdminKernel.php'
      - 'server/app/Controllers/AdminController.php'
      - 'server/app/Services/SchedulerService.php'
      - 'server/views/admin/refund-execution.php'
      - 'server/views/admin/refund-failures.php'
      - 'server/views/admin/refund-failure.php'
      - 'server/views/admin/resource-list.php'
      - 'server/tests/v250_agreed_refund_execution_regression.php'
      - 'server/tests/v250_agreed_refund_execution_mysql.php'
      - 'server/tests/v250_refund_execution_boundary_mysql.php'
      - 'server/tests/v250_failed_refund_recovery_regression.php'
      - 'server/tests/v250_failed_refund_recovery_mysql.php'
      - 'server/tests/v250_approved_order_refund_retry_mysql.php'
      - 'server/tests/v250_approved_order_refund_lock_mysql.php'
      - '.github/workflows/v250-agreed-refund-execution.yml'
  pull_request:
    branches:
      - dev/2.5.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agreed-refund-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: worker_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.36'
          extensions: pdo_mysql,pdo_sqlite,mbstring,curl,openssl,fileinfo,gd,simplexml,ctype,sodium
          coverage: none

      - name: Syntax and contract regression
        run: |
          set -euo pipefail
          php -l server/app/Application/Admin/AgreedRefundExecution.php
          php -l server/app/Application/Admin/FailedRefundRecovery.php
          php -l server/app/Contracts/AgreedRefundExecutionRepository.php
          php -l server/app/Contracts/FailedRefundRecoveryRepository.php
          php -l server/app/Foundation/AgreedRefundExecutionComposition.php
          php -l server/app/Foundation/FailedRefundRecoveryComposition.php
          php -l server/app/Infrastructure/Persistence/DatabaseAgreedRefundExecutionRepository.php
          php -l server/app/Infrastructure/Persistence/DatabaseFailedRefundRecoveryRepository.php
          php -l server/app/Infrastructure/Scheduling/ApprovedOrderRefundRetryBridge.php
          php -l server/app/Infrastructure/Scheduling/ApprovedOrderRefundRetryProcessor.php
          php -l server/app/Http/Admin/Modules/AgreedRefundExecutionAdminModule.php
          php -l server/app/Http/Admin/Modules/FailedRefundRecoveryAdminModule.php
          php -l server/views/admin/refund-execution.php
          php -l server/views/admin/refund-failures.php
          php -l server/views/admin/refund-failure.php
          php -l server/views/admin/resource-list.php
          php -l server/tests/v250_agreed_refund_execution_regression.php
          php -l server/tests/v250_failed_refund_recovery_regression.php
          php -l server/tests/v250_approved_order_refund_retry_mysql.php
          php -l server/tests/v250_approved_order_refund_lock_mysql.php
          php server/tests/v250_agreed_refund_execution_regression.php
          php server/tests/v250_failed_refund_recovery_regression.php

      - name: MySQL 5.7 agreed refund execution
        env:
          V250_PLATFORM_MYSQL_TEST: '1'
          V250_DB_NAME: worker_test
          V250_DB_HOST: 127.0.0.1
          V250_DB_USER: root
          V250_DB_PASSWORD: root
        run: |
          php server/tests/v250_refund_execution_boundary_mysql.php
          php server/tests/v250_agreed_refund_execution_mysql.php
          php server/tests/v250_failed_refund_recovery_mysql.php
          php server/tests/v250_approved_order_refund_retry_mysql.php
          php server/tests/v250_approved_order_refund_lock_mysql.php
