name: V2.5.0 Platform Order Smoke

on:
  push:
    branches:
      - dev/2.5.0
  pull_request:
    branches:
      - dev/2.5.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-order-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: worker_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3.36
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.36'
          extensions: pdo_mysql,pdo_sqlite,mbstring,curl,openssl,fileinfo,gd,simplexml,ctype,sodium
          coverage: none

      - name: Install MySQL client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y default-mysql-client

      - name: PHP syntax check
        run: |
          set -euo pipefail
          php -v
          find server -type f -name '*.php' -not -path '*/vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -l

      - name: Modular architecture and agreement regression
        run: |
          set -euo pipefail
          php tools/check-modular-architecture.php
          php tools/test-modular-domain.php
          php tools/test-actor-capabilities.php
          php tools/test-architecture-wiring.php
          php tools/test-controller-retirement-guards.php
          php tools/test-messaging-migration.php
          php tools/test-message-configuration.php
          php tools/test-message-delivery.php
          php tools/test-payment-http-retirement.php
          php tools/test-board-http-retirement.php
          php tools/test-auxiliary-http-retirement.php
          php server/tests/v250_admin_workbench_read_model_regression.php
          php server/tests/v250_admin_proxy_action_regression.php
          php tools/test-agreement-layering.php

      - name: Controller retirement and messaging persistence
        env:
          CONTROLLER_RETIREMENT_MYSQL_TEST: '1'
          MESSAGING_MIGRATION_MYSQL_TEST: '1'
          MESSAGE_COMPLETION_MYSQL_TEST: '1'
          PAYMENT_RETIREMENT_MYSQL_TEST: '1'
          BOARD_RETIREMENT_MYSQL_TEST: '1'
          AUXILIARY_RETIREMENT_MYSQL_TEST: '1'
          V250_DB_HOST: 127.0.0.1
          V250_DB_PORT: '3306'
          V250_DB_USER: root
          V250_DB_PASSWORD: root
        run: |
          php server/tests/v250_controller_retirement_mysql.php
          php server/tests/v250_messaging_migration_mysql.php
          php server/tests/v250_message_completion_mysql.php
          php server/tests/v250_payment_retirement_mysql.php
          php server/tests/v250_board_retirement_mysql.php
          php server/tests/v250_auxiliary_retirement_mysql.php

      - name: Platform order contract smoke
        run: php server/tests/v250_platform_order_smoke.php

      - name: Platform order application regression
        run: php server/tests/v250_platform_order_application.php

      - name: Setup Node for platform order creation UI
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Platform order creation UI regression
        run: |
          node tools/test_v250_platform_order_create_ui.js
          node tools/test_v250_product_template_quick_apply.js
          node tools/test_v250_product_template_reuse_ui.js
          node --check miniprogram/pages/adminWorkbench/createOrdinaryOrder.js
          node tools/test_v250_api_environment.js

      - name: Mini platform order creation MySQL regression
        env:
          MINI_PLATFORM_CREATE_MYSQL_TEST: '1'
          V250_DB_PORT: '3306'
          V250_DB_USER: root
          V250_DB_PASSWORD: root
        run: php server/tests/v250_mini_platform_order_creation_mysql.php

      - name: Ordinary proxy creation and historical product reuse MySQL regression
        env:
          ORDINARY_CREATE_MYSQL_TEST: '1'
          V250_DB_PORT: '3306'
          V250_DB_USER: root
          V250_DB_PASSWORD: root
        run: php server/tests/v250_ordinary_order_creation_mysql.php

      - name: Platform measurement and customer share regression
        run: php server/tests/v250_platform_measurement_share_regression.php

      - name: Platform measurement pricing review regression
        run: php server/tests/v250_platform_measurement_pricing_review_regression.php

      - name: Modular owner order actions regression
        run: php server/tests/v250_order_detail_owner_actions.php

      - name: Unified bilateral negotiation policy regression
        run: php server/tests/v250_negotiation_policy_regression.php

      - name: Dispute negotiation and web adjudication regression
        run: php server/tests/v250_dispute_negotiation_regression.php

      - name: Order closure permissions and notifications regression
        run: php server/tests/v250_order_closure_regression.php

      - name: Order cancellation automation regression
        run: php server/tests/v250_order_cancellation_regression.php

      - name: Cancellation risk policy regression
        run: php server/tests/v250_order_cancellation_risk_regression.php

      - name: Contact reveal automation regression
        run: php server/tests/v250_contact_reveal_automation_regression.php

      - name: Measurement hold extension regression
        run: php server/tests/v250_measurement_hold_extension_regression.php

      - name: Repair intervention automation regression
        run: php server/tests/v250_repair_intervention_regression.php

      - name: Run-empty self-resolution regression
        run: php server/tests/v250_order_run_empty_self_resolution.php

      - name: Scheduler catalog and configured deadlines
        run: php server/tests/v250_scheduler_catalog_contract.php

      - name: Itemized actual quantity regression
        run: php server/tests/v250_platform_pricing_regression.php

      - name: Platform order settlement and commission boundaries
        run: php server/tests/v250_platform_settlement_regression.php

      - name: Platform income and refund review boundaries
        run: php server/tests/v250_platform_income_confirmation_regression.php

      - name: Verify manual and automatic acceptance wiring
        run: |
          set -euo pipefail
          grep -q 'PlatformOrderSettlementWriter' server/app/Infrastructure/Persistence/DatabaseOrderCompletionRepository.php
          grep -q 'platform_auto_accepted_settlement' server/app/Services/SchedulerService.php
          grep -q 'if ((string)($order' server/app/Services/SchedulerService.php
          grep -q 'finalizeCommissionReceivable' server/app/Services/SchedulerService.php
          grep -q 'ConfiguredOrderDeadlineBridge' server/app/Infrastructure/Scheduling/LegacySchedulerGateway.php

      - name: Verify frozen worker balance release wiring
        run: |
          set -euo pipefail
          grep -q 'PlatformOrderFrozenBalanceReleaser' server/app/Services/SchedulerService.php
          grep -q 'platform_balance_release' server/app/Domain/Scheduling/SchedulerTaskCatalog.php
          php tools/test-wallet-recharge-scheduler-wiring.php
          grep -q 'platform_balance_release' server/views/admin/tasks.php
          grep -q 'worker_balance_released' server/app/Infrastructure/Persistence/OrderDetailSettlementViews.php

      - name: Verify platform auto publish wiring
        run: |
          set -euo pipefail
          grep -q 'platform_auto_publish' server/app/Domain/Scheduling/SchedulerTaskCatalog.php
          grep -q 'PlatformOrderAutoPublishTask' server/app/Infrastructure/Scheduling/LegacySchedulerGateway.php
          grep -q 'platform_auto_publish' server/bin/scheduler.php

      - name: Mini Program order flow regression
        run: |
          set -euo pipefail
          node --check miniprogram/components/platform-order-pricing/index.js
          node --check miniprogram/components/worker-service-appointment/index.js
          node --check miniprogram/components/worker-completion-submit/index.js
          node --check miniprogram/components/measurement-order-detail/detail-core.js
          node --check miniprogram/pages/workerOrder/detail.js
          node --check miniprogram/pages/orderSubmit/index.js
          node tools/test_v250_cancellation_risk_ui.js
          node --check miniprogram/pages/userOrder/detail.js
          node --check miniprogram/pages/adminWorkbench/index.js
          node --check miniprogram/pages/adminWorkbench/detail.js
          node --check miniprogram/components/admin-order-operations/index.js
          node --check miniprogram/components/order-fulfillment-materials/index.js
          node tools/test_v250_admin_workbench_operations_ui.js
          node --check miniprogram/pages/adminWorkbench/customerShare.js
          node --check miniprogram/pages/adminWorkbench/pricingReview.js
          node --check miniprogram/pages/platformOrderShare/index.js
          node --check miniprogram/pages/plus/plus.js
          node --check miniprogram/utils/OrderApi.js
          node tools/test_v250_platform_pricing_ui.js
          node tools/test_v250_order_closure_ui.js
          node tools/test_v250_worker_service_appointment_ui.js
          node tools/test_v250_worker_completion_submit_ui.js
          node tools/test_v250_owner_acceptance_ui.js
          node tools/test_v250_negotiation_ui.js
          node --check miniprogram/components/order-negotiation-panel/index.js
          node tools/test_v250_invite_onboarding_resume.js
          grep -q 'platform-order-pricing' miniprogram/pages/workerOrder/detail.wxml
          grep -q 'worker-service-appointment' miniprogram/pages/workerOrder/detail.wxml
          grep -q 'worker-completion-submit' miniprogram/pages/workerOrder/detail.wxml
          grep -q "item.purpose === 'collection_receipt'" miniprogram/pages/userOrder/detail.wxml
          grep -q '被分享者登录后如尚未入驻' miniprogram/pages/userOrder/detail.wxml
          grep -q '保存分享图' miniprogram/pages/adminWorkbench/customerShare.wxml
          grep -q '当前待处理' miniprogram/pages/adminWorkbench/detail.wxml
          grep -q '订单运营操作' miniprogram/pages/adminWorkbench/detail.wxml
          grep -q "admin.workbench.order" miniprogram/pages/adminWorkbench/detail.js
          grep -q '待处理' miniprogram/pages/adminWorkbench/index.wxml
          grep -q '全部订单' miniprogram/pages/adminWorkbench/index.wxml
          grep -q '异常' miniprogram/pages/adminWorkbench/index.wxml
          grep -q 'openPricingReview' miniprogram/pages/adminWorkbench/detail.js
          grep -q 'openCustomerShare' miniprogram/pages/adminWorkbench/detail.js
          grep -q 'audit_approve' miniprogram/pages/adminWorkbench/detail.js
          ! grep -q '正常审核、发布、派单和核价不在此处理' miniprogram/pages/adminWorkbench/detail.wxml

      - name: Import fresh schema on MySQL 5.7
        env:
          MYSQL_PWD: root
        run: |
          set -euo pipefail
          mysql --version
          mysql -h 127.0.0.1 -P 3306 -uroot worker_test < server/database/database.sql

      - name: Re-run V2.5.0 upgrade twice
        env:
          MYSQL_PWD: root
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -P 3306 -uroot worker_test < server/database/upgrades/2.5.0.sql
          mysql -h 127.0.0.1 -P 3306 -uroot worker_test < server/database/upgrades/2.5.0.sql

      - name: Assert platform order schema and defaults
        env:
          MYSQL_PWD: root
        run: |
          set -euo pipefail
          query() {
            mysql -h 127.0.0.1 -P 3306 -uroot -Nse "$1" worker_test
          }
          test "$(query "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name='order_platform_terms'")" = "1"
          test "$(query "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name='order_pricing_items'")" = "1"
          test "$(query "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name='platform_order_refund_reviews'")" = "1"
          test "$(query "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name='platform_order_manual_receipts'")" = "1"
          test "$(query "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema=DATABASE() AND table_name='order_platform_terms' AND column_name='worker_settlement_mode'")" = "1"
          test "$(query "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema=DATABASE() AND table_name='order_platform_terms' AND column_name='platform_receivable_cents'")" = "1"
          test "$(query "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema=DATABASE() AND table_name='order_platform_terms' AND column_name='worker_balance_freeze_days_snapshot'")" = "1"
          test "$(query "SELECT setting_value FROM system_settings WHERE setting_key='platform_order.worker_balance_freeze_days'")" = "0"
          test "$(query "SELECT setting_value FROM system_settings WHERE setting_key='platform_order.extra_income_rate_bp'")" = "2000"
          test "$(query "SELECT setting_value FROM system_settings WHERE setting_key='app.version'")" = "2.5.0"
          echo "MySQL 5.7 platform order schema smoke: OK"

      - name: Platform measurement pricing review real MySQL integration
        env:
          V250_PLATFORM_MYSQL_TEST: '1'
          V250_DB_NAME: worker_test
          V250_DB_HOST: 127.0.0.1
          V250_DB_USER: root
          V250_DB_PASSWORD: root
        run: php server/tests/v250_platform_measurement_pricing_review_mysql.php

      - name: Order closure permissions and notification rollback real MySQL integration
        env:
          V250_PLATFORM_MYSQL_TEST: '1'
          V250_DB_NAME: worker_test
          V250_DB_HOST: 127.0.0.1
          V250_DB_USER: root
          V250_DB_PASSWORD: root
        run: php server/tests/v250_order_closure_mysql.php

      - name: Platform frozen balance real MySQL integration
        env:
          V250_PLATFORM_MYSQL_TEST: '1'
          V250_DB_NAME: worker_test
          V250_DB_HOST: 127.0.0.1
          V250_DB_USER: root
          V250_DB_PASSWORD: root
        run: php server/tests/v250_platform_balance_release_mysql.php

      - name: Platform booking payment and refund real MySQL integration
        env:
          V250_PLATFORM_MYSQL_TEST: '1'
          V250_DB_NAME: worker_test
          V250_DB_HOST: 127.0.0.1
          V250_DB_USER: root
          V250_DB_PASSWORD: root
        run: php server/tests/v250_platform_payment_mysql.php

      - name: Platform paid order auto publish real MySQL integration
        env:
          V250_PLATFORM_MYSQL_TEST: '1'
          V250_DB_NAME: worker_test
          V250_DB_HOST: 127.0.0.1
          V250_DB_USER: root
          V250_DB_PASSWORD: root
        run: php server/tests/v250_platform_auto_publish_mysql.php

      - name: Order cancellation automation real MySQL integration
        env:
          V250_PLATFORM_MYSQL_TEST: '1'
          V250_DB_NAME: worker_test
          V250_DB_HOST: 127.0.0.1
          V250_DB_USER: root
          V250_DB_PASSWORD: root
        run: php server/tests/v250_order_cancellation_mysql.php

      - name: Web cancellation refund reviewer ID-domain MySQL integration
        env:
          V250_PLATFORM_MYSQL_TEST: '1'
          V250_DB_NAME: worker_test
          V250_DB_HOST: 127.0.0.1
          V250_DB_USER: root
          V250_DB_PASSWORD: root
        run: php server/tests/v250_order_cancellation_web_review_mysql.php

      - name: Admin dispute adjudication real MySQL integration
        env:
