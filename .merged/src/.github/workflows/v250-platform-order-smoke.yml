          V250_DB_PASSWORD: root
        run: php server/tests/v250_order_cancellation_risk_mysql.php

      - name: Agreed refund execution boundary real MySQL integration
        env:
          V250_PLATFORM_MYSQL_TEST: '1'
          V250_DB_NAME: worker_test
          V250_DB_HOST: 127.0.0.1
          V250_DB_USER: root
          V250_DB_PASSWORD: root
        run: php server/tests/v250_refund_execution_boundary_mysql.php

      - name: Contact reveal automation real MySQL integration
        env:
          V250_PLATFORM_MYSQL_TEST: '1'
          V250_DB_NAME: worker_test
          V250_DB_HOST: 127.0.0.1
          V250_DB_USER: root
          V250_DB_PASSWORD: root
        run: php server/tests/v250_contact_reveal_mysql.php

      - name: Measurement hold extension real MySQL integration
        env:
          V250_PLATFORM_MYSQL_TEST: '1'
          V250_DB_NAME: worker_test
          V250_DB_HOST: 127.0.0.1
          V250_DB_USER: root
          V250_DB_PASSWORD: root
        run: php server/tests/v250_measurement_hold_extension_mysql.php

      - name: Repair intervention automation real MySQL integration
        env:
