name: V2.5.0 Async and Transaction Safety

on:
  push:
    branches:
      - dev/2.5.0
  pull_request:
    branches:
      - dev/2.5.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transaction-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: worker_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3.36
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.36'
          extensions: pdo_mysql,pdo_sqlite,mbstring,curl,openssl,fileinfo,gd,simplexml,ctype,sodium
          coverage: none

      - name: PHP syntax
        run: |
          set -euo pipefail
          php -l server/app/Core/Database.php
          php -l server/app/Domain/Admin/WorkbenchTaskProjection.php
          php -l server/app/Contracts/SchedulerAdminRepository.php
          php -l server/app/Application/Scheduling/SchedulerAdminConsole.php
          php -l server/app/Foundation/SchedulerAdminComposition.php
          php -l server/app/Infrastructure/Persistence/DatabaseSchedulerAdminRepository.php
          php -l server/app/Http/Admin/Modules/SchedulerAdminModule.php
          php -l server/app/Infrastructure/Scheduling/MediaPromotionTask.php
          php -l server/app/Infrastructure/Scheduling/LegacySchedulerGateway.php
          php -l server/app/Infrastructure/Persistence/DatabaseOrderQuoteSelectionRepository.php
          php -l server/app/Infrastructure/Persistence/RepairGuardedPlatformOrderAdminRepository.php
          php -l server/app/Application/Order/OrderDispute.php
          php -l server/app/Infrastructure/Persistence/DatabaseOrderDisputeRepository.php
          php -l server/app/Http/Api/Modules/OrderDisputeApiModule.php
          php -l server/tests/v250_async_transaction_regression.php
          php -l server/tests/v250_transaction_mysql.php
          php -l server/tests/v250_platform_publish_repair_guard_mysql.php
          php -l server/tests/v250_dispute_negotiation_regression.php
          php -l server/tests/v250_admin_dispute_resolution_mysql.php

      - name: Async and transaction source regression
        run: php server/tests/v250_async_transaction_regression.php

      - name: Dispute negotiation and admin resolution regression
        run: php server/tests/v250_dispute_negotiation_regression.php

      - name: Install MySQL client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y default-mysql-client

      - name: Import schema on MySQL 5.7
        env:
          MYSQL_PWD: root
        run: mysql -h 127.0.0.1 -P 3306 -uroot worker_test < server/database/database.sql

      - name: MySQL nested transaction and two-connection lock regression
        env:
          V250_PLATFORM_MYSQL_TEST: '1'
          V250_DB_NAME: worker_test
          V250_DB_HOST: 127.0.0.1
          V250_DB_USER: root
          V250_DB_PASSWORD: root
        run: php server/tests/v250_transaction_mysql.php

      - name: Manual platform publish anomaly guard on MySQL 5.7
        env:
          V250_PLATFORM_MYSQL_TEST: '1'
          V250_DB_NAME: worker_test
          V250_DB_HOST: 127.0.0.1
          V250_DB_USER: root
          V250_DB_PASSWORD: root
        run: php server/tests/v250_platform_publish_repair_guard_mysql.php

      - name: Admin dispute resolution on MySQL 5.7
        env:
          V250_PLATFORM_MYSQL_TEST: '1'
          V250_DB_NAME: worker_test
          V250_DB_HOST: 127.0.0.1
          V250_DB_USER: root
          V250_DB_PASSWORD: root
        run: php server/tests/v250_admin_dispute_resolution_mysql.php
